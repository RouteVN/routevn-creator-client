name: Lint
on:
  pull_request:
  workflow_dispatch:

jobs:
  project-compatibility:
    runs-on: ubuntu-latest
    env:
      ROUTEVN_COMPATIBILITY_ARTIFACTS: ${{ github.workspace }}/.compatibility-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps chromium webkit
      - name: Frozen old-project compatibility
        run: bun run test:project-compatibility
      - name: Strict schema validation and persisted acceptance
        run: bun run test:strict-validation
      - name: Strict browser acceptance
        run: |
          bun run test:strict-browser
          bun run test:strict-browser --webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-compatibility
          path: .compatibility-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Checkout Route Engine
        uses: actions/checkout@v4
        with:
          repository: RouteVN/route-engine
          ref: bbd551d2aaa8c5a77a9d7c9619c27ebbf4ae5e54
          path: _deps/route-engine

      - name: Build Route Engine
        working-directory: _deps/route-engine
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Checkout Route Graphics
        uses: actions/checkout@v4
        with:
          repository: RouteVN/route-graphics
          ref: 15a27057513b768272d63482810ebe6689f5427a
          path: _deps/route-graphics

      - name: Build Route Graphics
        working-directory: _deps/route-graphics
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Link runtime dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/_deps/route-engine" "$GITHUB_WORKSPACE/../route-engine"
          ln -s "$GITHUB_WORKSPACE/_deps/route-graphics" "$GITHUB_WORKSPACE/../route-graphics"

      # Install dependencies from root
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install rtgl CLI
        run: bun install -g rtgl

      - name: Verify rtgl
        run: |
          which rtgl
          rtgl --version

      - name: Lint
        run: bun run lint

      - name: Install editor test browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Scene editor regression tests
        run: bun run test:scene-editor

      - name: Window control regression tests
        run: bun run test:window-controls

      - name: Build Web
        run: bun run build:web
