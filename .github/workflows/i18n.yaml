name: i18n
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check locale catalogs
        run: bun run check:i18n
