                    id: section-a
                    name: Section A
                    lines:
                      items:
                        line-a:
                          id: line-a
                          actions:
                            say: hello
                        line-b:
                          id: line-b
                          actions:
                            say: bye
                      tree:
                        - id: line-a
                          children: []
                        - id: line-b
                          children: []
                  section-b:
                    id: section-b
                    name: Section B
                    lines:
                      items:
                        line-other:
                          id: line-other
                          actions:
                            say: other
                      tree:
                        - id: line-other
                          children: []
                tree:
                  - id: section-a
                    children: []
                  - id: section-b
                    children: []
            folder-scenes:
              id: folder-scenes
              type: folder
              name: Folder
            scene-b:
              id: scene-b
              type: scene
              name: Middle
              sections:
                items:
                  section-other:
                    id: section-other
                    name: Other
                    lines:
                      items: {}
                      tree: []
                tree:
                  - id: section-other
                    children: []
          tree:
            - id: scene-a
              children: []
            - id: folder-scenes
              children:
                - id: scene-b
                  children: []
