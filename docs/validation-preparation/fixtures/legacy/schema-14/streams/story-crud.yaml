  - type: story.update
    payload:
      data:
        initialSceneId: scene-b
  - type: scene.create
    payload:
      sceneId: scene-c
      parentId: folder-scenes
      data:
        name: Flashback
  - type: scene.update
    payload:
      sceneId: scene-a
      data:
        description: Updated scene summary
  - type: scene.move
    payload:
      sceneId: scene-c
      position: after
      positionTargetId: scene-a
  - type: section.create
    payload:
      sectionId: section-c
      sceneId: scene-a
      data:
        name: Section C
  - type: section.update
    payload:
      sectionId: section-a
      data:
        name: Section A Updated
  - type: section.move
    payload:
      sectionId: section-b
      position: before
      positionTargetId: section-a
  - type: line.create
    payload:
      sectionId: section-a
      lines:
        - lineId: line-c
          data:
            actions:
              say: new
  - type: line.update_actions
    payload:
      lineId: line-a
      data:
        mood: tense
        background:
          resourceId: image-rich
          opacity: 0.5
          blur:
            x: 6
            "y": 9
            quality: 3
            kernelSize: 9
            repeatEdgePixels: true
  - type: line.move
    payload:
      lineId: line-b
      toSectionId: section-b
      position: last
  - type: line.delete
    payload:
      lineIds:
        - line-c
  - type: section.delete
    payload:
      sectionIds:
        - section-c
  - type: scene.delete
    payload:
      sceneIds:
        - scene-c
