refs:
  setupFolderButton:
    eventListeners:
      click:
        handler: handleSetup
  confirmFolderButton:
    eventListeners:
      click:
        handler: handleConfirm
  continueFolderButton:
    eventListeners:
      click:
        handler: handleContinue
template:
  - 'rtgl-view w=f h=f bgc=bg d=v ah=c sv style="box-sizing: border-box; padding: max(48px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));"':
      - 'rtgl-view w=f g=lg style="max-width: 440px; margin-top: auto;"':
          - $if !hasCandidate && !hasSavedFolder:
              - rtgl-svg svg=folder wh=48 c=mu-fg: null
              - rtgl-text s=sm c=mu-fg: ${copy.oneTimeSetup}
          - rtgl-text s=h2: ${title}
          - $if !hasCandidate && !hasSavedFolder:
              - rtgl-text c=mu-fg: ${copy.description}
          - $if hasCandidate || hasSavedFolder:
              - 'rtgl-view w=f d=h av=c g=sm p=lg bw=xs bc=bo br=md style="box-sizing: border-box;"':
                  - 'rtgl-svg svg=folder wh=20 c=mu-fg aria-hidden=true style="flex-shrink: 0;"': null
                  - 'rtgl-text#projectFolderPath w=1fg style="min-width: 0; overflow-wrap: anywhere;"': ${displayPath}
          - $if errorMessage:
              - rtgl-text#projectFolderError role=alert s=sm: ${errorMessage}
          - $if isBusy:
              - rtgl-text role=status s=sm c=mu-fg: ${copy.working}
          - $if hasCandidate:
              - rtgl-button#confirmFolderButton w=f ?disabled=${isBusy}: ${copy.confirm}
          - rtgl-button#setupFolderButton w=f v=ol ?disabled=${isBusy}: ${setupLabel}
          - $if hasSavedFolder && !hasCandidate:
              - rtgl-button#continueFolderButton w=f ?disabled=${isBusy}: ${copy.continue}
      - 'rtgl-view h=48 aria-hidden=true style="flex: 0 0 48px; margin-bottom: auto;"': null
      - 'rtgl-view h=240 aria-hidden=true style="flex: 0 0 240px;"': null
