refs:
  backButton:
    eventListeners:
      click:
        handler: handleBackClick
  undoButton:
    eventListeners:
      click:
        handler: handleUndoButtonClick
  redoButton:
    eventListeners:
      click:
        handler: handleRedoButtonClick
  textStylePreview:
    eventListeners:
      font-load-error:
        handler: handlePreviewFontLoadError
  rightPanelModeTabs:
    eventListeners:
      item-click:
        handler: handleRightPanelModeChange
  savePreviewButton:
    eventListeners:
      click:
        handler: handleSavePreviewClick
  textStyleForm:
    eventListeners:
      form-change:
        handler: handleTextStyleFormChange
  sliderValueField*:
    eventListeners:
      value-input:
        handler: handleSliderValueInput
      value-change:
        handler: handleSliderValueChange
      value-cancel:
        handler: handleSliderValueCancel
  fontSelect:
    eventListeners:
      value-change:
        handler: handleFontSelectChange
      add-option-click:
        handler: handleFontSelectAddOptionClick
  colorSelect:
    eventListeners:
      value-change:
        handler: handleColorSelectChange
      add-option-click:
        handler: handleColorSelectAddOptionClick
  outlineColorSelect:
    eventListeners:
      value-change:
        handler: handleColorSelectChange
      add-option-click:
        handler: handleColorSelectAddOptionClick
  shadowColorSelect:
    eventListeners:
      value-change:
        handler: handleColorSelectChange
      add-option-click:
        handler: handleColorSelectAddOptionClick
  previewTextInput:
    eventListeners:
      value-input:
        handler: handlePreviewTextInput
      value-change:
        handler: handlePreviewTextInput
  previewAlignControl:
    eventListeners:
      value-change:
        handler: handlePreviewAlignChange
  addColorDialog:
    eventListeners:
      close:
        handler: handleAddColorDialogClose
  addColorForm:
    eventListeners:
      keydown:
        handler: handleAddColorFormSubmitKeyDown
  addColorSubmitButton:
    eventListeners:
      click:
        handler: handleAddColorSubmitClick
  addFontDialog:
    eventListeners:
      close:
        handler: handleAddFontDialogClose
  fontDragDrop:
    eventListeners:
      file-selected:
        handler: handleFontFileSelected
      file-rejected:
        handler: handleFontFileRejected
  addFontForm:
    eventListeners:
      keydown:
        handler: handleAddFontFormSubmitKeyDown
  addFontSubmitButton:
    eventListeners:
      click:
        handler: handleAddFontSubmitClick
template:
  - 'rtgl-view d=h w=f h=f style="min-width: 0; min-height: 0;"':
      - $if showExplorerPanel:
          - rvn-resizable-panel w=300 min-w=200 max-w=500 resize-side="right":
              - rtgl-view slot="content" w=f h=f:
                  - rvn-resource-types :resourceCategory=${resourceCategory} :selectedResourceId=${selectedResourceId}: null
      - 'rtgl-view w=1fg h=f d=v style="min-width: 0; min-height: 0;"':
          - rtgl-view h=48 bwb=xs bc=bo d=h av=c w=f ph=md:
              - rtgl-button#backButton sq pre=chevronLeft v=ol mr=sm: null
              - 'rtgl-view w=1fg style="min-width: 0;"':
                  - rtgl-text w=f ellipsis=true: ${textStyleName}
              - rtgl-view d=h av=c g=xs ml=sm:
                  - 'rtgl-button#undoButton sq pre=undo v=ol ?disabled=${undoDisabled} aria-label="${undoLabel}" title="${undoLabel}"': null
                  - 'rtgl-button#redoButton sq pre=redo v=ol ?disabled=${redoDisabled} aria-label="${redoLabel}" title="${redoLabel}"': null
          - 'rtgl-view d=v h=1fg w=f style="min-height: 0; container-type: size;"':
              - 'div style="${previewAreaStyle} display: flex; flex-direction: column; justify-content: center; width: 100%; padding: 16px; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background-color: var(--background); background-image: radial-gradient(circle, var(--input) 1px, transparent 1px); background-size: 24px 24px;"':
                  - 'rtgl-view#textStylePreviewFrame w=f bw=xs bc=bo br=md style="${previewFrameStyle} flex: 0 0 auto; min-width: 0; min-height: 0; overflow: hidden;"':
                      - rvn-font-preview#textStylePreview mode=live h=f :fontFamilies=${previewFontFamilies} previewText="${previewText}" :fileIds=${previewFontFileIds} :fontWeightDescriptors=${previewFontWeightDescriptors} fontSize=${previewFontSize} lineHeight=${previewLineHeight} color=${previewColor} strokeColor=${previewStrokeColor} strokeWidth=${previewStrokeWidth} fontWeight=${previewFontWeight} shadowColor=${previewShadowColor} shadowAlpha=${previewShadowAlpha} shadowBlur=${previewShadowBlur} shadowOffsetX=${previewShadowOffsetX} shadowOffsetY=${previewShadowOffsetY} width=f padding=24 av=c textAlign=${previewAlign}: null
              - $if showMobilePanels:
                  - 'rtgl-view w=f h=1fg d=v bwt=xs style="min-height: 0;"':
                      - rtgl-view h=48 w=f d=h bgc=bg bwb=xs ph=md av=c:
                          - 'rtgl-view w=1fg style="min-width: 0;"':
                              - rtgl-tabs#rightPanelModeTabs s=sm selected-tab=${rightPanelMode} :items=${rightPanelModeTabs}: null
                          - $if showSavePreviewButton:
                              - 'rtgl-button#savePreviewButton sq pre=save v=se ml=sm ?disabled=${savePreviewDisabled} aria-label="${savePreviewButton}" title="${savePreviewButton}"': null
                      - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0; ${rightPanelEditStyle}"':
                          - rtgl-form#textStyleForm key=${textStyleFormKey} :defaultValues=${formValues} :form=${textStyleForm} w=f ph=md:
                              - rtgl-select#fontSelect slot=text-style-font w=f no-clear :options=${fontOptions} :selectedValue=${selectedFontId} :addOption=${addFontOption} placeholder=${chooseFontPlaceholder}: null
                              - 'rvn-slider-value-field#sliderValueFieldFontSize slot=text-style-font-size data-name=fontSize w=f label="${fontSizeLabel}" :value=${fontSizeValue} :field=${fontSizeSliderField}': null
                              - 'rvn-slider-value-field#sliderValueFieldLineHeight slot=text-style-line-height data-name=lineHeight w=f label="${lineHeightLabel}" :value=${lineHeightValue} :field=${lineHeightSliderField}': null
                              - rtgl-select#colorSelect slot=text-style-color data-color-field=colorId w=f no-clear :options=${colorOptions} :selectedValue=${selectedColorId} :addOption=${addColorOption} placeholder=${chooseColorPlaceholder}: null
                              - rtgl-select#outlineColorSelect slot=text-style-outline-color data-color-field=strokeColorId w=f :options=${colorOptions} :selectedValue=${selectedOutlineColorId} :addOption=${addColorOption} placeholder=${chooseOutlineColorPlaceholder}: null
                              - rtgl-select#shadowColorSelect slot=text-style-shadow-color data-color-field=shadowColorId w=f :options=${colorOptions} :selectedValue=${selectedShadowColorId} :addOption=${addColorOption} placeholder=${chooseShadowColorPlaceholder}: null
                          - 'rtgl-view h=25vh aria-hidden=true style="flex-shrink: 0;"': null
                      - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0; ${rightPanelPreviewStyle}"':
                          - rtgl-view d=v w=f g=sm ph=md:
                              - rtgl-view d=v w=f g=xs:
                                  - rtgl-text s=sm: ${previewTextLabel}
                                  - rtgl-text s=xs c=mu-fg: ${previewTextDescription}
                              - rtgl-textarea#previewTextInput w=f rows=3 value="${previewTextInputValue}" placeholder="${textStyleName}": null
                          - rtgl-view d=v w=f g=sm ph=md mt=lg:
                              - rtgl-view d=v w=f g=xs:
                                  - rtgl-text s=sm: ${previewAlignmentLabel}
                                  - rtgl-text s=xs c=mu-fg: ${previewAlignmentDescription}
                              - rtgl-segmented-control#previewAlignControl w=f no-clear :selectedValue=${previewAlign} :options=${previewAlignOptions}: null
                          - 'rtgl-view h=25vh aria-hidden=true style="flex-shrink: 0;"': null
      - $if showRightPanel:
          - rvn-resizable-panel panel-type=detail-panel show-on-touch w=300 min-w=200 max-w=500 resize-side="left":
              - 'rtgl-view slot=content d=v w=f h=f style="min-width: 0; min-height: 0;"':
                  - rtgl-view h=48 w=f d=h bgc=bg bwb=xs ph=md av=c:
                      - 'rtgl-view w=1fg style="min-width: 0;"':
                          - rtgl-tabs#rightPanelModeTabs s=sm selected-tab=${rightPanelMode} :items=${rightPanelModeTabs}: null
                      - $if showSavePreviewButton:
                          - 'rtgl-button#savePreviewButton sq pre=save v=se ml=sm ?disabled=${savePreviewDisabled} aria-label="${savePreviewButton}" title="${savePreviewButton}"': null
                  - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0; ${rightPanelEditStyle}"':
                      - rtgl-form#textStyleForm key=${textStyleFormKey} :defaultValues=${formValues} :form=${textStyleForm} w=f ph=md:
                          - rtgl-select#fontSelect slot=text-style-font w=f no-clear :options=${fontOptions} :selectedValue=${selectedFontId} :addOption=${addFontOption} placeholder=${chooseFontPlaceholder}: null
                          - 'rvn-slider-value-field#sliderValueFieldFontSize slot=text-style-font-size data-name=fontSize w=f label="${fontSizeLabel}" :value=${fontSizeValue} :field=${fontSizeSliderField}': null
                          - 'rvn-slider-value-field#sliderValueFieldLineHeight slot=text-style-line-height data-name=lineHeight w=f label="${lineHeightLabel}" :value=${lineHeightValue} :field=${lineHeightSliderField}': null
                          - rtgl-select#colorSelect slot=text-style-color data-color-field=colorId w=f no-clear :options=${colorOptions} :selectedValue=${selectedColorId} :addOption=${addColorOption} placeholder=${chooseColorPlaceholder}: null
                          - rtgl-select#outlineColorSelect slot=text-style-outline-color data-color-field=strokeColorId w=f :options=${colorOptions} :selectedValue=${selectedOutlineColorId} :addOption=${addColorOption} placeholder=${chooseOutlineColorPlaceholder}: null
                          - rtgl-select#shadowColorSelect slot=text-style-shadow-color data-color-field=shadowColorId w=f :options=${colorOptions} :selectedValue=${selectedShadowColorId} :addOption=${addColorOption} placeholder=${chooseShadowColorPlaceholder}: null
                      - 'rtgl-view h=25vh aria-hidden=true style="flex-shrink: 0;"': null
                  - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0; ${rightPanelPreviewStyle}"':
                      - rtgl-view d=v w=f g=sm ph=md:
                          - rtgl-view d=v w=f g=xs:
                              - rtgl-text s=sm: ${previewTextLabel}
                              - rtgl-text s=xs c=mu-fg: ${previewTextDescription}
                          - rtgl-textarea#previewTextInput w=f rows=3 value="${previewTextInputValue}" placeholder="${textStyleName}": null
                      - rtgl-view d=v w=f g=sm ph=md mt=lg:
                          - rtgl-view d=v w=f g=xs:
                              - rtgl-text s=sm: ${previewAlignmentLabel}
                              - rtgl-text s=xs c=mu-fg: ${previewAlignmentDescription}
                          - rtgl-segmented-control#previewAlignControl w=f no-clear :selectedValue=${previewAlign} :options=${previewAlignOptions}: null
                      - 'rtgl-view h=25vh aria-hidden=true style="flex-shrink: 0;"': null
  - rtgl-dialog#addColorDialog ?open=${isAddColorDialogOpen} s=sm md-layout=fixed-top p=none:
      - $if isAddColorDialogOpen:
          - 'rtgl-view slot=content w=f h=f pv=md pos=rel style="min-width: 0; min-height: 0; overflow: hidden;"':
              - 'rtgl-view h=1fg sv sbv=touch w=f style="min-height: 0;"':
                  - rtgl-form#addColorForm :defaultValues=${addColorDefaultValues} :form=${addColorForm} w=f ph=md: null
                  - 'rtgl-view h=80 aria-hidden=true style="flex: 0 0 80px;"': null
              - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md pt=md style="flex: 0 0 auto;"':
                  - rtgl-button#addColorSubmitButton v=pr: ${addColorSubmitButtonLabel}
  - rtgl-dialog#addFontDialog ?open=${isAddFontDialogOpen} md-layout=fixed-top p=none:
      - $if isAddFontDialogOpen:
          - 'rtgl-view slot=content w=f h=f pv=md pos=rel style="min-width: 0; min-height: 0; overflow: hidden;"':
              - 'rtgl-view h=1fg sv sbv=touch w=f style="min-height: 0;"':
                  - rtgl-form#addFontForm :defaultValues=${addFontDefaultValues} :form=${addFontForm} w=f ph=md:
                      - rtgl-view slot=font-upload d=v g=sm:
                          - rvn-drag-drop#fontDragDrop uploadText="${dragDropText}" :acceptedFileTypes=${fontFileTypes}: null
                          - $if hasSelectedFont:
                              - rtgl-view d=h g=sm av=c mt=sm:
                                  - rtgl-text s=sm c=success: '${fontSelectedLabel} ${selectedFontFileName}'
                  - 'rtgl-view h=80 aria-hidden=true style="flex: 0 0 80px;"': null
              - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md pt=md style="flex: 0 0 auto;"':
                  - rtgl-button#addFontSubmitButton v=pr: ${addFontSubmitButtonLabel}
