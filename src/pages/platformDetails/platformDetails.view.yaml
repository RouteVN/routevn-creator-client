refs:
  addPlatformButton:
    eventListeners:
      click:
        handler: handleAddPlatformButtonClick
  addPlatformMenu:
    eventListeners:
      close:
        handler: handleAddPlatformMenuClose
      item-click:
        handler: handleAddPlatformMenuItemClick
  platformTabs:
    eventListeners:
      item-click:
        handler: handlePlatformTabClick
  platformEditButton:
    eventListeners:
      click:
        handler: handlePlatformEditButtonClick
  platformApplicationIcon:
    eventListeners:
      click:
        handler: handlePlatformEditButtonClick
  platformApplicationIdentifier:
    eventListeners:
      click:
        handler: handlePlatformEditButtonClick
  platformApplicationName:
    eventListeners:
      click:
        handler: handlePlatformEditButtonClick
  platformEditDialog:
    eventListeners:
      close:
        handler: handlePlatformEditDialogClose
  platformEditForm:
    eventListeners:
      form-change:
        handler: handlePlatformEditFormChange
      form-action:
        handler: handlePlatformEditFormAction
  platformEditDialogIcon:
    eventListeners:
      click:
        handler: handlePlatformEditDialogIconClick
  platformEditIconCropDialog:
    eventListeners:
      close:
        handler: handlePlatformEditIconCropDialogClose
      confirm:
        handler: handlePlatformEditIconCropDialogConfirm
  adaptiveIconButton:
    eventListeners:
      click:
        handler: handlePlatformEditDialogIconClick
        payload:
          target: adaptive
  adaptiveIconRemove:
    eventListeners:
      click:
        handler: handleRemovePlatformEditOptionalIcon
        payload:
          target: adaptive
  splashIconButton:
    eventListeners:
      click:
        handler: handlePlatformEditDialogIconClick
        payload:
          target: splash
  splashIconRemove:
    eventListeners:
      click:
        handler: handleRemovePlatformEditOptionalIcon
        payload:
          target: splash
template:
  - 'rtgl-view d=h w=f h=f style="min-width: 0; min-height: 0;"':
      - 'rtgl-view d=h h=f w=f style="min-width: 0; min-height: 0;"':
          - $if showExplorerPanel:
              - rvn-resizable-panel#fileExplorer w=300 min-w=200 max-w=500 resize-side="right":
                  - rtgl-view slot="content" w=f h=f:
                      - rvn-resource-types :resourceCategory=${resourceCategory} :selectedResourceId=${selectedResourceId}: null
          - 'rtgl-view w=1fg h=f pl=${contentLeftPadding} d=v style="min-width: 0; min-height: 0;"':
              - 'rtgl-view h=48 w=f bgc=bg bwb=xs ph=md av=c style="flex-shrink: 0;"':
                  - rtgl-view w=f d=h av=c g=md:
                      - rtgl-text w=1fg: ${title}
                      - $if canAddPlatform:
                          - 'rtgl-button#addPlatformButton v=pr pre=plus title="${addPlatformButtonLabel}" aria-label="${addPlatformButtonLabel}"': ${addPlatformButtonLabel}
              - 'rtgl-view w=f h=1fg pt=md sv style="min-width: 0; min-height: 0; ${tabletLandscapeContentStyle}"':
                  - $if hasPlatformDetails:
                      - rtgl-view w=f d=v g=md:
                          - rtgl-view w=f ph=md:
                              - 'rtgl-tabs#platformTabs aria-label="${platformTabsLabel}" selected-tab=${selectedPlatform} :items=${platformTabs}': null
                          - rtgl-view w=f h=48 ph=md d=h av=c g=md:
                              - rtgl-text w=1fg s=h3: ${selectedPlatformTitle}
                              - 'rtgl-button#platformEditButton v=ol sq pre=edit title="${platformEditButtonLabel}" aria-label="${platformEditButtonLabel}"': null
                          - rvn-detail-view#platformDetailView w=f :fields=${platformDetailFields} :fillHeight=${detailFillHeight}:
                              - rtgl-view#platformApplicationName slot=platform-application-name cur=pointer:
                                  - rtgl-text: ${platformApplicationName}
                              - $if showPlatformApplicationIcon:
                                  - $if platformApplicationIconFileId:
                                      - rvn-file-image#platformApplicationIcon slot=platform-application-icon fileId=${platformApplicationIconFileId} w=128 h=128 bw=xs bc=bo br=md cur=pointer: null
                                    $else:
                                      - rtgl-image#platformApplicationIcon slot=platform-application-icon src="/public/project_logo_placeholder.png" w=128 h=128 bw=xs bc=bo br=md cur=pointer: null
                              - $if showAndroidPreviews:
                                  - rtgl-view slot=android-adaptive-icon:
                                      - $if adaptiveIconFileId:
                                          - 'div style="width:128px; height:128px; ${androidIconBackgroundStyle}"':
                                              - rvn-file-image fileId=${adaptiveIconFileId} w=128 h=128: null
                                        $else:
                                          - rtgl-text c=mu-fg: ${usesAppIconLabel}
                              - $if showAndroidPreviews:
                                  - rtgl-view slot=android-splash-icon:
                                      - $if splashIconFileId:
                                          - 'div style="width:128px; height:128px; ${androidSplashBackgroundStyle}"':
                                              - rvn-file-image fileId=${splashIconFileId} w=128 h=128: null
                                        $else:
                                          - rtgl-text c=mu-fg: ${usesAppIconLabel}
                              - $if showAndroidPreviews:
                                  - rtgl-view slot=android-previews d=v g=md w=f:
                                      - rtgl-text s=sm: ${androidLauncherPreviewLabel}
                                      - rtgl-view d=h g=md wrap:
                                          - 'div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; ${androidIconBackgroundStyle}"':
                                              - rvn-file-image fileId=${androidLauncherPreviewFileId} w=${androidLauncherPreviewSize} h=${androidLauncherPreviewSize}: null
                                          - 'div style="width: 96px; height: 96px; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; ${androidIconBackgroundStyle}"':
                                              - rvn-file-image fileId=${androidLauncherPreviewFileId} w=${androidLauncherPreviewSize} h=${androidLauncherPreviewSize}: null
                                      - rtgl-text s=sm: ${androidSplashPreviewLabel}
                                      - 'div style="width: 200px; height: 160px; display: flex; align-items: center; justify-content: center; border-radius: 8px; ${androidSplashBackgroundStyle}"':
                                          - 'div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;"':
                                              - rvn-file-image fileId=${androidSplashPreviewFileId} w=${androidSplashPreviewSize} h=${androidSplashPreviewSize}: null
                              - rtgl-view#platformApplicationIdentifier slot=platform-application-identifier cur=pointer:
                                  - rtgl-text: ${platformApplicationIdentifier}
                    $else:
                      - rtgl-view w=f h=f av=c ah=c ph=md:
                          - rtgl-text c=mu-fg ta=c: ${emptyPlatformsMessage}
                  - 'rtgl-view w=f h=240 aria-hidden=true style="flex: 0 0 240px;"': null
  - rtgl-dropdown-menu#addPlatformMenu ?open=${addPlatformMenu.isOpen} x=${addPlatformMenu.x} y=${addPlatformMenu.y} :items=${addPlatformMenu.items}: null
  - rtgl-dialog#platformEditDialog ?open=${isPlatformEditDialogOpen} s=md:
      - $if isPlatformEditDialogOpen:
          - rtgl-view slot=content:
              - rtgl-form#platformEditForm key=${platformDialogKey} :defaultValues=${platformEditDefaultValues} :form=${platformEditForm} w=f:
                  - $if showPlatformEditIcon:
                      - 'button#platformEditDialogIcon type=button slot=platform-application-icon-edit aria-label="${clickToUploadLabel}" title="${clickToUploadLabel}" style="width: 120px; height: 120px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;"':
                          - $if platformEditIconFileId:
                              - rvn-file-image fileId=${platformEditIconFileId} w=120 h=120 bw=xs bc=bo br=md: null
                            $else:
                              - rtgl-view w=120 h=120 ah=c av=c ph=sm bw=xs bc=bo br=md:
                                  - rtgl-text c=mu-fg s=sm ta=c: ${clickToUploadLabel}
                  - $if showAndroidIcons:
                      - rtgl-view slot=platform-android-adaptive-icon-edit d=v g=sm:
                          - 'button#adaptiveIconButton type=button aria-label="${clickToUploadLabel}" style="width:120px; height:120px; padding:0; border:0; cursor:pointer; ${editIconBackgroundStyle}"':
                              - $if platformEditAdaptiveIconFileId:
                                  - rvn-file-image fileId=${platformEditAdaptiveIconFileId} w=120 h=120 bw=xs bc=bo br=md: null
                                $else:
                                  - rtgl-view w=120 h=120 ah=c av=c ph=sm bw=xs bc=bo br=md:
                                      - rtgl-text c=mu-fg s=sm ta=c: ${clickToUploadLabel}
                          - $if platformEditAdaptiveIconFileId:
                              - rtgl-button#adaptiveIconRemove v=ol: ${removeIconLabel}
                  - $if showAndroidIcons:
                      - rtgl-view slot=platform-android-splash-icon-edit d=v g=sm:
                          - 'button#splashIconButton type=button aria-label="${clickToUploadLabel}" style="width:120px; height:120px; padding:0; border:0; cursor:pointer; ${editSplashBackgroundStyle}"':
                              - $if platformEditSplashIconFileId:
                                  - rvn-file-image fileId=${platformEditSplashIconFileId} w=120 h=120 bw=xs bc=bo br=md: null
                                $else:
                                  - rtgl-view w=120 h=120 ah=c av=c ph=sm bw=xs bc=bo br=md:
                                      - rtgl-text c=mu-fg s=sm ta=c: ${clickToUploadLabel}
                          - $if platformEditSplashIconFileId:
                              - rtgl-button#splashIconRemove v=ol: ${removeIconLabel}
  - rvn-square-image-crop-dialog#platformEditIconCropDialog :open=${isPlatformEditIconCropDialogOpen} :file=${platformEditIconCropFile} :outputSize=${platformEditIconOutputSize} :guideCircle=${guideCircle} :title=${cropTitle} :description=${cropDescription}: null
