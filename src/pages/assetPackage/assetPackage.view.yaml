refs:
  backButton:
    eventListeners:
      click:
        handler: handleBackClick
  pickResourcesButton:
    eventListeners:
      click:
        handler: handlePickResourcesClick
  pickerDialog:
    eventListeners:
      close:
        handler: handlePickerClose
  pickerDoneButton:
    eventListeners:
      click:
        handler: handlePickerDoneClick
  pickerType*:
    eventListeners:
      click:
        handler: handlePickerTypeClick
  pickerFolder*:
    eventListeners:
      click:
        handler: handlePickerFolderClick
  downloadAssetPackageButton:
    eventListeners:
      click:
        handler: handleDownloadAssetPackageButtonClick
styles:
  # A folder's resources as small tiles, as many to a row as fit.
  ".assetPackageFolderGrid":
    display: grid
    grid-template-columns: repeat(auto-fill, 80px)
    gap: var(--spacing-sm)
    width: 100%
  # The picker fills the window's height, whichever type it shows; its lists
  # scroll.
  '#pickerContent':
    height: calc(100vh - 96px)
  '@supports (height: 100dvh)':
    '#pickerContent':
      height: calc(100dvh - 96px)
template:
  - 'rtgl-view d=h w=f h=f style="min-width: 0; min-height: 0;"':
      - 'rtgl-view d=h h=f w=f style="min-width: 0; min-height: 0;"':
          - $if showExplorerPanel:
              - rvn-resizable-panel#fileExplorer w=300 min-w=200 max-w=500 resize-side="right":
                  - rtgl-view slot="content" w=f h=f:
                      - rvn-resource-types :resourceCategory=${resourceCategory} :selectedResourceId=${selectedResourceId}: null
          - 'rtgl-view w=1fg h=f pl=${contentLeftPadding} pos=rel style="min-width: 0; min-height: 0;"':
              - 'rtgl-view pos=abs h=1 bgc=bo style="left: 0; right: 0; top: 47px; z-index: 1001; pointer-events: none;"': null
              - 'rtgl-view w=f h=f g=sm style="min-width: 0; min-height: 0;"':
                  - 'rtgl-view h=48 w=f bgc=bg bwb=xs ph=md av=c style="position: sticky; top: 0px; z-index: 1000;"':
                      - rtgl-view w=f d=h av=c g=md:
                          - 'rtgl-button#backButton sq pre=chevronLeft v=ol aria-label="${backLabel}" title="${backLabel}"': null
                          - rtgl-text w=1fg ellipsis: ${assetPackName}
                          - rtgl-button#downloadAssetPackageButton v=pr pre=download ?disabled=${exportDisabled}: ${i18n.assetPackagePage.downloadAssetPackageButton}
                  - 'rtgl-view h=1fg w=f sv style="min-width: 0;"':
                      - 'rtgl-view d=v g=md w=f ph=md pt=md style="min-width: 0; padding-bottom: 32vh; box-sizing: border-box;"':
                          - 'rtgl-view w=f d=v g=xl style="max-width: 880px;"':
                              # Only what is picked; Add folders opens the picker for the rest.
                              - rtgl-view w=f d=v g=md:
                                  - rtgl-view w=f d=h av=c g=sm:
                                      - rtgl-text s=lg w=1fg: ${pickedTitle}
                                      - rtgl-button#pickResourcesButton v=ol pre=edit: ${pickResourcesLabel}
                                  - $if !hasPicks:
                                      - rtgl-text s=sm c=mu-fg: ${nothingPickedMessage}
                                  # No box around a folder: its name, then its tiles.
                                  - $for section, sectionIndex in pickedSections:
                                      - rtgl-view w=f d=v g=md:
                                          - rtgl-text s=sm c=mu-fg: ${section.label}
                                          - $for folder, folderIndex in section.folders:
                                              - rtgl-view w=f d=v g=sm:
                                                  - rtgl-view w=f d=h av=c g=sm:
                                                      - rtgl-svg svg=folder wh=16 c=mu-fg: null
                                                      - rtgl-text s=sm: ${folder.name}
                                                  - $if folder.resourceCount:
                                                      - div.assetPackageFolderGrid:
                                                          - $for tile, tileIndex in folder.items:
                                                              - rvn-asset-package-preview-tile :preview=${tile}: null
                              # What the picks use comes along; the store does not show it.
                              - $if comesWith.isInvalid:
                                  - rtgl-text s=sm c=de: ${comesWith.invalidMessage}
                              - $if comesWith.isVisible:
                                  # Laid out as the picks: each type's tiles, with the picks
                                  # that use each in its tooltip.
                                  - rtgl-view w=f d=v g=md:
                                      - rtgl-view w=f d=v g=xs:
                                          - rtgl-text s=lg: ${comesWith.title}
                                          - rtgl-text s=sm c=mu-fg: ${comesWith.hint}
                                      - $for group, groupIndex in comesWith.groups:
                                          - rtgl-view w=f d=v g=sm:
                                              - rtgl-text s=sm c=mu-fg: ${group.label}
                                              - div.assetPackageFolderGrid:
                                                  - $for item, itemIndex in group.items:
                                                      - 'rtgl-view w=f title="${item.usedBy}"':
                                                          - rvn-asset-package-preview-tile :preview=${item.preview}: null
                              # Where the picks jump into the story, and the layouts they
                              # open; the importer chooses their own for each.
                              - $if comesWith.links.isVisible:
                                  - rtgl-view w=f d=v g=md:
                                      - rtgl-view w=f d=v g=xs:
                                          - rtgl-text s=lg: ${comesWith.links.title}
                                          - rtgl-text s=sm c=mu-fg: ${comesWith.links.hint}
                                      - $for link, linkIndex in comesWith.links.items:
                                          - rtgl-view w=f d=h av=c g=sm:
                                              - rtgl-svg svg=${link.icon} wh=16 c=mu-fg: null
                                              - 'rtgl-view w=1fg d=v style="min-width: 0;"':
                                                  - rtgl-text s=sm: ${link.label}
                                                  - rtgl-text s=xs c=mu-fg: ${link.usedBy}
  # One type's folders at a time, to tick or untick; Done applies the ticks.
  - rtgl-dialog#pickerDialog ?open=${isPickerOpen} s=lg md-layout=fixed-top:
      - 'rtgl-view#pickerContent slot=content d=v w=f g=md style="min-height: 0;"':
          - rtgl-view w=f d=v g=xs:
              - rtgl-text s=lg: ${pickerTitle}
              - rtgl-text s=sm c=mu-fg: ${pickerHint}
          - $if !hasPickerTypes:
              - rtgl-text s=sm c=mu-fg: ${emptyProjectMessage}
          - $if hasPickerTypes:
              - 'rtgl-view w=f h=1fg d=h sm-d=v g=md style="min-height: 0;"':
                  # The types; the picked count shows beside each.
                  - 'rtgl-view w=180 sm-w=f d=v sm-d=h g=xs sv sm-sh style="flex: 0 0 auto; align-self: stretch; min-height: 0;"':
                      - $for type, typeIndex in pickerTypes:
                          - $if type.isCurrent:
                              - 'rtgl-view#pickerType${typeIndex} data-resource-type="${type.resourceType}" d=h av=c g=sm h=32 ph=sm br=sm cur=pointer bgc=mu aria-current="true" style="flex: 0 0 auto; align-self: stretch;"':
                                  - rtgl-text s=sm w=1fg: ${type.label}
                                  - $if type.selectedCount:
                                      - rtgl-text s=sm c=mu-fg: ${type.selectedCount}
                            $else:
                              - 'rtgl-view#pickerType${typeIndex} data-resource-type="${type.resourceType}" d=h av=c g=sm h=32 ph=sm br=sm cur=pointer h-bgc=mu style="flex: 0 0 auto; align-self: stretch;"':
                                  - rtgl-text s=sm c=mu-fg w=1fg: ${type.label}
                                  - $if type.selectedCount:
                                      - rtgl-text s=sm c=mu-fg: ${type.selectedCount}
                  - 'rtgl-view w=1fg sm-w=f h=f d=v g=sm sv style="min-width: 0; min-height: 0;"':
                      - $if pickerSection.hasNoFolders:
                          - rtgl-text s=sm c=mu-fg ph=sm: ${pickerSection.noFoldersHint}
                      - $for folder, folderIndex in pickerSection.folders:
                          # The whole box ticks the folder. At its left, the picked
                          # folder's place in the pack at the top and the checkbox
                          # centered on the folder; then its name, as on the page,
                          # and its resources under it. The checkbox takes no clicks
                          # of its own, so a click counts once; Space on it still
                          # reaches the box.
                          - 'rtgl-view#pickerFolder${folderIndex} data-resource-type="${pickerSection.resourceType}" data-folder-id="${folder.folderId}" w=f d=h g=md p=sm br=md bw=xs bc=bo cur=pointer h-bgc=mu':
                              # A fixed column, so the number never moves anything.
                              - 'rtgl-view w=18 d=v ah=c g=xs style="align-self: stretch; flex: 0 0 auto;"':
                                  - rtgl-view h=20 av=c ah=c:
                                      - $if folder.pickOrder:
                                          - rtgl-view wh=18 br=sm bgc=pr av=c ah=c:
                                              - rtgl-text s=xs c=pr-fg: ${folder.pickOrder}
                                  - rtgl-view h=1fg: null
                                  - 'rtgl-checkbox#folderCheckbox${folderIndex} ?checked=${folder.selected} aria-label="${folder.name}" style="pointer-events: none;"': null
                                  - rtgl-view h=1fg: null
                                  - rtgl-view h=20: null
                              - 'rtgl-view w=1fg d=v g=sm style="min-width: 0;"':
                                  - rtgl-view w=f d=h av=c g=sm h=20:
                                      - rtgl-svg svg=folder wh=16 c=mu-fg: null
                                      - rtgl-text s=sm: ${folder.name}
                                  - $if folder.resourceCount:
                                      - div.assetPackageFolderGrid:
                                          - $for tile, tileIndex in folder.items:
                                              - rvn-asset-package-preview-tile :preview=${tile}: null
          - rtgl-view w=f d=h ah=e:
              - rtgl-button#pickerDoneButton v=pr: ${pickerDoneLabel}
