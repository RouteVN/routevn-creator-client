refs:
  saveVersionBtn:
    eventListeners:
      click:
        handler: handleSaveVersionClick
  versionItemRef*:
    eventListeners:
      click:
        handler: handleVersionItemClick
      dblclick:
        handler: handleVersionItemDoubleClick
      contextmenu:
        handler: handleVersionContextMenu
  detailExportBtn:
    eventListeners:
      click:
        handler: handleExportClick
  exportOptionsDialog:
    eventListeners:
      close:
        handler: handleExportOptionsClose
  exportOptionRef*:
    eventListeners:
      click:
        handler: handleExportOptionClick
  detailHeader:
    eventListeners:
      click:
        handler: handleDetailHeaderClick
  mobileDetailSheet:
    eventListeners:
      close:
        handler: handleMobileDetailSheetClose
  versionForm:
    eventListeners:
      form-action:
        handler: handleVersionFormAction
  versionDialog:
    eventListeners:
      close:
        handler: handleVersionFormClose
  platformDetailsDialog:
    eventListeners:
      close:
        handler: handlePlatformDetailsDialogClose
  platformDetailsCreateDialog:
    eventListeners:
      created:
        handler: handlePlatformDetailsCreated
  exportConfirmationDialog:
    eventListeners:
      close:
        handler: handleExportConfirmationClose
  exportConfirmationConfirmButton:
    eventListeners:
      click:
        handler: handleExportConfirmationConfirm
  exportConfirmationInstallerButton:
    eventListeners:
      click:
        handler: handleExportConfirmationInstallerClick
  androidExportForm:
    eventListeners:
      form-action:
        handler: handleAndroidExportFormAction
      form-change:
        handler: handleAndroidExportFormChange
  macosExportForm:
    eventListeners:
      form-action:
        handler: handleMacosExportFormAction
  iosExportForm:
    eventListeners:
      form-action:
        handler: handleIosExportFormAction
  dropdownMenu:
    eventListeners:
      close:
        handler: handleDropdownMenuClose
      item-click:
        handler: handleDropdownMenuClickItem
template:
  - 'rtgl-view d=h w=f h=f style="min-width: 0; min-height: 0;"':
      - 'rtgl-view d=h h=f w=f style="min-width: 0; min-height: 0;"':
          - $if showExplorerPanel:
              - rvn-resizable-panel#fileExplorer w=300 min-w=200 max-w=500 resize-side="right":
                  - rtgl-view slot="content" w=f h=f:
                      - rvn-resource-types :resourceCategory=${resourceCategory} :selectedResourceId=${selectedResourceId}: null
          - 'rtgl-view w=1fg h=f pl=${contentLeftPadding} pos=rel style="min-width: 0; min-height: 0;"':
              - 'rtgl-view pos=abs h=1 bgc=bo style="left: 0; right: 0; top: 47px; z-index: 1001; pointer-events: none;"': null
              - 'rtgl-view w=f h=f g=sm style="min-width: 0; min-height: 0;"':
                  - 'rtgl-view h=48 w=f bgc=bg bwb=xs ph=md av=c style="position: sticky; top: 0px; z-index: 1000;"':
                      - rtgl-view w=f d=h av=c g=md wrap:
                          - rtgl-view av=c g=sm d=h w=1fg:
                              - rtgl-text: ${title}
                          - 'rtgl-button#saveVersionBtn v=pr pre=plus title="${createButton}" aria-label="${createButton}"': ${createButton}
                  - 'rtgl-view h=1fg w=f sv style="min-width: 0;"':
                      - $if isVersionsLoading:
                          - rtgl-view w=f h=f av=c ah=c:
                              - rtgl-text s=lg c=mu-fg: ${loadingMessage}
                        $elif versions.length == 0:
                          - rtgl-view w=f h=f av=c ah=c:
                              - rtgl-view d=v ah=c g=md:
                                  - rtgl-text s=lg c=mu-fg: ${noVersionsMessage}
                        $else:
                          - 'rtgl-view d=v g=md w=f ph=md pt=md pb=sm mb=lg style="min-width: 0; ${versionListStyle}"':
                              - $for item, i in versions:
                                  - rtgl-view#versionItemRef${i} data-version-id="${item.id}" h=auto w=f bw=xs bc=${item.itemBorderColor} h-bc=${item.itemHoverBorderColor} br=md pt=md pb=sm ph=lg d=h av=c cur=pointer:
                                      - rtgl-view w=1fg d=v g=xs:
                                          - rtgl-text s=lg: ${item.name}
                                          - $if item.description:
                                              - rtgl-text s=sm c=mu-fg: ${item.description}
                                          - rtgl-text s=xs c=mu-fg: ${item.actionSummary}
                              - rtgl-view w=f h=30vh: null
          - $if showDetailPanel:
              - rvn-resizable-panel panel-type=detail-panel w=270 min-w=200 max-w=500 resize-side="left":
                  - rtgl-view wh=f slot="content":
                      - $if selectedItemId:
                          - rtgl-view d=v w=f h=f:
                              - rtgl-view#detailHeader h=48 w=f d=h bgc=bg bwb=xs ph=md av=c g=sm cur=pointer:
                                  - rtgl-text w=1fg ellipsis=true: ${selectedItemName}
                                  - rtgl-svg svg=edit wh=16: null
                              - rvn-detail-view#detailView key=${selectedItemId} w=f h=1fg :fields=${detailFields}:
                                  - rtgl-view slot=actions d=v g=sm w=f:
                                      - rtgl-button#detailExportBtn data-version-id="${selectedItemId}" v=se s=sm pre=download w=f: ${exportButton}
                        $else:
                          - rtgl-view wh=f av=c ah=c bgc=mu-fg:
                              - rtgl-text s=md c=mu-fg: ${noSelectionLabel}
  - $if showMobileDetailSheet:
      - rvn-mobile-sheet#mobileDetailSheet ?open=${showMobileDetailSheet}:
          - rtgl-view slot=content d=v w=f h=f:
              - rtgl-view#detailHeader h=36 w=f d=h bwb=xs ph=md av=c g=sm cur=pointer:
                  - rtgl-text w=1fg ellipsis=true: ${selectedItemName}
                  - rtgl-svg svg=edit wh=16: null
              - 'rtgl-view w=f h=1fg sv style="min-height: 0;"':
                  - rvn-detail-view#mobileDetailView key=${selectedItemId} w=f :fields=${mobileDetailFields} :fillHeight=${mobileDetailFillHeight}:
                      - rtgl-view slot=actions d=v g=sm w=f:
                          - rtgl-button#detailExportBtn data-version-id="${selectedItemId}" v=se s=sm pre=download w=f: ${exportButton}
  - $if isVersionDialogOpen:
      - rtgl-dialog#versionDialog ?open=${isVersionDialogOpen} s=md md-layout=fixed-top:
          - rtgl-view slot=content d=v w=f h=f overflow=hidden:
              - rtgl-form#versionForm key=${isVersionDialogOpen} :form=${versionForm} sticky sbv=touch bottom-spacer=96 w=f h=f: null
  - $if isPlatformDetailsDialogOpen:
      - rtgl-dialog#platformDetailsDialog ?open=${isPlatformDetailsDialogOpen} s=md md-layout=fixed-top:
          - rtgl-view slot=content d=v w=f h=f overflow=hidden:
              - rvn-platform-details-create-dialog#platformDetailsCreateDialog :platform=${platformDetailsDialogPlatform} :applicationInfo=${platformDetailsDialogApplicationInfo} w=f h=f: null
  - $if isExportOptionsOpen:
      - rtgl-dialog#exportOptionsDialog ?open=${isExportOptionsOpen} s=md:
          - rtgl-view slot=content w=f p=lg g=lg:
              - rtgl-text s=lg: ${exportOptionsTitle}
              - 'rtgl-grid w=f g=md cols=3 sm-cols=2 style="min-width: 0;"':
                  - $for option, i in exportOptions:
                      - rtgl-view#exportOptionRef${i} data-export-option="${option.id}" data-version-id="${exportOptionsVersionId}" w=f h=148 pos=rel bw=xs bc=bo h-bc=ac br=md av=c ah=c cur=pointer:
                          - rtgl-svg svg=${option.icon} wh=56 c=fg: null
                          - 'rtgl-view pos=abs ah=c ph=sm style="left: 0; right: 0; bottom: 12px;"':
                              - rtgl-text s=sm c=mu-fg ta=c: ${option.label}
  - $if isExportConfirmationOpen:
      - rtgl-dialog#exportConfirmationDialog ?open=${isExportConfirmationOpen} s=md:
          - rtgl-view slot=content w=f p=lg g=lg:
              - rtgl-view d=v g=xs:
                  - rtgl-text s=lg: ${exportConfirmationTitle}
                  - rtgl-text c=mu-fg: ${exportConfirmationMessage}
              - 'rtgl-view w=f sv sbv=touch style="max-height: 50vh;"':
                  - rvn-detail-view#exportConfirmationDetail key=${exportConfirmationKey} w=f :fields=${exportConfirmationFields} :fillHeight=${false} padding=none:
                      - $if exportConfirmationIconFileId:
                          - rvn-file-image slot=export-confirmation-icon fileId=${exportConfirmationIconFileId} w=96 h=96 bw=xs bc=bo br=md: null
                        $else:
                          - rtgl-image slot=export-confirmation-icon src="/public/project_logo_placeholder.png" w=96 h=96 bw=xs bc=bo br=md: null
              - $if showAndroidExportForm:
                  - $if showAndroidUnsignedNotice:
                      - rtgl-text: ${androidUnsignedApkNotice}
                  - rtgl-form#androidExportForm :form=${androidExportForm} w=f: null
                $elif showMacosExportForm:
                  - rtgl-form#macosExportForm :form=${macosExportForm} w=f: null
                $elif showIosExportForm:
                  - rtgl-form#iosExportForm :form=${iosExportForm} w=f: null
                $else:
                  - rtgl-view w=f d=h ah=e av=c g=sm wrap:
                      - $if showWindowsInstallerButton:
                          - rtgl-button#exportConfirmationInstallerButton v=se pre=download: ${exportWindowsInstallerButton}
                      - rtgl-button#exportConfirmationConfirmButton v=pr pre=download: ${exportConfirmationConfirmLabel}
  - rtgl-dropdown-menu#dropdownMenu ?open=${dropdownMenu.isOpen} x=${dropdownMenu.x} y=${dropdownMenu.y} :items=${dropdownMenu.items}: null
