  canvas: {}
template:
  - 'rtgl-view#editorSurface d=h w=f h=f style="min-width: 0; min-height: 0;"':
      - rvn-resizable-panel w=300 min-w=200 max-w=500 resize-side="right":
          - rtgl-view slot="content" w=f h=f:
              - rvn-resource-types :resourceCategory=${resourceCategory} :selectedResourceId=${selectedResourceId}: null
              - rtgl-view w=f h=f bgc=bg: null
      - 'rtgl-view w=2fg h=f style="min-width: 0; min-height: 0;"':
          - rtgl-view h=48 bwb=xs bc=bo d=h av=c w=f ph=md g=md:
              - rtgl-button#backButton sq pre=chevronLeft v=ol: null
              - rtgl-view w=1fg:
                  - rtgl-text: ${animationName}
              - 'rtgl-button#previewLoopButton sq v=${previewLoopButtonVariant} pre=loop aria-label="${loopPreviewLabel}" aria-pressed="${previewLoopEnabled}" title="${loopPreviewLabel}"': null
              - 'rtgl-button#playButton s=sm aria-label="${playButton}" aria-pressed="${previewPlaying}"': ${playButton}
          - rtgl-view h=1fg sv w=f p=md g=lg:
              - rtgl-view d=v w=f g=md:
                  - 'rtgl-view w=f bgc=fg pos=rel style="aspect-ratio: ${canvasAspectRatio};"':
                      - rtgl-view pos=abs cor=full:
                          - 'div#canvas style="width: 100%; height: 100%; display: flex;"': null
              - 'rtgl-view d=v w=f h=1fg g=md style="min-height: 0;"':
                  - $if showMobileTweenActions:
                      - rtgl-view d=h w=f g=sm wrap:
                          - $if showMobileMaskButton:
                              - rtgl-button#mobileMaskButton v=se s=sm pre=image: ${maskTitle}
                          - rtgl-button#mobilePreviewDialogButton v=se s=sm pre=image: ${editPreviewButton}
                  - rtgl-view d=h av=c w=f:
                      - rtgl-text: ${tweenPropertiesTitle}
                      - rtgl-view w=1fg: null
                      - rtgl-view d=h av=c g=sm mr=md:
                          - 'rtgl-button#timelineZoomOut sq v=ol s=sm aria-label="${timelineZoomOutLabel}" title="${timelineZoomOutLabel}"': '-'
                          - 'rtgl-slider#timelineZoomSlider w=120 min=${timelineZoomMin} max=${timelineZoomMax} step=${timelineZoomStep} value=${timelineZoom} aria-label="${timelineZoomLabel}" title="${timelineZoomLabel}"': null
                          - 'rtgl-button#timelineZoomIn sq v=ol s=sm aria-label="${timelineZoomInLabel}" title="${timelineZoomInLabel}"': +
                      - $if dialogType == 'update' && updateAddPropertyButtonVisible:
                          - rtgl-button#addPropertiesButton data-side=update pre=plus s=sm: ${addButton}
                      - $if dialogType == 'transition' && transitionAddPropertyButtonVisible:
                          - rtgl-button#addPropertiesButton pre=plus s=sm: ${addButton}
                  - $if dialogType == 'update':
                      - 'rtgl-view#timelineScrollContainer w=f h=1fg sh cur=${timelinePanCursor} style="min-width: 0; min-height: 0;"':
                          - 'rtgl-view d=v h=f pos=rel style="${timelineCanvasStyle}"':
                              - rvn-keyframe-timeline#updateTimeline editable=true ?showRuler=true ?interactiveRuler=true side=update ?indicatorVisible=${timelinePlayheadVisible} indicatorTimeMs=${previewPlayheadTimeMs} timelineDuration=${timelineDisplayDuration} :properties=${updateProperties} :defaultValues=${updateTimelineDefaultValues} :selectedKeyframe=${selectedKeyframe} :selectedProperty=${selectedProperty}: null
                              - $if timelinePlayheadVisible:
                                  - 'rtgl-view pos=abs bgc=fg op="0.5" style="${timelinePlayheadStyle}"': null
                    $else:
                      - 'rtgl-view#timelineScrollContainer w=f h=1fg sh cur=${timelinePanCursor} style="min-width: 0; min-height: 0;"':
                          - 'rtgl-view d=v h=f g=md pos=rel style="${timelineCanvasStyle}"':
                              - rvn-keyframe-timeline#transitionRuler ?showRuler=true ?showTracks=false ?interactiveRuler=true ?indicatorVisible=${timelinePlayheadVisible} indicatorTimeMs=${previewPlayheadTimeMs} timelineDuration=${timelineDisplayDuration}: null
                              - rtgl-view d=v w=f g=xs:
                                  - 'rtgl-view d=h h=24 w=104 bgc=bg bwr=xs bc=bo av=c style="min-width: 104px; flex-shrink: 0; position: sticky; left: 0; z-index: 6;"':
                                      - rtgl-view w=72 av=c ah=c:
                                          - rtgl-text s=sm c=mu-fg: ${outTimelineLabel}
                                      - rtgl-view h=24 w=24 mr=sm ml=sm: null
                                  - rvn-keyframe-timeline#previousTimeline editable=true side=prev ?showRuler=false ?showTotalDuration=false timelineDuration=${timelineDisplayDuration} :properties=${previousProperties} :defaultValues=${transitionTimelineDefaultValues} :selectedKeyframe=${selectedKeyframe} :selectedProperty=${selectedProperty}: null
                              - rtgl-view d=v w=f g=xs:
                                  - 'rtgl-view d=h h=24 w=104 bgc=bg bwr=xs bc=bo av=c style="min-width: 104px; flex-shrink: 0; position: sticky; left: 0; z-index: 6;"':
                                      - rtgl-view w=72 av=c ah=c:
                                          - rtgl-text s=sm c=mu-fg: ${inTimelineLabel}
                                      - rtgl-view h=24 w=24 mr=sm ml=sm: null
                                  - rvn-keyframe-timeline#nextTimeline editable=true side=next ?showRuler=false ?showTotalDuration=false timelineDuration=${timelineDisplayDuration} :properties=${nextProperties} :defaultValues=${transitionTimelineDefaultValues} :selectedKeyframe=${selectedKeyframe} :selectedProperty=${selectedProperty}: null
                              - $if timelinePlayheadVisible:
                                  - 'rtgl-view pos=abs bgc=fg op="0.5" style="${timelinePlayheadStyle}"': null
      - $if showRightPanel:
          - rvn-resizable-panel#timelineDetailsPanel data-timeline-selection-surface=true panel-type=detail-panel w=270 min-w=200 max-w=500 resize-side="left":
              - 'rtgl-view wh=f slot="content" bgc=bg d=v style="min-width: 0; min-height: 0;"':
                  - rtgl-view h=48 w=f d=h av=c ph=md bwb=xs bc=bo:
                      - rtgl-text w=1fg: ${detailsPanelTitle}
                  - 'rtgl-view w=f h=1fg sv style="min-height: 0;"':
                      - $if selectedKeyframeDetailId:
                          - rvn-detail-view#selectedKeyframeDetails key=${selectedKeyframeDetailId} w=f :fields=${selectedKeyframeDetailFields} :fillHeight=${false}:
                              - rtgl-button#editSelectedKeyframeButton slot=actions w=f v=se pre=edit: ${editButton}
                        $elif selectedPropertyDetailId:
                          - rvn-detail-view#selectedPropertyDetails key=${selectedPropertyDetailId} w=f :fields=${selectedPropertyDetailFields} :fillHeight=${false}: null
                        $else:
                          - rtgl-view w=f h=f av=c ah=c p=md:
                              - rtgl-text s=sm c=mu-fg ta=c: ${selectTimelineItemPrompt}
      - $if showMaskAndPreviewSections:
          - 'rtgl-view w=1fg h=f bgc=bg bwl=xs bc=bo d=v style="min-width: 0; min-height: 0;"':
              - 'rtgl-view w=f h=1fg d=v style="min-height: 0;"':
                  - rtgl-view h=48 w=f d=h av=c ph=md bwb=xs bc=bo g=sm:
                      - rtgl-text w=1fg: ${maskTitle}
                      - $if dialogType == 'transition' && !transitionMaskPanel.enabled && popover.mode != 'addMask':
                          - rtgl-button#openAddMaskButton pre=plus s=sm: ${addMaskButton}
                      - $if transitionMaskPanel.enabled && !transitionMaskPanel.unsupported:
                          - rtgl-button#editMaskButton s=sm: ${editButton}
                      - $if transitionMaskPanel.enabled:
                          - rtgl-button#disableMaskButton s=sm v=se: ${removeButton}
                  - 'rtgl-view w=f h=1fg p=md sv style="min-height: 0;"':
                      - $if !transitionMaskPanel.enabled:
                          - rtgl-view w=f h=f av=c ah=c:
                              - rtgl-view w=300 h=160 bw=xs bc=bo br=md ah=c av=c:
                                  - rtgl-text s=sm c=mu-fg ta=c: ${noMaskAvailable}
                        $else:
                          - $if transitionMaskPanel.unsupported:
                              - rtgl-view d=v w=f g=sm p=md bgc=mu bc=bo bw=xs br=md:
                                  - rtgl-text s=sm: ${transitionMaskPanel.unsupportedMessage}
                                  - rtgl-text s=xs c=mu-fg: ${transitionMaskPanel.unsupportedDescription}
                            $else:
                              - rtgl-view d=v w=f g=lg:
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${kindLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.kindLabel}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${channelLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.channelLabel}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${invertLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.invertLabel}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${softnessLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.softness}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${imageLabel}
                                      - $if transitionMaskPanel.imageItems.length > 0:
                                          - rtgl-view d=h wrap g=md w=f:
                                              - $for image, i in transitionMaskPanel.imageItems:
                                                  - 'rtgl-view bw=xs bc=bo br=md w=160 style="max-width: 100%; box-sizing: border-box;"':
                                                      - 'rtgl-view p=md g=md br=md w=f style="max-width: 100%; box-sizing: border-box;"':
                                                          - $if image.previewFileId:
                                                              - 'rtgl-view w=f br=md style="aspect-ratio: ${image.previewAspectRatio}; overflow: hidden;"':
                                                                  - rvn-file-image w=f h=f fileId=${image.previewFileId}: null
                                                            $else:
                                                              - rtgl-view w=f h=90 br=md bw=xs bc=bo av=c ah=c:
                                                                  - rtgl-text s=xs c=mu-fg: ${noPreviewLabel}
                                                          - rtgl-text s=xs c=mu-fg ellipsis w=f: ${image.name}
                                        $else:
                                          - rtgl-text s=sm c=mu-fg: ${transitionMaskPanel.imageLabel}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${progressDurationLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.progressDurationLabel}
                                  - rtgl-view d=v g=xs w=f:
                                      - rtgl-text s=sm c=mu-fg: ${progressEasingLabel}
                                      - rtgl-text s=sm: ${transitionMaskPanel.progressEasingLabel}
              - rtgl-view w=f h=1 bgc=bo: null
              - 'rtgl-view w=f h=1fg d=v style="min-height: 0;"':
                  - rtgl-view h=48 w=f d=h av=c ph=md bwb=xs bc=bo g=sm:
                      - rtgl-text w=1fg: ${previewTitle}
                      - rtgl-button#savePreviewButton s=sm: ${saveButton}
                  - 'rtgl-view w=f h=1fg p=md sv style="min-height: 0;"':
                      - rtgl-view d=v w=f g=md:
                          - $for item, i in previewPanel.items:
                              - rtgl-view d=v w=f g=xs:
                                  - rtgl-text s=sm c=mu-fg: ${item.label}
                                  - $if item.image:
                                      - 'rtgl-view#previewImageButton${i} data-target=${item.target} cur=pointer bw=xs bc=${item.image.itemBorderColor} h-bc=${item.image.itemHoverBorderColor} br=md w=160 style="max-width: 100%; box-sizing: border-box;"':
                                          - 'rtgl-view p=md g=md br=md w=f style="max-width: 100%; box-sizing: border-box;"':
                                              - $if item.image.previewFileId:
                                                  - 'rtgl-view w=f br=md style="aspect-ratio: ${item.image.previewAspectRatio}; overflow: hidden;"':
                                                      - rvn-file-image w=f h=f fileId=${item.image.previewFileId}: null
                                                $else:
                                                  - rtgl-view w=f h=90 br=md bw=xs bc=bo av=c ah=c:
                                                      - rtgl-text s=xs c=mu-fg: ${noPreviewLabel}
                                              - rtgl-text s=xs c=mu-fg ellipsis w=f: ${item.image.name}
                                    $else:
                                      - 'rtgl-view#previewImageButton${i} data-target=${item.target} w=160 h=90 av=c ah=c bgc=bg bc=bo bw=xs br=md cur=pointer style="max-width: 100%; box-sizing: border-box;"':
                                          - rtgl-text c=mu-fg s=sm: ${selectImageLabel}
  - rtgl-popover#addPropertyPopover ?open=${popover.popoverIsOpen} x=${popover.x} y=${popover.y}:
      - $if showAddPropertyPopover:
          - rtgl-view slot=content:
              - rtgl-form#addPropertyForm key=${addPropertyFormKey} :form=${addPropertyForm} :context=${addPropertyContext} :defaultValues=${addPropertyFormDefaultValues}: null
      - $if showAddKeyframePopover:
          - rtgl-view slot=content:
              - rtgl-form#addKeyframeForm :form=${addKeyframeForm} :defaultValues=${addKeyframeDefaultValues}: null
      - $if popover.mode == 'editAuto':
          - rtgl-view slot=content:
              - rtgl-form#editAutoForm :form=${editAutoForm} :defaultValues=${editAutoDefaultValues}: null
      - $if popover.mode == 'editInitialValue':
          - rtgl-view slot=content:
              - rtgl-form#editInitialValueForm :form=${editInitialValueForm} :defaultValues=${editInitialValueDefaultValues} :context=${editInitialValueContext}: null
  - $if showAddPropertyDialog:
      - rtgl-dialog#addPropertyDialog ?open=${showAddPropertyDialog} s=sm:
          - rtgl-form#addPropertyForm key=${addPropertyFormKey} slot=content :form=${addPropertyForm} :context=${addPropertyContext} :defaultValues=${addPropertyFormDefaultValues} w=f: null
  - $if showAddKeyframeDialog:
      - rtgl-dialog#addKeyframeDialog ?open=${showAddKeyframeDialog} s=sm:
          - rtgl-form#addKeyframeForm slot=content :form=${addKeyframeForm} :defaultValues=${addKeyframeDefaultValues} w=f: null
  - $if showEditKeyframeDialog:
      - rtgl-dialog#editKeyframeDialog ?open=${showEditKeyframeDialog} s=sm:
          - rtgl-form#editKeyframeForm slot=content :form=${updateKeyframeForm} :defaultValues=${editKeyframeDefaultValues} w=f: null
  - rtgl-dialog#maskDialog ?open=${popover.maskDialogIsOpen} s=sm:
      - $if popover.mode == 'editMask' || popover.mode == 'addMask':
          - 'rtgl-view slot=content d=v w=f g=md style="max-width: calc(100vw - 32px);"':
              - $if popover.mode == 'addMask':
                  - rtgl-text: ${addMaskTitle}
                $else:
                  - rtgl-text: ${editMaskTitle}
              - $if maskEditorPanel.unsupported:
                  - rtgl-view d=v w=f g=sm p=md bgc=mu bc=bo bw=xs br=md:
                      - rtgl-text s=sm: ${maskEditorPanel.unsupportedMessage}
                      - rtgl-text s=xs c=mu-fg: ${maskEditorPanel.unsupportedDescription}
                $else:
                  - rtgl-view d=v w=f g=md:
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${kindLabel}
                          - rtgl-segmented-control#maskKindSelect w=f no-clear :selectedValue=${maskEditorPanel.kind} :options=${maskKindOptions}: null
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${channelLabel}
                          - rtgl-segmented-control#maskChannelSelect w=f no-clear :selectedValue=${maskEditorPanel.channelValue} :options=${maskChannelOptions}: null
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${invertLabel}
                          - rtgl-segmented-control#maskInvertSelect w=f no-clear :selectedValue=${maskEditorPanel.invertValue} :options=${maskBooleanOptions}: null
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${softnessLabel}
                          - rtgl-input#maskSoftnessInput type=number min=0 step=0.01 w=f value=${maskEditorPanel.softness}: null
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${imageLabel}
                          - $if maskEditorPanel.singleImage:
                              - 'rtgl-view#singleMaskImageButton w=160 cur=pointer bw=xs bc=${maskEditorPanel.singleImage.itemBorderColor} h-bc=${maskEditorPanel.singleImage.itemHoverBorderColor} br=sm style="max-width: 100%; box-sizing: border-box;"':
                                  - 'rtgl-view p=md g=md br=md w=f style="max-width: 100%; box-sizing: border-box;"':
                                      - 'rtgl-view w=f br=md style="aspect-ratio: 16 / 9; overflow: hidden;"':
                                          - rvn-file-image w=f h=f imageId=${maskEditorPanel.singleImage.imageId} source="thumbnail": null
                                      - rtgl-text s=xs c=mu-fg ellipsis w=f: ${maskEditorPanel.singleImage.name}
                            $else:
                              - 'rtgl-view#singleMaskImageButton w=160 av=c ah=c bgc=bg bc=bo bw=xs br=md cur=pointer style="aspect-ratio: 16 / 9; max-width: 100%; box-sizing: border-box;"':
                                  - rtgl-text c=mu-fg: ${selectImageLabel}
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${progressDurationLabel}
                          - rtgl-input#maskProgressDurationInput type=number min=1 step=1 w=f value=${maskEditorPanel.progressDuration}: null
                      - rtgl-view d=v g=xs w=f:
                          - rtgl-text s=sm c=mu-fg: ${progressEasingLabel}
                          - rtgl-select#maskProgressEasingSelect w=f no-clear :selectedValue=${maskEditorPanel.progressEasing} :options=${maskProgressEasingOptions}: null
              - $if popover.mode == 'addMask':
                  - rtgl-view d=h g=sm w=f ah=e pt=sm:
                      - rtgl-button#cancelMaskButton s=sm v=se: ${cancelButton}
                      - rtgl-button#addMaskButton s=sm v=pr: ${addMaskButton}
              - $if popover.mode == 'editMask':
                  - rtgl-view d=h g=sm w=f av=c pt=sm:
                      - $if showMobileMaskButton:
                          - rtgl-button#mobileDisableMaskButton s=sm v=se: ${removeButton}
                      - rtgl-view w=1fg: null
                      - rtgl-button#editMaskDoneButton s=sm v=pr: ${saveButton}
  - rtgl-dialog#maskRemoveConfirmDialog ?open=${maskRemoveConfirmDialogOpen} s=sm:
      - $if maskRemoveConfirmDialogOpen:
          - rtgl-view slot=content d=v w=f g=lg p=lg:
              - rtgl-view d=v w=f g=md:
                  - rtgl-text s=lg: ${maskRemoveConfirmTitle}
                  - rtgl-text c=mu-fg: ${maskRemoveConfirmMessage}
              - rtgl-view d=h g=sm w=f ah=e:
                  - rtgl-button#maskRemoveCancelButton s=sm v=se: ${cancelButton}
                  - rtgl-button#maskRemoveConfirmButton s=sm v=pr: ${removeButton}
  - rtgl-dialog#previewDialog ?open=${isPreviewDialogOpen} s=md:
      - $if isPreviewDialogOpen:
          - 'rtgl-view slot=content d=v w=f g=md style="max-width: calc(100vw - 32px); max-height: calc(100vh - 96px);"':
              - rtgl-text: ${previewTitle}
              - 'rtgl-view w=f h=1fg sv style="min-height: 0;"':
                  - rtgl-view d=v w=f g=md:
                      - $for item, i in previewPanel.items:
                          - rtgl-view d=v w=f g=xs:
                              - rtgl-text s=sm c=mu-fg: ${item.label}
                              - $if item.image:
                                  - 'rtgl-view#previewDialogImageButton${i} data-target=${item.target} cur=pointer bw=xs bc=${item.image.itemBorderColor} h-bc=${item.image.itemHoverBorderColor} br=md w=160 style="max-width: 100%; box-sizing: border-box;"':
                                      - 'rtgl-view p=md g=md br=md w=f style="max-width: 100%; box-sizing: border-box;"':
                                          - $if item.image.previewFileId:
                                              - 'rtgl-view w=f br=md style="aspect-ratio: ${item.image.previewAspectRatio}; overflow: hidden;"':
                                                  - rvn-file-image w=f h=f fileId=${item.image.previewFileId}: null
                                            $else:
                                              - rtgl-view w=f h=90 br=md bw=xs bc=bo av=c ah=c:
                                                  - rtgl-text s=xs c=mu-fg: ${noPreviewLabel}
                                          - rtgl-text s=xs c=mu-fg ellipsis w=f: ${item.image.name}
                                $else:
                                  - 'rtgl-view#previewDialogImageButton${i} data-target=${item.target} w=160 h=90 av=c ah=c bgc=bg bc=bo bw=xs br=md cur=pointer style="max-width: 100%; box-sizing: border-box;"':
                                      - rtgl-text c=mu-fg s=sm: ${selectImageLabel}
              - rtgl-view d=h g=sm w=f ah=e pt=sm:
                  - rtgl-button#previewDialogSaveButton s=sm: ${saveButton}
  - rtgl-dropdown-menu#keyframeDropdownMenu :items=${keyframeDropdownItems} ?open=${popover.dropdownMenuIsOpen} x=${popover.x} y=${popover.y}: null
  - rtgl-dropdown-menu#addPropertySideMenu :items=${addPropertySideMenuItems} ?open=${popover.addPropertySideMenuIsOpen} x=${popover.x} y=${popover.y}: null
  - rtgl-dialog#imageSelectorDialog ?open=${imageSelectorDialog.open} s=xl:
      - $if imageSelectorDialog.open:
          - rtgl-view slot=content d=v w=f g=md:
              - 'rtgl-view d=h w=f h=70vh g=lg style="min-width: 0; min-height: 0;"':
                  - $if showImageSelectorFileExplorer:
                      - 'rtgl-view w=300 h=f style="min-width: 0; min-height: 0;"':
                          - rvn-base-file-explorer#imageSelectorFileExplorer :items=${imageFolderItems} shrinkable: null
                  - 'rtgl-view#imageSelectorKeyboardScope tabindex=-1 w=1fg h=f style="min-width: 0; min-height: 0; outline: none;"':
                      - rvn-image-selector#imageSelector selectedImageId=${imageSelectorDialog.selectedImageId}: null
              - rtgl-view d=h g=sm w=f ah=e:
                  - rtgl-button#cancelMaskImageSelection variant=se: ${cancelButton}
                  - rtgl-button#confirmMaskImageSelection variant=pr: ${okButton}
  - $when: fullImagePreviewVisible
    rtgl-view#previewOverlay pos=fix edge=f z=3000 cur=pointer:
      - rtgl-view w=f h=f pos=fix edge=f bgc=bg: null
      - $if fullImagePreviewImageId:
          - rtgl-view pos=fix edge=f ah=c av=c z=3001:
              - rvn-file-image imageId=${fullImagePreviewImageId} w=80% h=80% bc=ac bw=xs br=md: null
