componentName: rvn-project-template-dialog
description: Chooses the template a new project starts from. The bundled template comes first, then the asset store's templates; a store template opens a page with its screenshots and description.
propsSchema:
  type: object
  properties:
    open:
      type: boolean
events:
  template-select:
    type: object
    description: A template was chosen. `detail.template` is the bundled template (`{ id, source }`) or a store template (`{ id, source, title, coverUrl }`).
  close: {}
methods:
  type: object
  properties: {}
