componentName: rvn-command-line-bgm
propsSchema:
  type: object
  properties:
    bgm:
      type: object
      properties:
        sounds:
          type: array
          items:
            type: object
            required: [id, resourceId]
            properties:
              id:
                type: string
              resourceId:
                type: string
              loop:
                type: boolean
              volume:
                type: number
              startDelayMs:
                type: number
        resourceId:
          type: string
          description: Legacy single-sound BGM resource
        loop:
          type: boolean
          description: Whether to repeat the complete BGM channel timeline
        interruption:
          type: string
          enum: [immediate, loopEnd]
          description: How channel playback stops when interrupted
        volume:
          type: number
          description: BGM channel volume from 0 to 100
        startDelayMs:
          type: number
          description: Legacy single-sound start delay
        audioEffects:
          type: object
          description: Audio-effect selection for the BGM action
          required: [resourceId]
          properties:
            resourceId:
              type: string
              description: Selected audio-effect resource
            playback:
              type: object
              properties:
                speed:
                  type: number
                  exclusiveMinimum: 0
    previousBgm:
      type: object
    hasPreviousBgmContext:
      type: boolean
