refs:
  visibility:
    eventListeners:
      visible:
        handler: handleVisible
  video:
    eventListeners:
      canplay:
        handler: handleVideoCanPlay
template:
  - rvn-visibility-observer#visibility:
      - $if src:
          - $if kind == 'video':
              - 'video#video key=${src} src="${src}" autoplay=true muted=true loop=true playsinline=true preload=metadata aria-label="${label}" style="display: block; width: 100%; height: 100%; object-fit: contain; background: #000;"': null
            $else:
              - 'img src="${src}" alt="${label}" style="display: block; width: 100%; height: 100%; object-fit: contain; background: #000;"': null
        $else:
          - rtgl-view w=f h=f av=c ah=c bgc=mu:
              - rtgl-svg svg=image wh=24 c=mu-fg: null
