refs:
  visibility:
    eventListeners:
      visible:
        handler: handleVisible
styles:
  # The preview fills the box it is placed in.
  ':host':
    display: block
    width: 100%
    height: 100%
  # A still image sits on the Images page's transparency grid.
  ".previewTransparencyGrid":
    display: block
    width: 100%
    height: 100%
    object-fit: contain
    background-color: "#eef2f7"
    background-image: 'linear-gradient(45deg, #94a3b8 25%, transparent 25%), linear-gradient(-45deg, #94a3b8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #94a3b8 75%), linear-gradient(-45deg, transparent 75%, #94a3b8 75%)'
    background-position: "0 0, 0 6px, 6px -6px, -6px 0"
    background-repeat: repeat
    background-size: 12px 12px
template:
  - rvn-visibility-observer#visibility:
      - $if src:
          - $if kind == 'video':
              - 'rvn-preview-video key=${src} src="${src}" label="${label}" ?paused=${paused} ?hover=${hover}': null
            $elif kind == 'audio':
              # A sound plays in the Sounds page's player, under a music icon.
              # Its clicks are the player's, not the dialog's.
              - rtgl-view data-preview-controls=true w=f h=f d=v bgc=mu:
                  - rtgl-view w=f h=1fg av=c ah=c:
                      - rtgl-svg svg=music wh=48 c=mu-fg: null
                  - 'rtgl-view w=f h=72 style="flex: 0 0 72px;"':
                      - 'rvn-audio-player key=${src} src="${src}" autoPlay=true :title=${label}': null
            $else:
              - 'img.previewTransparencyGrid src="${src}" alt="${label}"': null
        $else:
          - rtgl-view w=f h=f av=c ah=c bgc=mu:
              - rtgl-svg svg=image wh=24 c=mu-fg: null
