refs:
  setupBackup:
    eventListeners:
      click:
        handler: handleSetup
  chooseFolderAgain:
    eventListeners:
      click:
        handler: handleSetup
  backUpNow:
    eventListeners:
      click:
        handler: handleBackUpNow
# An icon that changes with the state keeps the same style and wh, and takes
# its colour from --foreground on a wrapper: patching an icon's style would
# clear the size that wh applies.
template:
  - $if settings && visible:
      - rtgl-view w=f g=lg:
          - rtgl-text s=h4: ${copy.settingsTitle}
          - $if !configured:
              - rtgl-view w=f g=md:
                  - rtgl-view d=h av=c g=sm:
                      - 'rtgl-svg svg=warning-dead-end wh=16 aria-hidden=true style="flex-shrink: 0; color: #f59e0b;"': null
                      - rtgl-text s=sm: ${copy.notConfigured}
                  - rtgl-button#setupBackup v=ol: ${copy.setupFolder}
            $else:
              - rtgl-view w=f g=md:
                  - $if folder:
                      - rtgl-view w=f d=h av=c g=sm:
                          - 'rtgl-svg svg=folder wh=16 c=mu-fg aria-hidden=true style="flex-shrink: 0;"': null
                          - 'rtgl-text w=1fg s=sm ellipsis=true title="${folder}" style="min-width: 0;"': ${folderName}
                  - $if message:
                      - rtgl-view w=f d=h av=c g=sm:
                          - $if tone != 'ok':
                              - 'rtgl-view style="--foreground: ${iconColor}; flex-shrink: 0;"':
                                  - rtgl-svg svg=${icon} wh=16 aria-hidden=true: null
                          - 'rtgl-text w=1fg s=sm role=status style="min-width: 0;"': ${message}
                  - $if detail:
                      - rtgl-text s=sm c=mu-fg: ${detail}
                  - $if showProject:
                      - rtgl-text s=sm c=mu-fg: ${lastBackup}
                  - 'rtgl-view d=h g=sm style="flex-wrap: wrap;"':
                      - $if chooseFolderAgain:
                          - rtgl-button#chooseFolderAgain v=ol: ${copy.chooseFolderAgain}
                      - $if showProject:
                          - rtgl-button#backUpNow v=ol ?disabled=${backUpDisabled}: ${copy.backUpNow}
    $elif visible:
      - 'rtgl-view w=f bw=xs bc=bo br=md p=lg g=md style="box-sizing: border-box;"':
          - $if !configured:
              - rtgl-view d=h av=c g=sm:
                  - 'rtgl-svg svg=warning-dead-end wh=20 aria-hidden=true style="flex-shrink: 0; color: #f59e0b;"': null
                  - rtgl-text s=h4: ${notConfiguredTitle}
              - rtgl-text s=sm: ${copy.notConfigured}
              - rtgl-button#setupBackup w=f v=ol: ${copy.setupFolder}
            $else:
              - rtgl-view d=h av=c g=sm:
                  - 'rtgl-view style="--foreground: ${iconColor}; flex-shrink: 0;"':
                      - rtgl-svg svg=${icon} wh=20 aria-hidden=true: null
                  - rtgl-text s=h4: ${title}
              - rtgl-view w=f g=xs role=status:
                  - $if problemProject:
                      - rtgl-text s=sm c=mu-fg: ${problemProject}
                  - rtgl-text s=sm: ${message}
                  - $if detail:
                      - rtgl-text s=sm c=mu-fg: ${detail}
                  - $if someNotBackedUp:
                      - rtgl-text s=sm c=mu-fg: ${copy.someNotBackedUp}
              - $if folder:
                  - rtgl-view w=f d=h av=c g=sm:
                      - 'rtgl-svg svg=folder wh=16 c=mu-fg aria-hidden=true style="flex-shrink: 0;"': null
                      - 'rtgl-text w=1fg s=sm ellipsis=true title="${folder}" style="min-width: 0;"': ${folderName}
              - $if chooseFolderAgain:
                  - rtgl-button#chooseFolderAgain w=f: ${copy.chooseFolderAgain}
                $elif tryAgain:
                  - rtgl-button#backUpNow w=f v=ol ?disabled=${backUpDisabled}: ${copy.tryAgain}
                  - rtgl-button#setupBackup w=f v=gh: ${copy.changeFolder}
                $else:
                  - rtgl-button#setupBackup w=f v=ol: ${copy.changeFolder}
