refs:
  root:
    eventListeners:
      click:
        handler: handleContainerClick
      pointerdown:
        handler: handleContainerPointerDown
      touchstart:
        handler: handleContainerTouchStart
      contextmenu:
        handler: handleContainerContextMenu
  item*:
    eventListeners:
      mousedown:
        handler: handleItemMouseDown
      pointerdown:
        handler: handleItemPointerDown
      touchstart:
        handler: handleItemTouchStart
      contextmenu:
        handler: handleItemContextMenu
      click:
        handler: handleItemClick
      dblclick:
        handler: handleItemDblClick
  arrow*:
    eventListeners:
      click:
        handler: handleArrowClick
  visibility*:
    eventListeners:
      click:
        handler: handleVisibilityToggleClick
  itemMenu*:
    eventListeners:
      click:
        handler: handleItemMenuClick
  emptyMessage:
    eventListeners:
      click:
        handler: handleEmptyMessageClick
  emptyAddButton:
    eventListeners:
      click:
        handler: handleEmptyAddClick
      keydown:
        handler: handleEmptyAddKeyDown
  dropdownMenu:
    eventListeners:
      close:
        handler: handleDropdownMenuClickOverlay
      item-click:
        handler: handleDropdownMenuClickItem
  popover:
    eventListeners:
      close:
        handler: handlePopoverClickOverlay
  form:
    eventListeners:
      form-action:
        handler: handleFormActionClick
styles:
  ':host':
    '-webkit-user-select': none
    '-webkit-touch-callout': none
    '-webkit-tap-highlight-color': transparent
    '-moz-user-select': none
    '-ms-user-select': none
    user-select: none
  ".visibilityAction":
    align-items: center
    background: transparent
    border: "0"
    box-sizing: border-box
    color: inherit
    cursor: pointer
    display: flex
    flex: "0 0 20px"
    height: 20px
    justify-content: center
    margin: "0"
    opacity: "0"
    outline-offset: 1px
    padding: "0"
    transition: opacity 120ms ease
    width: 20px
  # A closed folder's arrow points toward the inline end.
  "[data-file-explorer-arrow='true']:dir(rtl)":
    transform: scaleX(-1)
  "[data-file-explorer-item='true']:hover .visibilityAction, .visibilityAction:focus-visible, .visibilityAction[data-always-visible='true']":
    opacity: "1"
  "#emptyAddButton:focus-visible":
    border-color: var(--accent)
    outline: 2px solid var(--ring)
    outline-offset: 1px
template:
  # Touch holds are owned by this explorer's own recognizers.
  - 'rtgl-view#root data-long-press-ignore=true w=f h=f d=v sv style="min-width: 0; overflow-x: hidden;"':
      - 'rtgl-view w=f h=1fg d=v g=sm pos=rel style="min-height: 0;"':
          - $if items.length == 0 && !noEmptyMessage && emptyAddLabel:
              # An empty list that can add shows a box to add with.
              - rtgl-view w=f p=md:
                  - 'rtgl-view#emptyAddButton role=button tabindex=0 aria-haspopup=menu w=f h=96 av=c ah=c g=sm bw=xs bc=bo h-bc=ac br=md cur=pointer':
                      - rtgl-svg svg=plus wh=20 c=pr aria-hidden=true: null
                      - rtgl-text s=sm c=pr ta=c: ${emptyAddLabel}
            $elif items.length == 0 && !noEmptyMessage:
              - rtgl-view#emptyMessage w=f h=1fg d=f av=c ah=c p=xl cur=pointer:
                  - rtgl-text s=sm c=mu-fg ta=c: ${emptyMessageLabel}
            $else:
              - rtgl-view w=f:
                  - $for item, i in items:
                      - 'rtgl-view#itemRef${i} data-item-id=${item.id} data-file-explorer-item=true h-bgc=${item.hBgc} bgc=${item.bgc} d=h g=xs style="padding-inline-start: ${item.ml}px; min-width: 0; box-sizing: border-box; touch-action: ${item.touchAction}; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;" w=f pv=md pr=md h=32 cur=pointer av=c bc=${item.bc} bw=xs':
                          - $if shrinkable && item.hasChildren:
                              - rtgl-view d=h av=c ah=c w=16 h=16:
                                  - rtgl-svg#arrowRef${i} data-item-id=${item.id} data-file-explorer-arrow=true svg=${item.arrowIcon} wh=16 cur=pointer: null
                            $else:
                              - rtgl-view d=h av=c ah=c w=16 h=16: null
                          - 'rtgl-view d=h g=md av=c w=1fg style="min-width: 0; overflow: hidden;"':
                              - 'rtgl-view d=h av=c ah=c w=16 h=16 pos=rel style="color: ${item.iconCssColor};"':
                                  - rtgl-svg svg=${item.svg} wh=16 c=${item.iconColor}: null
                                  - $if item.iconCornerBadge:
                                      - 'svg.iconCornerBadge aria-hidden=true viewBox="0 0 9 9" style="position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; overflow: visible; pointer-events: none;"':
                                          - 'polygon points="9 0, 9 9, 0 9" fill="currentColor" stroke="var(--background)" stroke-width="1.5" stroke-linejoin="round"': null
                              - 'rtgl-view w=1fg style="min-width: 0; overflow: hidden;"':
                                  - 'rtgl-text s=sm c=${item.textColor} ellipsis=true w=f style="min-width: 0;"': ${item.name}
                              - $if item.titleIcon:
                                  - 'span role=img aria-label="${item.titleIconLabel}" title="${item.titleIconLabel}" style="display: inline-flex; flex-shrink: 0;"':
                                      - rtgl-svg svg=${item.titleIcon} wh=16 aria-hidden=true: null
                              - $if item.visibilityToggle:
                                  - 'button#visibilityRef${i}.visibilityAction type=button data-item-id=${item.id} data-file-explorer-action=true data-always-visible="${item.visibilityToggleAlwaysVisible}" aria-label="${item.visibilityLabel}" title="${item.visibilityLabel}" style="color: ${item.iconCssColor};"':
                                      - rtgl-svg svg=${item.visibilityIcon} wh=16 c=${item.iconColor} aria-hidden=true: null
                          - $if item.showMenuAction:
                              # The 24px button is too small to tap. This area spans the
                              # row's height and right padding so nearby taps open the menu.
                              - 'rtgl-view#itemMenuRef${i} data-item-id=${item.id} data-file-explorer-action=true d=h av=c ah=c cur=pointer style="flex: 0 0 auto; align-self: stretch; padding-block: 0; padding-inline: 12px 8px; margin-block: -8px; margin-inline: 0 -8px;"':
                                  - 'rtgl-button sq s=sm v=gh pre=ellipsis aria-label="${itemActionsLabel}" title="${itemActionsLabel}" aria-haspopup=menu': null
                  - 'div#container style="width: 100%; height: ${bottomEmptySpaceHeight}; min-height: ${bottomEmptySpaceHeight}; flex: 0 0 ${bottomEmptySpaceHeight}; pointer-events: none;"': null
          - $if targetDragIndex != -2 && targetDropPosition != 'inside':
              - 'rtgl-view pos=abs bgc=fg h=2 style="top: ${targetDragPosition}px; inset-inline-start: ${targetDragLeftOffset}px; width: calc(100% - ${targetDragLeftOffset}px); z-index: 1000;"': null
  - rtgl-dropdown-menu#dropdownMenu :items=${dropdownMenu.items} x=${dropdownMenu.position.x} y=${dropdownMenu.position.y} ?open=${dropdownMenu.isOpen}: null
  - rtgl-popover#popover ?open=${popover.isOpen} x=${popover.position.x} y=${popover.position.y}:
      - $if hasRenameTarget:
          - rtgl-form#form key=${popover.itemId} slot=content :form=${form} :defaultValues=${renameFormDefaultValues}: null
