refs:
  dialog:
    eventListeners:
      close:
        handler: handleDialogClose
  workflowForm:
    eventListeners:
      form-action:
        handler: handleFormAction
  assetStoreLink:
    eventListeners:
      click:
        handler: handleAssetStoreLink
  resourceSelectionCard*:
    eventListeners:
      click:
        handler: handleResourceSelectionToggle
      keydown:
        handler: handleResourceSelectionKeyDown
  selectionToggleAllButton:
    eventListeners:
      click:
        handler: handleSelectionToggleAll
  cancelProgressButton:
    eventListeners:
      click:
        handler: handleCancelProgress
template:
  - 'rtgl-dialog#dialog ?open=${open} s=md aria-label="${dialogAriaLabel}"':
      - rtgl-view slot=content d=v w=f g=md:
          - $if errorMessage:
              - rtgl-view w=f p=md bgc=de br=md role=alert aria-live=assertive:
                  - rtgl-text c=de-fg: ${errorMessage}
          - $if isBusy && isSourceStep:
              - rtgl-view w=f h=180 av=c ah=c d=v g=md:
                  - rtgl-text: ${progressLabel}
          - $if !isBusy && !isProgressStep:
              - rtgl-form#workflowForm key=${formKey} :defaultValues=${defaultValues} :form=${form} :context=${formContext}:
                  - $if isSourceStep:
                      - rtgl-view slot=source-description d=h w=f g=xs av=c wrap:
                          - rtgl-text s=sm c=mu-fg: ${sourceDescription}
                          - 'rtgl-text#assetStoreLink href=${assetStoreUrl} new-tab s=sm c=pr': ${assetStoreLinkLabel}
                  - $if isReviewStep:
                      - $if hasPackageSummary:
                          - rtgl-view slot=package-summary d=v w=f g=md:
                              - $if hasPackageMetadata:
                                  - rtgl-view d=v w=f g=xs:
                                      - $if packageName:
                                          - rtgl-text s=lg: ${packageName}
                                      - $if packageVersion:
                                          - rtgl-text c=mu-fg: ${packageVersion}
                                      - $if packageDescription:
                                          - rtgl-text: ${packageDescription}
                                      - $if packagePublisher:
                                          - 'rtgl-text s=sm c=mu-fg': '${publisherLabel}: ${packagePublisher}'
                                      - $if packageSource:
                                          - 'rtgl-text s=sm c=mu-fg': '${sourceLabel}: ${packageSource}'
                              - $if isItemStep:
                                  - rtgl-text s=sm c=mu-fg: ${knownDownloadBytes} ${bytesLabel}
                                  - $if hasUnknownDownloadSize:
                                      - rtgl-text s=sm c=mu-fg: ${unknownSizeLabel}
                              - $if warnings.length > 0:
                                  - rtgl-view d=v w=f g=xs p=md bgc=wa br=md:
                                      - rtgl-text c=wa-fg: ${warningsLabel}
                                      - $for warning, i in warnings:
                                          - rtgl-text s=sm c=wa-fg: ${warning.message}
                  - $if isSelectionStep:
                      - rtgl-view slot=selection-controls d=h w=f ah=e:
                          - 'rtgl-button#selectionToggleAllButton v=se s=sm data-all-selected=${allResourcesSelected}': ${selectionToggleAllLabel}
                      - $for resource, i in resources:
                          - 'rtgl-view#resourceSelectionCard${i} slot=${resource.selectionSlot} role=button tabindex=${resource.selectionTabIndex} data-resource-index=${i} data-selected=${resource.selected} data-selection-locked=${resource.selectionLocked} aria-label="${resource.selectionLabel}" aria-pressed="${resource.selected}" aria-disabled="${resource.selectionLocked}" d=h w=f av=s g=md p=md bgc=bg bw=xs bc=${resource.selectionBorderColor} h-bc=${resource.selectionHoverBorderColor} br=md cur=${resource.selectionCursor} style="box-sizing: border-box;"':
                              - rtgl-view w=160 h=90 av=c ah=c br=md bgc=mu:
                                  - rtgl-svg svg=image wh=24 c=mu-fg: null
                              - 'rtgl-view d=v w=1fg g=xs pv=sm style="box-sizing: border-box;"':
                                  - rtgl-view d=h av=c g=xs:
                                      - rtgl-text s=md: ${resource.name}
                                  - $if resource.description:
                                      - rtgl-text s=sm c=mu-fg: ${resource.description}
                              - 'rtgl-view d=h av=c ah=e style="align-self: center; flex: 0 0 auto;"':
                                  - rtgl-text s=sm c=${resource.selectionStatusColor}: ${resource.selectionStatus}
                  - $if isItemStep:
                      - rtgl-view slot=resource-preview d=v w=f g=sm:
                          - 'rtgl-view w=240 h=135 overflow=hidden bw=xs bc=bo br=md bgc=mu style="max-width: 100%; box-sizing: border-box;"':
                              - $if currentResource.previewSourceId:
                                  - 'rvn-resource-import-preview-media key=${currentResource.previewSourceId} planId=${planId} sourceFileId=${currentResource.previewSourceId} label="${currentResource.name}"': null
                                $else:
                                  - rtgl-view w=f h=f av=c ah=c:
                                      - rtgl-svg svg=image wh=32 c=mu-fg: null
                      - $if animationTimeline:
                          - rtgl-view slot=animation-timeline-preview d=v w=f g=sm:
                              - rtgl-text s=sm c=mu-fg: ${timelinePreviewLabel}
                              - 'rtgl-view d=v w=f g=sm p=sm bw=xs bc=bo br=md bgc=bg style="box-sizing: border-box; overflow-x: auto;"':
                                  - $if animationTimeline.isTransition:
                                      - rvn-keyframe-timeline w=f ?showRuler=true ?showTracks=false timelineDuration=${animationTimeline.timelineDuration}: null
                                      - $if animationTimeline.hasPreviousProperties:
                                          - rtgl-view d=v w=f g=xs:
                                              - rtgl-text s=xs c=mu-fg: ${timelineOutLabel}
                                              - rvn-keyframe-timeline w=f ?showTotalDuration=false ?showRuler=false timelineDuration=${animationTimeline.timelineDuration} :properties=${animationTimeline.previousProperties} :defaultValues=${animationTimeline.defaultValues}: null
                                      - $if animationTimeline.hasNextProperties:
                                          - rtgl-view d=v w=f g=xs:
                                              - rtgl-text s=xs c=mu-fg: ${timelineInLabel}
                                              - rvn-keyframe-timeline w=f ?showTotalDuration=false ?showRuler=false timelineDuration=${animationTimeline.timelineDuration} :properties=${animationTimeline.nextProperties} :defaultValues=${animationTimeline.defaultValues}: null
                                      - $if animationTimeline.hasMaskProperties:
                                          - rtgl-view d=v w=f g=xs:
                                              - rtgl-text s=xs c=mu-fg: ${timelineMaskLabel}
                                              - rvn-keyframe-timeline w=f ?showTotalDuration=false ?showRuler=false timelineDuration=${animationTimeline.timelineDuration} :properties=${animationTimeline.maskProperties} :defaultValues=${animationTimeline.defaultValues}: null
                                    $else:
                                      - rvn-keyframe-timeline w=f ?showRuler=true :properties=${animationTimeline.updateProperties} :defaultValues=${animationTimeline.defaultValues}: null
          - $if isProgressStep:
              - rtgl-view w=f h=220 av=c ah=c d=v g=md role=status aria-live=polite:
                  - rtgl-text s=lg: ${progressLabel}
                  - rtgl-text c=mu-fg: ${progressCountLabel} (${progressPercent}%)
                  - rtgl-button#cancelProgressButton v=se: ${cancelButton}
