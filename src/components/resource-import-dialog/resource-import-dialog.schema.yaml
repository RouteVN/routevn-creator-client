componentName: rvn-resource-import-dialog
propsSchema:
  type: object
  properties:
    open:
      type: boolean
    source:
      type: string
      description: What the dialog imports from when it opens. "store" (the default) opens the asset store, "zip" reads the package in `file`, and "url" asks for a package URL
    file:
      type: object
      description: The package ZIP file to import when `source` is "zip"
events:
  import-cancelled: {}
  import-complete:
    type: object
methods:
  type: object
  properties: {}
