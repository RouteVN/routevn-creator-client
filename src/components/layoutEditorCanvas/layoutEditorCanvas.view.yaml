styles:
  # A load that finishes quickly does not flash the loading cover.
  "#canvasLoading":
    animation: layoutCanvasLoadingAppear 0s linear 300ms both
  "@keyframes layoutCanvasLoadingAppear":
    from:
      visibility: hidden
    to:
      visibility: visible
refs:
  canvas:
    eventListeners:
      pointermove:
        handler: handleCanvasPointerMove
      pointerleave:
        handler: handleCanvasPointerLeave
      pointerdown:
        handler: handleCanvasPointerDown
      pointerup:
        handler: handleCanvasPointerUp
      pointercancel:
        handler: handleCanvasPointerCancel
      click:
        handler: handleCanvasClick
      dblclick:
        handler: handleCanvasDoubleClick
template:
  - 'rtgl-view w=f bgc=mu pos=rel bwl=xs bwr=xs bc=bo style="margin-left: 1px; aspect-ratio: ${canvasAspectRatio};"':
      - rtgl-view pos=abs cor=full w=f h=f:
          - 'div#canvas style="width: 100%; height: 100%;display: flex; cursor: ${canvasCursor}"': null
      # Same loading look as the scene editor canvas.
      - $if isCanvasLoading:
          - rtgl-view#canvasLoading pos=abs cor=full w=f h=f bgc=bg op=0.7 av=c ah=c g=sm role=status aria-live=polite:
              - rtgl-text s=sm: ${canvasLoadingLabel}
