refs:
  scrollContainer:
    eventListeners:
      click:
        handler: handleScrollContainerClick
  searchInput:
    eventListeners:
      value-input:
        handler: handleSearchInput
  tagFilterButton:
    eventListeners:
      click:
        handler: handleTagFilterButtonClick
  tagFilterPopover:
    eventListeners:
      close:
        handler: handleTagFilterPopoverClose
  tagFilterOption*:
    eventListeners:
      click:
        handler: handleTagFilterOptionClick
  tagFilterClear:
    eventListeners:
      click:
        handler: handleTagFilterClearClick
  tagFilterApply:
    eventListeners:
      click:
        handler: handleTagFilterApplyClick
  menuButton:
    eventListeners:
      click:
        handler: handleMenuClick
  group*:
    eventListeners:
      click:
        handler: handleGroupClick
  variableItem*:
    eventListeners:
      click:
        handler: handleVariableItemClick
  addVariableButton*:
    eventListeners:
      click:
        handler: handleAddVariableClick
  addVariableEmpty*:
    eventListeners:
      click:
        handler: handleAddVariableClick
  variableDialog:
    eventListeners:
      close:
        handler: handleCloseDialog
  computedDialog:
    eventListeners:
      close:
        handler: handleCloseDialog
  variableForm:
    eventListeners:
      form-action:
        handler: handleFormActionClick
      form-change:
        handler: handleDialogFormChange
      add-option-click:
        handler: handleFormAddOptionClick
  computedForm:
    eventListeners:
      form-action:
        handler: handleFormActionClick
      form-change:
        handler: handleDialogFormChange
      add-option-click:
        handler: handleFormAddOptionClick
  addOperationButton:
    eventListeners:
      click:
        handler: handleAddOperationClick
  operationChoiceMenu:
    eventListeners:
      close:
        handler: handleOperationChoiceMenuClose
      item-click:
        handler: handleOperationChoiceMenuClick
  computedOperationBlock:
    eventListeners:
      add-operand-click:
        handler: handleAddOperationOperandClick
      operation-contextmenu:
        handler: handleOperationBlockContextMenu
      remove-operand-click:
        handler: handleRemoveOperationOperandClick
      value-operand-click:
        handler: handleEditOperationValueClick
      value-operand-contextmenu:
        handler: handleOperationOperandContextMenu
      variable-operand-click:
        handler: handleEditOperationVariableClick
      variable-operand-contextmenu:
        handler: handleOperationOperandContextMenu
  conditionalOperationBlock*:
    eventListeners:
      add-operand-click:
        handler: handleAddOperationOperandClick
      operation-contextmenu:
        handler: handleOperationBlockContextMenu
      remove-operand-click:
        handler: handleRemoveOperationOperandClick
      value-operand-click:
        handler: handleEditOperationValueClick
      value-operand-contextmenu:
        handler: handleOperationOperandContextMenu
      variable-operand-click:
        handler: handleEditOperationVariableClick
      variable-operand-contextmenu:
        handler: handleOperationOperandContextMenu
  addConditionalNode*:
    eventListeners:
      click:
        handler: handleAddConditionalNodeClick
  conditionalVariable*:
    eventListeners:
      click:
        handler: handleConditionalVariableClick
      contextmenu:
        handler: handleConditionalNodeContextMenu
  conditionalValue*:
    eventListeners:
      click:
        handler: handleConditionalValueClick
      contextmenu:
        handler: handleConditionalNodeContextMenu
  addConditionalBranchButton:
    eventListeners:
      click:
        handler: handleAddConditionalBranchClick
  duplicateConditionalBranch*:
    eventListeners:
      click:
        handler: handleDuplicateConditionalBranchClick
  moveConditionalBranch*:
    eventListeners:
      click:
        handler: handleMoveConditionalBranchClick
  removeConditionalBranch*:
    eventListeners:
      click:
        handler: handleRemoveConditionalBranchClick
  operationBlockMenu:
    eventListeners:
      close:
        handler: handleOperationBlockMenuClose
      item-click:
        handler: handleOperationBlockMenuClick
  operandSourceMenu:
    eventListeners:
      close:
        handler: handleOperandSourceMenuClose
      item-click:
        handler: handleOperandSourceMenuClick
  operationValuePopover:
    eventListeners:
      close:
        handler: handleOperationValuePopoverClose
      value-submit:
        handler: handleOperationValueSubmit
  enumAddValueButton:
    eventListeners:
      click:
        handler: handleEnumAddValueClick
  enumValuePopover:
    eventListeners:
      close:
        handler: handleEnumValuePopoverClose
  enumValueForm:
    eventListeners:
      form-action:
        handler: handleEnumValueFormAction
  enumValueItem*:
    eventListeners:
      contextmenu:
        handler: handleEnumValueContextMenu
  enumValueMenu:
    eventListeners:
      close:
        handler: handleEnumValueMenuClose
      item-click:
        handler: handleEnumValueMenuClick
  row*:
    eventListeners:
      click:
        handler: handleRowClick
      dblclick:
        handler: handleRowDoubleClick
      contextmenu:
        handler: handleRowContextMenu
  contextMenu:
    eventListeners:
      close:
        handler: handleCloseContextMenu
      item-click:
        handler: handleContextMenuClickItem
template:
  - 'rtgl-view w=f h=f g=sm style="min-width: 0; min-height: 0;"':
      - 'rtgl-view h=48 w=f bgc=bg bwb=xs ph=md av=c d=h g=md style="position: sticky; top: 0px; z-index: 1000;"':
          - rtgl-view w=1fg d=h av=c g=md:
              - $if showLeadingMenuButton:
                  - 'rtgl-button#menuButton sq pre=hamburger v=ol aria-label="${menuButtonLabel}" title="${menuButtonLabel}"': null
              - $if navTitle:
                  - rtgl-text: ${navTitle}
          - $if showSearch:
              - rtgl-input#searchInput s=sm placeholder="${searchPlaceholder}" value=${searchQuery} h=1fg: null
          - $if showTagFilter:
              - 'rtgl-button#tagFilterButton sq pre=filter v=${tagFilterButtonVariant} aria-label="${filterLabel}" title="${filterLabel}"': null
          - $if showTrailingMenuButton:
              - 'rtgl-button#menuButton sq pre=hamburger v=ol aria-label="${menuButtonLabel}" title="${menuButtonLabel}"': null
      - 'rtgl-view#scrollContainer h=1fg w=f sv style="min-width: 0; min-height: 0; box-sizing: border-box;"':
          - $if flatGroups.length > 0:
              - $for group, i in flatGroups:
                  - rtgl-view w=f ph=md pos=rel:
                      - 'rtgl-view d=h w=f av=c bgc=${group.headerBackgroundColor} z=100 pv=sm style="position: sticky; top: 0px;"':
                          - rtgl-view#groupRef${i} data-group-id=${group.id} data-resource-view-control=true d=h av=c g=md cur=pointer:
                              - $if group.isCollapsed:
                                  - rtgl-svg wh=16 svg=folderArrowRight: null
                                $else:
                                  - rtgl-svg wh=16 svg=folderArrowDown: null
                              - rtgl-svg wh=16 svg=folder: null
                              - rtgl-text: ${group.fullLabel}
                          - rtgl-view w=1fg: null
                          - $if !readonly:
                              - rtgl-button#addVariableButtonRef${i} data-group-id=${group.id} data-resource-view-control=true s=sm w=1fg pre=plus: ${addButton}
                      - $if !group.isCollapsed:
                          - 'rtgl-view w=f mb=md pv=sm style="min-height: ${group.progressiveContentMinHeight}px;"':
                              - $if group.hasChildren:
                                  - rtgl-view w=f:
                                      - rtgl-view d=h w=f pv=sm bwb=xs g=md:
                                          - rtgl-view w=2fg:
                                              - rtgl-text c=mu-fg s=sm: ${nameLabel}
                                          - rtgl-view w=1fg:
                                              - rtgl-text c=mu-fg s=sm: ${scopeLabel}
                                          - rtgl-view w=1fg:
                                              - rtgl-text c=mu-fg s=sm: ${typeLabel}
                                          - rtgl-view w=1fg:
                                              - rtgl-text c=mu-fg s=sm: ${defaultLabel}
                                      - $for item, j in group.children:
                                          - $if item.isPlaceholder:
                                              - rtgl-view#variablePlaceholderRef${i}x${j} d=h w=f h=36 av=c bwb=xs cur=${item.cursor} g=md:
                                                  - rtgl-view w=2fg av=c:
                                                      - rtgl-view w=55% h=12 bgc=mu br=sm: null
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-view w=45% h=12 bgc=mu br=sm: null
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-view w=50% h=12 bgc=mu br=sm: null
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-view w=60% h=12 bgc=mu br=sm: null
                                            $elif item.isSelected:
                                              - rtgl-view#rowRef${i}x${j} data-item-id=${item.domItemId} data-resource-view-item=true d=h w=f h=36 av=c bwb=xs cur=${item.cursor} g=md bgc=mu h-bgc=mu br=sm:
                                                  - rtgl-view w=2fg d=h av=c g=sm:
                                                      - rtgl-text s=sm: ${item.name}
                                                      - $if item.isEnum:
                                                          - rtgl-tag v=mu s=sm: ${enumLabel}
                                                      - $if item.isComputed:
                                                          - rtgl-tag v=mu s=sm: ${computedLabel}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.scope}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.variableType}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.default}
                                            $else:
                                              - rtgl-view#rowRef${i}x${j} data-item-id=${item.domItemId} data-resource-view-item=true d=h w=f h=36 av=c bwb=xs cur=${item.cursor} g=md h-bgc=mu:
                                                  - rtgl-view w=2fg d=h av=c g=sm:
                                                      - rtgl-text s=sm: ${item.name}
                                                      - $if item.isEnum:
                                                          - rtgl-tag v=mu s=sm: ${enumLabel}
                                                      - $if item.isComputed:
                                                          - rtgl-tag v=mu s=sm: ${computedLabel}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.scope}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.variableType}
                                                  - rtgl-view w=1fg av=c:
                                                      - rtgl-text s=sm: ${item.default}
                                $else:
                                  - $if group.showEmptyAdd:
                                      - $if readonly:
                                          - rtgl-view w=f h=150 av=c ah=c:
                                              - rtgl-text c=mu-fg: ${noVariablesInGroupMessage}
                                        $else:
                                          - rtgl-view#addVariableEmptyRef${i} data-group-id=${group.id} data-resource-view-control=true w=f h=150 av=c ah=c g=md bw=xs bc=bo br=md cur=pointer:
                                              - rtgl-svg svg=plus wh=24: null
                                              - rtgl-text: ${addVariableButton}
            $elif searchQuery || selectedTagFilterValues.length > 0:
              - rtgl-view w=f h=400 av=c ah=c:
                  - rtgl-text s=lg c=mu-fg: ${noVariablesFoundMessage}
            $else:
              - rtgl-view w=f h=f av=c ah=c:
                  - rtgl-text s=lg c=mu-fg: ${noDataMessage}
                  - rtgl-view h=64: null
          - $if flatGroups.length > 0:
              - 'rtgl-view w=f h="${scrollBottomPadding}" style="flex-shrink: 0;"': null
  - $if !readonly:
      - rtgl-dialog#variableDialog s=md ?open=${isVariableDialogOpen}:
          - rtgl-view slot=content g=md:
              - rtgl-form#variableForm key=variable-${dialogKey} :defaultValues=${defaultValues} :form=${variableForm} w=f :context=${context}:
                  - 'rtgl-view slot="enum-values" d=v w=f g=sm':
                      - $if enumValues.length > 0:
                          - rtgl-view d=h wrap g=sm w=f:
                              - $for option, i in enumValues:
                                  - rtgl-view#enumValueItemRef${i} data-index=${option.index} d=h av=c g=xs ph=md pv=xs bw=xs bc=bo br=md bgc=bg h-bgc=mu cur=context-menu:
                                      - rtgl-text s=sm: ${option.label}
                        $else:
                          - rtgl-text s=sm c=mu-fg: ${noValuesYetMessage}
                      - rtgl-view d=h w=f:
                          - rtgl-button#enumAddValueButton s=sm v=se pre=plus: ${addValueButton}
      - rtgl-dialog#computedDialog s=lg ?open=${isComputedDialogOpen}:
          - rtgl-view slot=content g=md:
              - rtgl-form#computedForm key=computed-${dialogKey} :defaultValues=${defaultValues} :form=${computedForm} w=f :context=${context}:
                  - 'rtgl-view slot="operation" d=v w=f g=sm':
                      - rtgl-view d=h w=f av=c g=sm:
                          - rtgl-text w=1fg s=md: ${operationLabel}
                      - $if operationBlock:
                          - rvn-computed-operation-block#computedOperationBlock :operation=${operationBlock}: null
                        $elif conditionalBuilder:
                          - rtgl-view d=v w=f g=md bw=xs bc=bo br=md p=md bgc=bg:
                              - $for branch, i in conditionalBuilder.branches:
                                  - rtgl-view d=v w=f g=sm:
                                      - rtgl-view d=h w=f av=c g=xs:
                                          - rtgl-text w=1fg s=md: ${branch.branchLabel}
                                          - $if branch.canMoveUp:
                                              - 'rtgl-button#moveConditionalBranchUp${i} data-branch-index=${branch.branchIndex} data-offset="-1" s=sm v=gh aria-label="${conditionalMoveBranchUpLabel}" title="${conditionalMoveBranchUpLabel}"': ${conditionalMoveBranchUpLabel}
                                          - $if branch.canMoveDown:
                                              - 'rtgl-button#moveConditionalBranchDown${i} data-branch-index=${branch.branchIndex} data-offset="1" s=sm v=gh aria-label="${conditionalMoveBranchDownLabel}" title="${conditionalMoveBranchDownLabel}"': ${conditionalMoveBranchDownLabel}
                                          - 'rtgl-button#duplicateConditionalBranch${i} data-branch-index=${branch.branchIndex} s=sm v=gh aria-label="${conditionalDuplicateBranchLabel}" title="${conditionalDuplicateBranchLabel}"': ${conditionalDuplicateBranchLabel}
                                          - $if branch.canRemove:
                                              - 'rtgl-button#removeConditionalBranch${i} data-branch-index=${branch.branchIndex} s=sm v=gh aria-label="${conditionalRemoveBranchLabel}" title="${conditionalRemoveBranchLabel}"': ${conditionalRemoveBranchLabel}
                                      - rtgl-text s=xs c=mu-fg: ${conditionalWhenLabel}
                                      - $if branch.condition:
                                          - rtgl-view d=h w=f av=e g=sm:
                                              - $if branch.condition.source == 'operation':
                                                - 'rvn-computed-operation-block#conditionalOperationBlockCondition${i} :operation=${branch.condition.operation} style="display: block; flex: 1; min-width: 0;"': null
                                                $elif branch.condition.source == 'variable':
                                                  - rtgl-view#conditionalVariableCondition${i} data-target-kind=condition data-branch-index=${branch.branchIndex} d=h w=1fg av=c g=sm bw=xs bc=bo br=md p=sm cur=pointer:
                                                      - rtgl-text w=1fg s=md: ${branch.condition.variableLabel}
                                                      - rtgl-text s=sm c=mu-fg: ${branch.condition.variableTypeLabel}
                                                $else:
                                                  - rtgl-view#conditionalValueCondition${i} data-target-kind=condition data-branch-index=${branch.branchIndex} w=1fg bw=xs bc=bo br=md p=sm cur=pointer:
                                                      - $if branch.condition.booleanValueLabel:
                                                          - rtgl-text s=md: ${branch.condition.booleanValueLabel}
                                                        $else:
                                                          - rtgl-text s=md: ${branch.condition.value}
                                        $else:
                                          - 'rtgl-button#addConditionalNodeCondition${i} data-target-kind=condition data-branch-index=${branch.branchIndex} s=sm v=se pre=plus w=f': ${conditionalAddConditionLabel}
                                      - rtgl-text s=xs c=mu-fg: ${conditionalThenLabel}
                                      - $if branch.result:
                                          - rtgl-view d=h w=f av=e g=sm:
                                              - $if branch.result.source == 'operation':
                                                - 'rvn-computed-operation-block#conditionalOperationBlockResult${i} :operation=${branch.result.operation} style="display: block; flex: 1; min-width: 0;"': null
                                                $elif branch.result.source == 'variable':
                                                  - rtgl-view#conditionalVariableResult${i} data-target-kind=result data-branch-index=${branch.branchIndex} d=h w=1fg av=c g=sm bw=xs bc=bo br=md p=sm cur=pointer:
                                                      - rtgl-text w=1fg s=md: ${branch.result.variableLabel}
                                                      - rtgl-text s=sm c=mu-fg: ${branch.result.variableTypeLabel}
                                                $else:
                                                  - rtgl-view#conditionalValueResult${i} data-target-kind=result data-branch-index=${branch.branchIndex} w=1fg bw=xs bc=bo br=md p=sm cur=pointer:
                                                      - $if branch.result.booleanValueLabel:
                                                          - rtgl-text s=md: ${branch.result.booleanValueLabel}
                                                        $else:
                                                          - rtgl-text s=md: ${branch.result.value}
                                        $else:
                                          - 'rtgl-button#addConditionalNodeResult${i} data-target-kind=result data-branch-index=${branch.branchIndex} s=sm v=se pre=plus w=f': ${conditionalAddResultLabel}
                              - rtgl-button#addConditionalBranchButton s=sm v=se pre=plus: ${conditionalAddBranchLabel}
                              - rtgl-view d=v w=f g=sm:
                                  - rtgl-text s=md: ${conditionalOtherwiseLabel}
                                  - $if conditionalBuilder.defaultResult:
                                      - rtgl-view d=h w=f av=e g=sm:
                                          - $if conditionalBuilder.defaultResult.source == 'operation':
                                            - 'rvn-computed-operation-block#conditionalOperationBlockDefault :operation=${conditionalBuilder.defaultResult.operation} style="display: block; flex: 1; min-width: 0;"': null
                                            $elif conditionalBuilder.defaultResult.source == 'variable':
                                              - rtgl-view#conditionalVariableDefault data-target-kind=default d=h w=1fg av=c g=sm bw=xs bc=bo br=md p=sm cur=pointer:
                                                  - rtgl-text w=1fg s=md: ${conditionalBuilder.defaultResult.variableLabel}
                                                  - rtgl-text s=sm c=mu-fg: ${conditionalBuilder.defaultResult.variableTypeLabel}
                                            $else:
                                              - rtgl-view#conditionalValueDefault data-target-kind=default w=1fg bw=xs bc=bo br=md p=sm cur=pointer:
                                                  - $if conditionalBuilder.defaultResult.booleanValueLabel:
                                                      - rtgl-text s=md: ${conditionalBuilder.defaultResult.booleanValueLabel}
                                                    $else:
                                                      - rtgl-text s=md: ${conditionalBuilder.defaultResult.value}
                                    $else:
                                      - 'rtgl-button#addConditionalNodeDefault data-target-kind=default s=sm v=se pre=plus w=f': ${conditionalAddResultLabel}
                        $else:
                          - rtgl-button#addOperationButton v=se pre=plus w=f: ${addOperationLabel}
      - rtgl-dropdown-menu#operationChoiceMenu :items=${operationChoiceMenu.items} ?open=${operationChoiceMenu.isOpen} x=${operationChoiceMenu.x} y=${operationChoiceMenu.y} place=bs: null
      - rtgl-dropdown-menu#operationBlockMenu :items=${operationBlockMenu.items} ?open=${operationBlockMenu.isOpen} x=${operationBlockMenu.x} y=${operationBlockMenu.y}: null
      - rtgl-dropdown-menu#operandSourceMenu :items=${operandSourceMenu.items} ?open=${operandSourceMenu.isOpen} x=${operandSourceMenu.x} y=${operandSourceMenu.y} place=bs: null
      - rvn-computed-value-operand-popover#operationValuePopover ?open=${operationValuePopover.isOpen} x=${operationValuePopover.x} y=${operationValuePopover.y} :valueTypes=${operationValuePopover.valueTypes} :initialValue=${operationValuePopover.initialValue}: null
      - rtgl-dropdown-menu#contextMenu :items=${dropdownMenu.items} ?open=${dropdownMenu.isOpen} x=${dropdownMenu.x} y=${dropdownMenu.y}: null
      - rtgl-popover#enumValuePopover ?open=${enumValuePopover.isOpen} x=${enumValuePopover.x} y=${enumValuePopover.y} place=bs content-w=260 content-g=sm content-ph=md content-pv=md:
          - rtgl-form#enumValueForm key=${enumValuePopover.key} :defaultValues=${enumValueDefaultValues} :form=${enumValueForm} w=f: null
      - rtgl-dropdown-menu#enumValueMenu :items=${enumValueMenu.items} ?open=${enumValueMenu.isOpen} x=${enumValueMenu.x} y=${enumValueMenu.y}: null
  - rtgl-popover#tagFilterPopover ?open=${tagFilterPopover.isOpen} x=${tagFilterPopover.position.x} y=${tagFilterPopover.position.y} place=be content-w=320 content-g=sm content-sv=true content-ph=md content-pv=md:
      - $if showFilterPopoverSearch:
          - rtgl-text s=md: ${filterLabel}
          - rtgl-input#searchInput s=sm placeholder="${searchPlaceholder}" value=${searchQuery} w=f: null
      - $if !tagFilterPopover.hasOptions:
          - rtgl-text s=sm c=mu-fg: ${noTagsAvailableMessage}
      - $if tagFilterPopover.hasOptions:
          - rtgl-view d=h wrap g=sm w=f:
              - $for option, i in tagFilterPopover.options:
                  - rtgl-view#tagFilterOptionRef${i} data-tag-id=${option.value} cur=pointer:
                      - 'rtgl-tag v=mu style="${option.tagStyle}"':
                          ${option.label}
      - rtgl-view d=h av=c g=sm w=f pt=sm:
          - rtgl-view w=1fg: null
          - rtgl-button#tagFilterClear v=se s=sm ?disabled=${tagFilterPopover.clearDisabled}: ${clearButton}
          - rtgl-button#tagFilterApply v=pr s=sm: ${saveButton}
