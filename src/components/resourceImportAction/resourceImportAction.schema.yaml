componentName: rvn-resource-import-action
propsSchema:
  type: object
  properties:
    additionalMenuItems:
      type: array
      description: Optional actions rendered before the Import items in the three-dot menu
    showImport:
      type: boolean
      description: Whether the menu offers its three Import items (asset store, zip file, URL). Defaults to true
events:
  menu-action:
    type: object
  search-input:
    type: object
  tag-filter-change:
    type: object
  import-complete:
    type: object
methods:
  type: object
  properties: {}
