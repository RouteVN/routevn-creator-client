componentName: rvn-spritesheet-preview
propsSchema:
  type: object
  properties:
    fileId:
      type: string
    src:
      type: string
    atlas:
      type: object
    animation:
      type: object
    previewKey:
      type: string
    paused:
      type: boolean
    emptyLabel:
      type: string
    w:
      type: string
    h:
      type: string
    br:
      type: string
    checkerCellSize:
      type: string
    showCheckerboard:
      type: boolean
    padding:
      type: string
      description: Pixels left around the frame. Defaults to a small margin; 0 makes the frame fill a box that has its shape.
