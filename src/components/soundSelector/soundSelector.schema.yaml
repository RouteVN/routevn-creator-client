componentName: rvn-sound-selector
propsSchema:
  type: object
  properties:
    selectedSoundId:
      type: string
    searchQuery:
      type: string
    columns:
      type: integer
      minimum: 1
    # With columns, makes columns the most per row: narrower grids show
    # fewer columns, each at least this many pixels wide.
    minColumnWidth:
      type: integer
      minimum: 1
    # Without columns, cards fill each row, at least this many pixels wide
    # where the grid has room for two of them.
    minCardWidth:
      type: integer
      minimum: 1
