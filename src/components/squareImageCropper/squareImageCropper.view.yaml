refs:
  cropViewport:
    eventListeners:
      dragstart:
        handler: handleImageDragStart
      pointerdown:
        handler: handleViewportPointerDown
      lostpointercapture:
        handler: handleWindowPointerEnd
      wheel:
        handler: handleViewportWheel
  zoomSlider:
    eventListeners:
      change:
        handler: handleZoomChange
      input:
        handler: handleZoomChange
  zoomOutButton:
    eventListeners:
      click:
        handler: handleZoomOut
  zoomInButton:
    eventListeners:
      click:
        handler: handleZoomIn
template:
  - 'rtgl-view d=v g=md style="width: 100%; min-width: 0; max-width: 400px; margin: 0 auto;"':
      - 'rtgl-view#cropViewport pos=rel w=f ar=1 bgc=bg br=lg cur=${cropCursor} style="min-width: 0; flex-shrink: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;"':
          - $if imageUrl:
              - 'rtgl-view style="${imageFrameStyle}"':
                  - rtgl-image src=${imageUrl} w=f h=f of=cov: null
            $else:
              - rtgl-view w=f h=f av=c ah=c:
                  - rtgl-text s=sm c=mu-fg: Loading image...
          - 'rtgl-view pos=abs bw=sm bc=pr br=lg style="inset: 0; pointer-events: none;"': null
      - rtgl-view d=h w=f ah=c av=c g=sm:
          - rtgl-button#zoomOutButton sq v=gh s=sm: '-'
          - 'input#zoomSlider type="range" min="${minZoom}" max="${maxZoom}" step="${zoomStep}" :value=${zoomLevel} style="flex: 1; min-width: 0;"': null
          - rtgl-button#zoomInButton sq v=gh s=sm: +
          - rtgl-view w=64 ah=c av=c p=sm bgc=co br=full:
              - rtgl-text s=sm: ${zoomPercent}%
