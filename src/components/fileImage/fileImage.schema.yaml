componentName: rvn-file-image
propsSchema:
  type: object
  properties:
    fileId:
      type: string
    originalFileId:
      type: string
      description: Checks this original and the displayed thumbnail against their saved hashes without decoding the original.
    showErrorMessage:
      type: boolean
      description: Shows re-upload guidance with the warning icon when an image cannot be read or verified.
    imageId:
      type: string
    source:
      type: string
    br:
      type: string
    wh:
      type: string
    w:
      type: string
    h:
      type: string
    bw:
      type: string
    bc:
      type: string
    cur:
      type: string
    lazy:
      type: boolean
    lazyRootMargin:
      type: string
    key:
      type: string
  required: []
