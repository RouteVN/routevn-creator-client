refs:
  addCharacterButton:
    eventListeners:
      click:
        handler: handleAddCharacterClick
  removeCharacter*:
    eventListeners:
      click:
        handler: handleRemoveCharacterClick
  characterSpriteBox*:
    eventListeners:
      click:
        handler: handleCharacterClick
      contextmenu:
        handler: handleCharacterContextMenu
  baseFileExplorer:
    eventListeners:
      item-click:
        handler: handleFileExplorerItemClick
  galleryScroll: {}
  searchInput:
    eventListeners:
      value-input:
        handler: handleSearchInput
  spriteItem*:
    eventListeners:
      click:
        handler: handleSpriteItemClick
      dblclick:
        handler: handleSpriteItemDoubleClick
  previewOverlay:
    eventListeners:
      click:
        action: hideFullImagePreview
  submitButton:
    eventListeners:
      click:
        handler: handleSubmitClick
  breadcumb:
    eventListeners:
      item-click:
        handler: handleBreadcumbClick
  spriteGroupTabs:
    eventListeners:
      item-click:
        handler: handleSpriteGroupTabClick
  buttonSelect:
    eventListeners:
      click:
        handler: handleButtonSelectClick
  form:
    eventListeners:
      form-field-event:
        handler: handleFormExtra
      form-change:
        handler: handleFormChange
      form-section-action:
        handler: handleFormSectionAction
  dropdownMenu:
    eventListeners:
      close:
        handler: handleDropdownMenuClose
      item-click:
        handler: handleDropdownMenuClickItem
  transform*:
    eventListeners:
      value-change:
        handler: handleTransformChange
  customTransformMode*:
    eventListeners:
      value-change:
        handler: handleTransformModeChange
  customTransformButton*:
    eventListeners:
      click:
        handler: handleCustomTransformButtonClick
      keydown:
        handler: handleCustomTransformButtonKeyDown
  animation*:
    eventListeners:
      value-change:
        handler: handleAnimationChange
  animationPlaybackSpeed*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackSpeedInput
  animationPlaybackLoop*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackLoopChange
  animationPlaybackContinuity*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackContinuityChange
  opacity*:
    eventListeners:
      value-input:
        handler: handleOpacityInput
  removeCharacterOpacity*:
    eventListeners:
      click:
        handler: handleRemoveCharacterOpacityClick
  blurX*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurY*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurQuality*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurKernelSize*:
    eventListeners:
      value-change:
        handler: handleBlurFieldChange
  blurRepeatEdgePixels*:
    eventListeners:
      value-change:
        handler: handleBlurFieldChange
  shaderAdjustment*:
    eventListeners:
      value-input:
        handler: handleShaderAdjustmentInput
  .characterSpriteGroupBox:
    eventListeners:
      click:
        handler: handleCharacterSpriteGroupBoxClick
  characterItem*:
    eventListeners:
      click:
        handler: handleCharacterItemClick
styles:
  ".commandLineCharacterThumbnailTransparencyGrid":
    background-color: "#eef2f7"
    background-image: 'linear-gradient(45deg, #94a3b8 25%, transparent 25%), linear-gradient(-45deg, #94a3b8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #94a3b8 75%), linear-gradient(-45deg, transparent 75%, #94a3b8 75%)'
    background-position: "0 0, 0 6px, 6px -6px, -6px 0"
    background-repeat: repeat
    background-size: 12px 12px
  ".commandLineCharacterFullPreviewTransparencyGrid":
    background-color: "#eef2f7"
    background-image: 'linear-gradient(45deg, #94a3b8 25%, transparent 25%), linear-gradient(-45deg, #94a3b8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #94a3b8 75%), linear-gradient(-45deg, transparent 75%, #94a3b8 75%)'
    background-position: "0 0, 0 12px, 12px -12px, -12px 0"
    background-repeat: repeat
    background-size: 24px 24px
template:
  - 'rtgl-view w=f h=f pv=md pos=rel style="min-width: 0; min-height: 0; overflow: hidden;"':
      - $if mode == 'current':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - 'rtgl-view h=1fg sv w=f style="min-height: 0;"':
              - rtgl-view g=md w=f:
                  - 'rtgl-form#form key="${formKey}" :form=${form} :defaultValues=${defaultValues} ph=md pv=none':
                      - $for character, i in defaultValues.characters:
                          - 'rtgl-view#characterSpriteBox${i}.characterRow slot=${character.spriteFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} cur=pointer bw=xs bc=bo h-bc=ac br=sm style="align-self: flex-start; flex: 0 0 auto;"':
                              - rtgl-view p=md g=md br=md:
                                  - $if character.hasSpritePreview:
                                      - 'div.commandLineCharacterThumbnailTransparencyGrid style="display: block; width: 200px; height: 120px; overflow: hidden; border-radius: 4px;"':
                                          - rvn-stacked-file-images :layers=${character.spritePreviewLayers} w=f h=f br=sm spritesheetBr=none spritesheetCheckerCellSize=6 showSpritesheetCheckerboard=false lazy: null
                                    $else:
                                      - rtgl-view w=200 h=120 av=c ah=c bgc=mu-fg:
                                          - rtgl-text s=sm c=mu-fg: ${noSpriteLabel}
                                  - rtgl-text s=xs c=mu-fg ellipsis w=200: ${character.displayName}
                          - 'rtgl-view.characterRow slot=${character.transformModeFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} w=f':
                              - rtgl-segmented-control#customTransformMode${i} data-index=${character.characterIndex} w=f no-clear :selectedValue=${character.customTransform} :options=${defaultValues.transformModeOptions}: null
                          - $if !character.customTransform:
                              - 'rtgl-select#transform${i} slot=${character.predefinedTransformFormSlot} data-index=${character.characterIndex} key=${character.transformId} :options=${defaultValues.transformOptions} :selectedValue=${character.transformId} w=f no-clear': null
                          - $if character.customTransform:
                              - 'rtgl-view#customTransformButton${i}.characterRow slot=${character.customTransformFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} data-target-name="${character.displayName}" role=button tabindex=0 aria-label="${transformEditorTitle}" w=f p=md bw=xs bc=bo h-bc=pr br=md bgc=bg cur=pointer style="box-sizing: border-box;"':
                                  - rtgl-grid cols=2 g=md w=f:
                                      - $for item, j in character.customTransformDetails:
                                          - rtgl-view d=h av=c g=sm:
                                              - rtgl-text s=sm c=mu-fg: ${item.label}
                                              - 'rtgl-text s=sm style="font-variant-numeric: tabular-nums;"': ${item.value}
                          - 'rtgl-view.characterRow slot=${character.animationFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} w=f':
                              - rtgl-select#animation${i} data-index=${character.characterIndex} key=${character.animationId} :options=${defaultValues.animationOptions} :selectedValue=${character.animationId} w=f placeholder=${selectAnimationPlaceholder}: null
                          - $if character.animationId:
                              - 'rtgl-view.characterRow slot=${character.playbackSpeedFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} w=f':
                                  - rtgl-slider-input#animationPlaybackSpeed${i} data-index=${character.characterIndex} min=0.01 max=4 step=0.01 w=f value=${character.animationPlaybackSpeed}: null
                              - 'rtgl-view.characterRow slot=${character.playbackContinuityFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} w=f':
                                  - rtgl-segmented-control#animationPlaybackContinuity${i} data-index=${character.characterIndex} w=f no-clear :selectedValue=${character.animationPlaybackContinuity} :options=${defaultValues.animationPlaybackContinuityOptions}: null
                              - $if character.animationMode == 'update':
                                  - 'rtgl-view.characterRow slot=${character.playbackLoopFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} g=xs w=f':
                                      - rtgl-segmented-control#animationPlaybackLoop${i} data-index=${character.characterIndex} w=f no-clear ?disabled=${character.animationLoopDisabled} :selectedValue=${character.animationPlaybackLoop} :options=${defaultValues.animationPlaybackLoopOptions}: null
                          - $if character.opacityOptionEnabled:
                              - 'rtgl-view.characterRow slot=${character.opacityFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} g=md w=f':
                                  - rtgl-view d=h av=c w=f g=md:
                                      - rtgl-text w=1fg: ${opacityLabel}
                                      - 'rtgl-button#removeCharacterOpacity${i} data-index=${character.characterIndex} sq s=sm v=gh pre=x title="${removeOpacityLabel}" aria-label="${removeOpacityLabel}"': null
                                  - rtgl-slider-input#opacity${i} data-index=${character.characterIndex} key=${character.id} min=0 max=1 step=0.01 w=f value=${character.opacity}: null
                          - $if character.blurOptionEnabled:
                              - 'rtgl-input-number#blurX${i} slot=${character.blurXFormSlot} data-index=${character.characterIndex} data-blur-field=x min=0 w=f value=${character.blur.x}': null
                              - 'rtgl-input-number#blurY${i} slot=${character.blurYFormSlot} data-index=${character.characterIndex} data-blur-field=y min=0 w=f value=${character.blur.y}': null
                              - 'rtgl-input-number#blurQuality${i} slot=${character.blurQualityFormSlot} data-index=${character.characterIndex} data-blur-field=quality min=1 step=1 w=f value=${character.blur.quality}': null
                              - 'rtgl-select#blurKernelSize${i} slot=${character.blurKernelSizeFormSlot} data-index=${character.characterIndex} data-blur-field=kernelSize w=f no-clear :selectedValue=${character.blur.kernelSize} :options=${defaultValues.blurKernelSizeOptions}': null
                              - 'rtgl-segmented-control#blurRepeatEdgePixels${i} slot=${character.blurRepeatEdgePixelsFormSlot} data-index=${character.characterIndex} data-blur-field=repeatEdgePixels w=f no-clear :selectedValue=${character.blur.repeatEdgePixels} :options=${defaultValues.blurRepeatEdgeOptions}': null
                          - $for adjustment, adjustmentIndex in character.shaderAdjustments:
                              - $if adjustment.enabled:
                                  - 'rtgl-slider-input#shaderAdjustment${i}x${adjustmentIndex} slot=${adjustment.formSlot} data-index=${character.characterIndex} data-adjustment-id=${adjustment.id} min=${adjustment.min} max=${adjustment.max} step=${adjustment.step} w=f value=${adjustment.value}': null
                          - $if character.showSpriteGroupBoxes:
                              - 'rtgl-view.characterRow slot=${character.spriteGroupsFormSlot} data-index=${character.characterIndex} data-character-id=${character.id} d=h wrap g=xs w=f':
                                  - $for spriteGroup, j in character.spriteGroupBoxes:
                                      - 'rtgl-view.characterSpriteGroupBox data-index=${character.characterIndex} data-sprite-group-id=${spriteGroup.id} d=h av=c g=xs ph=md pv=xs cur=pointer bw=xs bc=bo h-bc=pr br=sm bgc=${spriteGroup.backgroundColor}':
                                          - rtgl-text s=xs: ${spriteGroup.name}
                  - rtgl-button#addCharacterButton v=ol w=f mt=md mh=lg: ${addCharacterButtonLabel}
                  - 'rtgl-view h=240 aria-hidden=true style="flex: 0 0 240px;"': null
          - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md style="flex: 0 0 auto;"':
              - rtgl-button#submitButton: ${submitButtonLabel}
      - $if mode == 'character-select':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - rtgl-view d=h w=f av=c g=md ph=md:
              - rtgl-view w=1fg: null
              - rtgl-input#searchInput s=sm placeholder=${searchPlaceholder} value=${searchQuery} h=1fg: null
          - 'rtgl-view d=h w=f g=lg mt=sm h=1fg ph=md style="min-height: 0;"':
              - rtgl-view h=f w=1fg sv:
                  - rvn-base-file-explorer#baseFileExplorer :items=${items}: null
              - rtgl-view#galleryScroll h=f w=2fg sv g=lg:
                  - $for group, i in groups:
                      - rtgl-view data-group-id=${group.id} g=md:
                          - rtgl-view d=h av=c g=md:
                              - rtgl-svg svg=folder wh=16: null
                              - rtgl-text: ${group.fullLabel}
                          - rtgl-view d=h w=f wrap g=lg:
                              - $for item, j in group.children:
                                  - rtgl-view#characterItem${i}x${j} data-character-id=${item.id} cur=pointer bw=xs bc=${item.itemBorderColor} h-bc=${item.itemHoverBorderColor} br=sm:
                                      - rtgl-view p=md g=md br=md:
                                          - $if item.fileId:
                                              - 'div.commandLineCharacterThumbnailTransparencyGrid style="display: block; width: 200px; height: 120px; overflow: hidden; border-radius: 4px;"':
                                                  - rvn-file-image fileId=${item.fileId} w=f h=f br=sm: null
                                            $else:
                                              - rtgl-view w=200 h=120 av=c ah=c bgc=mu-fg:
                                                  - rtgl-text s=sm c=mu-fg: ${noAvatarLabel}
                                          - rtgl-text s=xs c=mu-fg ellipsis w=200: ${item.name}
      - $if mode == 'sprite-select':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - $if showSpriteGroupTabs:
              - rtgl-view w=f ph=md:
                  - rtgl-tabs#spriteGroupTabs :items=${spriteSelectionTabs} selected-tab=${selectedSpriteGroupId}: null
          - rtgl-view d=h w=f av=c g=md ph=md:
              - rtgl-view w=1fg: null
              - rtgl-input#searchInput s=sm placeholder=${searchPlaceholder} value=${searchQuery} h=1fg: null
          - 'rtgl-view d=h w=f g=lg mt=sm h=1fg ph=md style="min-height: 0;"':
              - rtgl-view h=f w=1fg sv:
                  - rvn-base-file-explorer#baseFileExplorer :items=${spriteItems}: null
              - rtgl-view#galleryScroll h=f w=2fg sv g=lg:
                  - $for group, i in spriteGroups:
                      - rtgl-view data-group-id=${group.id} g=md:
                          - rtgl-view d=h av=c g=md:
                              - rtgl-svg svg=folder wh=16: null
                              - rtgl-text: ${group.fullLabel}
                          - rtgl-view d=h w=f wrap g=lg:
                              - $for item, j in group.children:
                                  - rtgl-view#spriteItem${i}x${j} data-sprite-id=${item.id} cur=pointer bw=xs bc=${item.itemBorderColor} h-bc=${item.itemHoverBorderColor} br=sm:
                                      - rtgl-view p=md g=md br=md:
                                          - $if item.previewKind == 'spritesheet':
                                              - 'rvn-spritesheet-preview key=${item.previewKey} previewKey=${item.previewKey} fileId=${item.previewFileId} :atlas=${item.previewAtlas} :animation=${item.previewAnimation} w=200 h=120 br=sm checkerCellSize=6 showCheckerboard=true emptyLabel="${noPreviewLabel}"': null
                                            $else:
                                              - 'div.commandLineCharacterThumbnailTransparencyGrid style="display: block; width: 200px; height: 120px; overflow: hidden; border-radius: 4px;"':
                                                  - rvn-file-image fileId=${item.previewFileId} w=f h=f br=sm: null
                                          - rtgl-text s=xs c=mu-fg ellipsis w=200: ${item.name}
          - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md style="flex: 0 0 auto;"':
              - rtgl-button#buttonSelect: ${selectButtonLabel}
  - $if fullImagePreviewVisible:
      - rtgl-view#previewOverlay pos=fix edge=f z=3000 cur=pointer:
          - rtgl-view w=f h=f pos=fix edge=f bgc=bg: null
          - $if fullImagePreviewFileId:
              - rtgl-view pos=fix edge=f ah=c av=c z=3001:
                  - $if fullImagePreviewKind == 'spritesheet':
                      - 'rvn-spritesheet-preview key=${fullImagePreviewKey} previewKey=${fullImagePreviewKey} fileId=${fullImagePreviewFileId} :atlas=${fullImagePreviewAtlas} :animation=${fullImagePreviewAnimation} w=80% h=80% checkerCellSize=12 showCheckerboard=true emptyLabel="${noPreviewLabel}"': null
                    $else:
                      - 'div.commandLineCharacterFullPreviewTransparencyGrid style="display: block; width: 80%; height: 80%; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px var(--accent);"':
                          - rvn-file-image fileId=${fullImagePreviewFileId} w=f h=f br=md: null
  - rtgl-dropdown-menu#dropdownMenu :items=${dropdownMenu.items} x=${dropdownMenu.position.x} y=${dropdownMenu.position.y} ?open=${dropdownMenu.isOpen}: null
