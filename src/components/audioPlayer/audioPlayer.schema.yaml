componentName: rvn-audio-player
propsSchema:
  type: object
  properties:
    title:
      type: string
      description: Title of the audio player, used for accessibility
      default: Audio Player
    fileId:
      type: string
      description: ID of the audio file to play
    src:
      type: string
      description: URL of audio to play instead of a project file, such as a package's sound before it is imported
    autoPlay:
      type: boolean
      description: Whether to start playing automatically
      default: false
    mobileLayout:
      type: boolean
      description: Whether to use compact mobile playback controls
      default: false
