refs:
  toolbarItem*:
    eventListeners:
      pointerdown:
        handler: handleToolbarItemPointerDown
      mousedown:
        handler: handleToolbarItemMouseDown
      pointerup:
        handler: handleToolbarItemPointerUp
      pointercancel:
        handler: handleToolbarItemPointerCancel
      lostpointercapture:
        handler: handleToolbarItemLostPointerCapture
      touchstart:
        handler: handleToolbarItemTouchStart
      touchend:
        handler: handleToolbarItemTouchEnd
      touchcancel:
        handler: handleToolbarItemTouchCancel
      contextmenu:
        handler: handleToolbarItemContextMenu
      click:
        handler: handleToolbarItemClick
  moreMenu:
    eventListeners:
      close:
        handler: handleMoreMenuClose
      item-click:
        handler: handleMoreMenuItemClick
template:
  - 'rtgl-view pos=fix w=${toolbarWidth} h=48 bgc=bg bwb=xs bc=bo style="left: 0; ${toolbarPositionStyle}; z-index: 1450; box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.12); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;"':
      - rtgl-view w=f h=f d=h av=c ah=c g=xs:
          - $for item, i in toolbarItems:
              - 'rtgl-view#toolbarItem${i} data-action-id=${item.id} title="${item.title}" aria-label="${item.title}" aria-disabled="${item.disabled}" role=button w=${item.width} h=42 br=md av=c ah=c bgc=${item.bgColor} h-bgc=ac cur=pointer style="touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;"':
                  - 'rtgl-view op=${item.opacity} style="${item.iconStyle}"':
                      - rtgl-svg svg=${item.icon} wh=20 c=mu-fg: null
  - 'rtgl-dropdown-menu#moreMenu :items=${moreMenuItems} ?open=${moreMenu.open} x=${moreMenu.x} y=${moreMenu.y} place=te w=220 h=fit-content aria-label="${moreMenuLabel}"': null
