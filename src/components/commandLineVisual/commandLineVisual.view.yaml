refs:
  addVisualButton:
    eventListeners:
      click:
        handler: handleAddVisualClick
  addVisualPopover:
    eventListeners:
      close:
        handler: handleAddVisualPopoverClose
  addVisualForm:
    eventListeners:
      form-action:
        handler: handleAddVisualFormAction
  removeVisual*:
    eventListeners:
      click:
        handler: handleRemoveVisualClick
  visualItem*:
    eventListeners:
      click:
        handler: handleVisualListItemClick
      contextmenu:
        handler: handleVisualContextMenu
  cancelEditButton:
    eventListeners:
      click:
        handler: handleCancelEditClick
  saveVisualButton:
    eventListeners:
      click:
        handler: handleSaveVisualClick
  layoutType*:
    eventListeners:
      value-change:
        handler: handleLayoutTypeChange
  layoutImage*:
    eventListeners:
      click:
        handler: handleLayoutImageClick
  layoutSelectItem*:
    eventListeners:
      click:
        handler: handleLayoutSelectItemClick
  layoutSelectButton:
    eventListeners:
      click:
        handler: handleLayoutSelectConfirmClick
  submitButton:
    eventListeners:
      click:
        handler: handleSubmitClick
  breadcumb:
    eventListeners:
      item-click:
        handler: handleBreadcumbClick
  dropdownMenu:
    eventListeners:
      close:
        handler: handleDropdownMenuClose
      item-click:
        handler: handleDropdownMenuClickItem
  form:
    eventListeners:
      form-section-action:
        handler: handleFormSectionAction
  transform*:
    eventListeners:
      value-change:
        handler: handleTransformChange
  customTransformMode*:
    eventListeners:
      value-change:
        handler: handleTransformModeChange
  customTransformButton*:
    eventListeners:
      click:
        handler: handleCustomTransformButtonClick
      keydown:
        handler: handleCustomTransformButtonKeyDown
  animation*:
    eventListeners:
      value-change:
        handler: handleAnimationChange
  animationPlaybackSpeed*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackSpeedInput
  animationPlaybackLoop*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackLoopChange
  animationPlaybackContinuity*:
    eventListeners:
      value-change:
        handler: handleAnimationPlaybackContinuityChange
  opacity*:
    eventListeners:
      value-input:
        handler: handleOpacityInput
  blurX*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurY*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurQuality*:
    eventListeners:
      value-input:
        handler: handleBlurFieldInput
  blurKernelSize*:
    eventListeners:
      value-change:
        handler: handleBlurFieldChange
  blurRepeatEdgePixels*:
    eventListeners:
      value-change:
        handler: handleBlurFieldChange
  shaderAdjustment*:
    eventListeners:
      value-input:
        handler: handleShaderAdjustmentInput
styles:
  ".visualResourceThumbnailTransparencyGrid":
    background-color: "#eef2f7"
    background-image: 'linear-gradient(45deg, #94a3b8 25%, transparent 25%), linear-gradient(-45deg, #94a3b8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #94a3b8 75%), linear-gradient(-45deg, transparent 75%, #94a3b8 75%)'
    background-position: "0 0, 0 6px, 6px -6px, -6px 0"
    background-repeat: repeat
    background-size: 12px 12px
template:
  - 'rtgl-view w=f h=f pv=md pos=rel style="min-width: 0; min-height: 0; overflow: hidden;"':
      - $if mode == 'current':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - 'rtgl-view h=1fg sv w=f g=md style="min-height: 0;"':
              - rtgl-view g=md w=f ph=md:
                  - $for group, g in visualListGroups:
                      - rtgl-view g=sm w=f:
                          - rtgl-text s=sm c=mu-fg: ${group.label}
                          - $for visual, i in group.visuals:
                              - 'rtgl-view#visualItem${visual.listIndex} data-index=${visual.visualIndex} data-visual-id=${visual.id} d=h av=c w=f g=md p=sm bw=xs bc=bo h-bc=ac br=md cur=pointer':
                                  - 'rtgl-view br=sm overflow=hidden style="flex: 0 0 96px; width: 96px;"':
                                      - 'div.visualResourceThumbnailTransparencyGrid style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;"':
                                          - $if visual.snapshotUrl:
                                              - rtgl-image src=${visual.snapshotUrl} w=f h=f of=con: null
                                            $elif visual.awaitsSnapshot:
                                              - rtgl-view w=f h=f: null
                                            $elif visual.resourceType == 'spritesheet':
                                              - rvn-spritesheet-preview key=${visual.spritesheetPreviewKey} previewKey=${visual.spritesheetPreviewKey} fileId=${visual.spritesheetFileId} :atlas=${visual.spritesheetAtlas} :animation=${visual.spritesheetAnimation} w=f h=f emptyLabel=${noThumbnailLabel}: null
                                            $elif visual.fileId:
                                              - rvn-file-image fileId=${visual.fileId} w=f h=f: null
                                            $else:
                                              - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                                  - rtgl-text s=xs c=mu-fg ta=c: ${noThumbnailLabel}
                                  - 'rtgl-view w=1fg g=xs style="min-width: 0;"':
                                      - $for detail, j in visual.details:
                                          - 'rtgl-view d=h g=sm w=f style="min-width: 0;"':
                                              - 'rtgl-text s=xs c=mu-fg style="white-space: nowrap; flex: 0 0 auto;"': ${detail.label}
                                              - rtgl-text s=xs w=1fg ellipsis=true: ${detail.value}
                                      - $if visual.effects.length > 0:
                                          - rtgl-view d=h wrap g=xs w=f:
                                              - $for effect, k in visual.effects:
                                                  - rtgl-text s=xs ph=sm bw=xs bc=bo br=sm: ${effect}
                  - rtgl-button#addVisualButton v=ol w=f mt=md: ${addVisualButtonLabel}
              - 'rtgl-view h=240 aria-hidden=true style="flex: 0 0 240px;"': null
          - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md pt=md style="flex: 0 0 auto;"':
              - rtgl-button#submitButton: ${submitButtonLabel}
      - $if mode == 'edit':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - 'rtgl-view h=1fg sv w=f g=md style="min-height: 0;"':
              - 'rtgl-form#form key="${formKey}" :form=${form} :defaultValues=${defaultValues} ph=md pv=none':
                  - $for visual, i in editingVisuals:
                      - 'rtgl-view slot=${visual.previewFormSlot} data-index=${visual.visualIndex} data-visual-id=${visual.id} style="align-self: flex-start; flex: 0 0 auto; min-width: 0; max-width: 100%;"':
                          - 'rtgl-view#layoutImage${visual.controlId} data-visual-id=${visual.id} bw=xs bc=bo h-bc=ac cur=pointer br=md overflow=hidden style="width: 200px; min-width: 0; max-width: 100%; box-sizing: border-box;"':
                              - 'div style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;"':
                                  - $if visual.awaitsExistingLayout:
                                      - rtgl-view w=f h=f bgc=mu: null
                                    $elif visual.snapshotUrl:
                                      - 'div.visualResourceThumbnailTransparencyGrid style="width: 100%; height: 100%;"':
                                          - rtgl-image src=${visual.snapshotUrl} w=f h=f of=con: null
                                    $elif visual.awaitsSnapshot:
                                      - 'div.visualResourceThumbnailTransparencyGrid style="width: 100%; height: 100%;"': null
                                    $elif visual.resourceType == 'image':
                                      - 'div.visualResourceThumbnailTransparencyGrid style="width: 100%; height: 100%;"':
                                          - $if visual.fileId:
                                              - rvn-file-image fileId=${visual.fileId} w=f h=f: null
                                            $else:
                                              - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                                  - rtgl-text s=sm c=mu-fg: ${noResourceLabel}
                                    $elif visual.resourceType == 'video':
                                      - rtgl-view pos=rel w=f h=f:
                                          - $if visual.fileId:
                                              - rvn-file-image fileId=${visual.fileId} w=f h=f: null
                                            $else:
                                              - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                                  - rtgl-text s=sm c=mu-fg: ${noThumbnailLabel}
                                          - rtgl-view pos=abs w=f h=f av=c ah=c bgc=bg-60:
                                              - rtgl-svg svg=play wh=32 c=fg: null
                                    $elif visual.resourceType == 'spritesheet':
                                      - rvn-spritesheet-preview key=${visual.spritesheetPreviewKey} previewKey=${visual.spritesheetPreviewKey} fileId=${visual.spritesheetFileId} :atlas=${visual.spritesheetAtlas} :animation=${visual.spritesheetAnimation} w=f h=f emptyLabel=${noThumbnailLabel}: null
                                    $elif visual.resourceType == 'layout' || visual.resourceType == 'particle':
                                      - $if visual.fileId:
                                          - rvn-file-image fileId=${visual.fileId} w=f h=f: null
                                        $else:
                                          - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                              - rtgl-text s=sm c=mu-fg: ${noThumbnailLabel}
                                    $elif visual.fileId:
                                      - rvn-file-image fileId=${visual.fileId} w=f h=f: null
                                    $else:
                                      - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                          - rtgl-text s=sm c=mu-fg: ${noResourceLabel}
                              - $if visual.awaitsExistingLayout:
                                  - rtgl-view w=f p=md:
                                      - rtgl-text s=xs c=mu-fg ellipsis w=f: ${selectLayoutLabel}
                                $elif visual.isCustomLayout:
                                  - rtgl-view w=f p=md:
                                      - rtgl-text s=xs c=mu-fg ellipsis w=f: ${customLayoutLabel}
                                $else:
                                  - rtgl-view w=f p=md:
                                      - rtgl-text s=xs c=mu-fg ellipsis w=f: ${visual.displayName}
                      - 'rtgl-view slot=${visual.layoutTypeFormSlot} data-index=${visual.visualIndex} w=f':
                          - rtgl-segmented-control#layoutType${visual.controlId} data-index=${visual.visualIndex} w=f no-clear :selectedValue=${visual.layoutType} :options=${defaultValues.layoutTypeOptions}: null
                      - 'rtgl-view slot=${visual.transformModeFormSlot} data-index=${visual.visualIndex} w=f':
                          - rtgl-segmented-control#customTransformMode${visual.controlId} data-index=${visual.visualIndex} w=f no-clear :selectedValue=${visual.customTransform} :options=${defaultValues.transformModeOptions}: null
                      - $if !visual.customTransform:
                          - 'rtgl-select#transform${visual.controlId} slot=${visual.predefinedTransformFormSlot} data-index=${visual.visualIndex} key=${visual.transformId} :options=${defaultValues.transformOptions} :selectedValue=${visual.transformId} w=f placeholder=${selectTransformPlaceholder}': null
                      - $if visual.customTransform:
                          - 'rtgl-view#customTransformButton${visual.controlId} slot=${visual.customTransformFormSlot} data-index=${visual.visualIndex} data-target-name="${visual.displayName}" role=button tabindex=0 aria-label="${transformEditorTitle}" w=f p=md bw=xs bc=bo h-bc=pr br=md bgc=bg cur=pointer style="box-sizing: border-box;"':
                              - rtgl-grid cols=2 g=md w=f:
                                  - $for item, j in visual.customTransformDetails:
                                      - rtgl-view d=h av=c g=sm:
                                          - rtgl-text s=sm c=mu-fg: ${item.label}
                                          - 'rtgl-text s=sm style="font-variant-numeric: tabular-nums;"': ${item.value}
                      - 'rtgl-select#animation${visual.controlId} slot=${visual.animationFormSlot} data-index=${visual.visualIndex} key=${visual.animationId} :options=${defaultValues.animationOptions} :selectedValue=${visual.animationId} w=f placeholder=${selectAnimationPlaceholder}': null
                      - $if visual.animationId:
                          - 'rtgl-input#animationPlaybackSpeed${visual.controlId} slot=${visual.playbackSpeedFormSlot} data-index=${visual.visualIndex} type=number min=0.01 step=0.1 w=f value=${visual.animationPlaybackSpeed}': null
                          - 'rtgl-segmented-control#animationPlaybackContinuity${visual.controlId} slot=${visual.playbackContinuityFormSlot} data-index=${visual.visualIndex} w=f no-clear :selectedValue=${visual.animationPlaybackContinuity} :options=${defaultValues.animationPlaybackContinuityOptions}': null
                          - $if visual.animationMode == 'update':
                              - 'rtgl-view slot=${visual.playbackLoopFormSlot} data-index=${visual.visualIndex} g=xs w=f':
                                  - rtgl-segmented-control#animationPlaybackLoop${visual.controlId} data-index=${visual.visualIndex} w=f no-clear ?disabled=${visual.animationLoopDisabled} :selectedValue=${visual.animationPlaybackLoop} :options=${defaultValues.animationPlaybackLoopOptions}: null
                                  - $if !visual.animationCanLoop:
                                      - rtgl-text s=xs c=mu-fg: ${animationPlaybackLoopDisabledDescription}
                      - $if visual.opacityEnabled:
                          - 'rtgl-slider-input#opacity${visual.controlId} slot=${visual.opacityFormSlot} data-index=${visual.visualIndex} key=${visual.id} min=0 max=1 step=0.01 w=f value=${visual.opacity}': null
                      - $if visual.blurEnabled:
                          - 'rtgl-slider-input#blurX${visual.controlId} slot=${visual.blurXFormSlot} data-index=${visual.visualIndex} data-blur-field=x min=0 max=${visual.blurSliderMax.x} step=0.5 w=f value=${visual.blur.x}': null
                          - 'rtgl-slider-input#blurY${visual.controlId} slot=${visual.blurYFormSlot} data-index=${visual.visualIndex} data-blur-field=y min=0 max=${visual.blurSliderMax.y} step=0.5 w=f value=${visual.blur.y}': null
                          - 'rtgl-slider-input#blurQuality${visual.controlId} slot=${visual.blurQualityFormSlot} data-index=${visual.visualIndex} data-blur-field=quality min=1 max=${visual.blurSliderMax.quality} step=1 w=f value=${visual.blur.quality}': null
                          - 'rtgl-select#blurKernelSize${visual.controlId} slot=${visual.blurKernelSizeFormSlot} data-index=${visual.visualIndex} data-blur-field=kernelSize w=f no-clear :selectedValue=${visual.blur.kernelSize} :options=${defaultValues.blurKernelSizeOptions}': null
                          - 'rtgl-segmented-control#blurRepeatEdgePixels${visual.controlId} slot=${visual.blurRepeatEdgePixelsFormSlot} data-index=${visual.visualIndex} data-blur-field=repeatEdgePixels w=f no-clear :selectedValue=${visual.blur.repeatEdgePixels} :options=${defaultValues.blurRepeatEdgeOptions}': null
                      - $for adjustment, adjustmentIndex in visual.shaderAdjustments:
                          - $if adjustment.enabled:
                              - 'rtgl-slider-input#shaderAdjustment${visual.controlId}x${adjustmentIndex} slot=${adjustment.formSlot} data-index=${visual.visualIndex} data-adjustment-id=${adjustment.id} min=${adjustment.min} max=${adjustment.max} step=${adjustment.step} w=f value=${adjustment.value}': null
              - 'rtgl-view h=240 aria-hidden=true style="flex: 0 0 240px;"': null
          - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md pt=md style="flex: 0 0 auto;"':
              - rtgl-button#cancelEditButton v=ol: ${cancelButtonLabel}
              - rtgl-button#saveVisualButton: ${saveVisualButtonLabel}
      - $if mode == 'layout-select':
          - rtgl-view w=f h=24 av=c ph=md mb=md:
              - rtgl-breadcrumb#breadcumb :items=${breadcrumb}: null
          - 'rtgl-view h=1fg sv w=f g=lg ph=md style="min-height: 0;"':
              - $for group, i in layoutSelectGroups:
                  - rtgl-view g=md w=f:
                      - $if group.fullLabel:
                          - rtgl-view d=h av=c g=md:
                              - rtgl-svg svg=folder wh=16: null
                              - rtgl-text: ${group.fullLabel}
                      - 'rtgl-view d=h w=f wrap g=lg style="${resourceSelectorGridStyle}"':
                          - $for item, j in group.children:
                              - 'rtgl-view#layoutSelectItem${i}x${j} data-resource-id=${item.id} cur=pointer bw=xs bc=${item.itemBorderColor} h-bc=${item.itemHoverBorderColor} br=md style="${resourceSelectorItemStyle}"':
                                  - 'rtgl-view br=md overflow=hidden style="${item.resourceCardStyle}"':
                                      - 'rtgl-view w=f style="aspect-ratio: 16 / 9; overflow: hidden;"':
                                          - $if item.previewFileId:
                                              - rvn-file-image fileId=${item.previewFileId} w=f h=f: null
                                            $else:
                                              - rtgl-view w=f h=f av=c ah=c bgc=mu-fg:
                                                  - rtgl-text s=sm c=mu-fg: ${noThumbnailLabel}
                                      - rtgl-view w=f p=md:
                                          - rtgl-text s=xs c=mu-fg ellipsis w=f: ${item.name}
              - 'rtgl-view h=240 aria-hidden=true style="flex: 0 0 240px;"': null
          - 'rtgl-view d=h av=c ah=e w=f g=lg ph=md pt=md style="flex: 0 0 auto;"':
              - rtgl-button#layoutSelectButton: ${selectButtonLabel}
  - rtgl-dropdown-menu#dropdownMenu :items=${dropdownMenu.items} x=${dropdownMenu.position.x} y=${dropdownMenu.position.y} ?open=${dropdownMenu.isOpen}: null
  - rtgl-popover#addVisualPopover ?open=${addVisualPopover.isOpen} x=${addVisualPopover.position.x} y=${addVisualPopover.position.y} place=bs:
      - rtgl-form#addVisualForm key=${addVisualPopover.isOpen} slot=content :defaultValues=${addVisualDefaultValues} :form=${addVisualForm} w=320: null
