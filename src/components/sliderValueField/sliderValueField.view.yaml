refs:
  valueButton:
    eventListeners:
      click:
        handler: handleValueClick
      keydown:
        handler: handleValueKeyDown
  popover:
    eventListeners:
      close:
        handler: handlePopoverClose
  form:
    eventListeners:
      form-input:
        handler: handleFormInput
      form-change:
        handler: handleFormChange
      keydown:
        handler: handleFormKeyDown
  presetsButton:
    eventListeners:
      click:
        handler: handlePresetsButtonClick
  stepButton*:
    eventListeners:
      hold-repeat:
        handler: handleStepPress
  submitButton:
    eventListeners:
      click:
        handler: handleSubmitClick
template:
  - rtgl-view#valueButton role=button tabindex=0 aria-label="${label}" w=f d=h ph=md br=md av=c cur=pointer bw=xs bc=bo h-bc=ac h=32 bgc=su:
      - rtgl-text s=sm: ${valueText}
  - 'rtgl-popover#popover ?open=${popover.open} place=b x=${popover.x} y=${popover.y} content-style="max-width: calc(100vw - 16px);"':
      - $if popover.open:
          - 'rtgl-view slot=content style="width: 360px; max-width: 100%;"':
              - rtgl-form#form autofocus key=${popover.key} :form=${popoverForm} :defaultValues=${popoverDefaultValues} w=f:
                  - rtgl-view slot="slider-presets" d=h av=c w=f g=xs:
                      - 'rtgl-button#presetsButton sq v=ol s=sm pre=chevronDown aria-label="${presetsLabel}" title="${presetsLabel}"': null
                      - rtgl-view w=1fg: null
                      - $for stepButton, i in stepButtons:
                          - 'rtgl-button#stepButton${i} v=ol s=sm w=44 data-delta=${stepButton.delta} data-hold-repeat=true aria-label="${stepButton.label}" title="${stepButton.label}"': ${stepButton.text}
                      - rtgl-view w=1fg: null
                      - rtgl-button#submitButton v=pr s=sm: ${submitLabel}
