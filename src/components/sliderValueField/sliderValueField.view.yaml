refs:
  valueButton:
    eventListeners:
      click:
        handler: handleValueClick
      keydown:
        handler: handleValueKeyDown
  popover:
    eventListeners:
      close:
        handler: handlePopoverClose
  form:
    eventListeners:
      form-input:
        handler: handleFormInput
      form-change:
        handler: handleFormChange
      form-action:
        handler: handleFormAction
  presetsButton:
    eventListeners:
      click:
        handler: handlePresetsButtonClick
  stepButton*:
    eventListeners:
      hold-repeat:
        handler: handleStepPress
template:
  - rtgl-view#valueButton role=button tabindex=0 aria-label="${label}" w=f d=h ph=md br=md av=c cur=pointer bw=xs bc=bo h-bc=ac h=32 bgc=su:
      - rtgl-text s=sm: ${valueText}
  - rtgl-popover#popover ?open=${popover.open} place=b x=${popover.x} y=${popover.y}:
      - $if popover.open:
          - rtgl-view slot=content w=360:
              - rtgl-form#form autofocus key=${popover.key} :form=${popoverForm} :defaultValues=${popoverDefaultValues} w=f:
                  - rtgl-view slot="slider-presets" d=h av=c w=f g=xs:
                      - rtgl-button#presetsButton v=ol s=sm suf=chevronDown: ${presetsLabel}
                      - rtgl-view w=1fg: null
                      - $for stepButton, i in stepButtons:
                          - 'rtgl-button#stepButton${i} sq v=ol s=sm pre=${stepButton.icon} data-delta=${stepButton.delta} data-hold-repeat=true aria-label="${stepButton.label}" title="${stepButton.label}"': null
