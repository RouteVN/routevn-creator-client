componentName: rvn-slider-value-field
propsSchema:
  type: object
  properties:
    value:
      type: [number, string]
      description: >-
        The value the field shows. An unset value, undefined or empty, shows
        the field's emptyText, or its default.
    label:
      type: string
      description: The field's name, which screen readers announce.
    field:
      type: object
      description: >-
        The slider popover's field: step and fastStep, the slider's range, the
        min and max that bound the value, defaultValue, emptyText for an
        unset value, the presets ({ label, value, suffixText }; an empty value
        unsets the number), the unit shown after the value, and
        stepsAsPercent to show the steps as percentages. See
        src/internal/ui/sliderPopover.js.
events:
  value-input:
    type: object
  value-change:
    type: object
  value-cancel:
    type: object
