componentName: rvn-action-transform-editor
propsSchema:
  type: object
  properties:
    transform:
      type: object
    targetName:
      type: string
    targetType:
      type: string
      enum:
        - background
        - visual
        - character
    canvasAspectRatio:
      type: string
    projectResolution:
      type: object
    selectedElementMetrics:
      type: object
events:
  transform-change:
    type: object
  transform-preview:
    type: object
  transform-preview-cancel:
    type: object
  canvas-resize:
    type: object
  canvas-drag-cancel:
    type: object
  done:
    type: object
  cancel:
    type: object
methods:
  type: object
  properties:
    getCanvasRoot:
      description: Returns the mounted canvas used by the action transform preview.
      params: []
      returns: object
    setTransientTransform:
      description: Shows a transform the canvas is dragging in the inspector, without a render.
      params: []
      returns: void
