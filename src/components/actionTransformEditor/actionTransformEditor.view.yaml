refs:
  window:
    eventListeners:
      keydown:
        handler: handleWindowKeyDown
  doneButton:
    eventListeners:
      click:
        handler: handleDoneClick
  cancelButton:
    eventListeners:
      click:
        handler: handleCancelClick
  canvasZoomOutButton:
    eventListeners:
      click:
        handler: handleCanvasZoomOutClick
  canvasZoomResetButton:
    eventListeners:
      click:
        handler: handleCanvasZoomResetClick
  canvasZoomInButton:
    eventListeners:
      click:
        handler: handleCanvasZoomInClick
  actionTransformCanvasBackground:
    eventListeners:
      zoom-change:
        handler: handleCanvasZoomGesture
  transformInspector:
    eventListeners:
      update:
        handler: handleInspectorUpdate
      preview:
        handler: handleInspectorPreview
      preview-cancel:
        handler: handleInspectorPreviewCancel
  actionTransformCanvasHost:
    eventListeners:
      pointercancel:
        handler: handleCanvasPointerCancel
template:
  - 'rtgl-view w=f h=f d=v bgc=bg style="min-width: 0; min-height: 0; overflow: hidden;"':
      - 'rtgl-view h=48 w=f d=h av=c ph=md bwb=xs bc=bo g=md style="flex: 0 0 auto;"':
          - rtgl-text w=1fg ellipsis=true: ${title}
          - $if showCanvasZoomControls:
              - rtgl-view d=h av=c g=xs:
                  - 'rtgl-button#canvasZoomOutButton sq pre=zoomOut v=ol ?disabled=${canvasZoomOutDisabled} aria-label="${canvasZoomOutLabel}" title="${canvasZoomOutLabel}"': null
                  - 'rtgl-button#canvasZoomResetButton v=gh style="min-width: 64px;" aria-label="${canvasZoomFitLabel}" title="${canvasZoomFitLabel}"': ${canvasZoomLabel}
                  - 'rtgl-button#canvasZoomInButton sq pre=zoomIn v=ol ?disabled=${canvasZoomInDisabled} aria-label="${canvasZoomInLabel}" title="${canvasZoomInLabel}"': null
          - rtgl-button#cancelButton v=se: ${cancelButton}
          - rtgl-button#doneButton v=pr: ${doneButton}
      - 'rtgl-view#actionTransformWorkspace w=f h=1fg d=h style="min-width: 0; min-height: 0;"':
          - $if showTargetPanel:
              - 'rtgl-view w=220 h=f d=v p=md g=lg bwr=xs bc=bo style="box-sizing: border-box; flex: 0 0 auto; min-width: 0;"':
                  - rtgl-view g=sm w=f:
                      - rtgl-text s=sm: ${targetTitle}
                      - 'rtgl-view w=f p=md g=xs bw=xs bc=bo br=md bgc=mu style="box-sizing: border-box;"':
                          - rtgl-text s=xs c=mu-fg: ${targetTypeLabel}
                          - rtgl-text s=sm w=f ellipsis=true: ${targetName}
          # The canvas keeps its place when the panel moves between the right
          # and under it, so a tablet rotating does not remount it.
          - 'rtgl-view#actionTransformCanvasArea w=1fg h=f d=v style="min-width: 0; min-height: 0; container-type: size;"':
              - 'rvn-zoom-viewport#actionTransformCanvasBackground zoom=${canvasZoom} ?gestures=${showCanvasZoomControls} style="display: flex; flex-direction: column; width: 100%; min-width: 0; background-color: var(--background); ${canvasBackgroundStyle} background-image: radial-gradient(circle, var(--input) 1px, transparent 1px); background-size: 24px 24px;"':
                  - 'div style="${canvasWrapperStyle}"':
                      - 'rtgl-view#actionTransformCanvasFrame w=f bwl=xs bwr=xs bc=bo style="position: relative; overflow: hidden;"':
                          - 'rvn-scene-editor-preview-canvas#actionTransformCanvasHost style="display: block; width: 100%;" canvas-aspect-ratio="${canvasAspectRatio}"': null
              - $if !showRightPanel:
                  - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0;"':
                      - rvn-layout-edit-panel#transformInspector mode=transform :projectResolution=${projectResolution} :selectedElementMetrics=${selectedElementMetrics} :values=${inspectorValues}: null
                      - 'rtgl-view h=25vh style="flex-shrink: 0;"': null
          - $if showRightPanel:
              - rvn-resizable-panel panel-type=transform-editor w=300 min-w=240 max-w=500 resize-side=left:
                  - 'rtgl-view slot=content w=f h=f d=v style="min-width: 0; min-height: 0;"':
                      - 'rtgl-view h=48 w=f d=h av=c ph=md bwb=xs bc=bo style="flex: 0 0 auto;"':
                          - rtgl-text s=sm w=1fg ellipsis=true: ${targetName}
                      - 'rtgl-view w=f h=1fg sv pv=md style="min-height: 0;"':
                          - rvn-layout-edit-panel#transformInspector mode=transform :projectResolution=${projectResolution} :selectedElementMetrics=${selectedElementMetrics} :values=${inspectorValues}: null
                          - 'rtgl-view h=25vh style="flex-shrink: 0;"': null
