componentName: rvn-visual-layout-editor
propsSchema:
  type: object
  properties:
    sceneId:
      type: string
    sectionId:
      type: string
    lineId:
      type: string
    visualId:
      type: string
    sceneBackdrop:
      type: array
      description: The line's rendered scene, with a slot for the visual's layout. Shown around the layout.
events:
  close:
    type: object
    description: Done, once the layout is saved. `snapshotUrl` is a picture of the layout alone, framed as the whole screen, when it could be taken.
