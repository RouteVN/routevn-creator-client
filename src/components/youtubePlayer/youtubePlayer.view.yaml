refs:
  dialog:
    eventListeners:
      close:
        handler: handleClose
        stopPropagation: true
  closeButton:
    eventListeners:
      click:
        handler: handleClose
  openOnYouTubeButton:
    eventListeners:
      click:
        handler: handleOpenOnYouTubeClick
template:
  - $if isOpen:
      - rtgl-dialog#dialog open layout=fixed bare p=none:
          - 'div slot=content tabindex=-1 autofocus style="display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; box-sizing: border-box; padding-top: var(--rvn-mobile-overlay-top-inset, env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background-color: var(--background); outline: none;"':
              - 'rtgl-view d=h w=f h=56 av=c g=md bgc=bg style="flex-shrink: 0; box-sizing: border-box; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));"':
                  - 'rtgl-text w=1fg ellipsis=true style="min-width: 0;"': ${title}
                  - rtgl-button#openOnYouTubeButton v=ol: ${openOnYouTubeButton}
                  - 'rtgl-button#closeButton sq pre=x v=ol aria-label="${closeLabel}" style="min-height: 44px; min-width: 44px; align-items: center; justify-content: center;"': null
              - 'div style="display: flex; flex: 1; min-width: 0; min-height: 0; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background-color: #000;"':
                  - 'iframe src=${embedUrl} title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: block; flex: 1; width: 100%; height: 100%; border: 0;"': null
