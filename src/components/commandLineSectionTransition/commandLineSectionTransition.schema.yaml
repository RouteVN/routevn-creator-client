componentName: rvn-command-line-section-transition
propsSchema:
  type: object
  properties:
    sectionTransition:
      type: object
      properties:
        sceneId:
          type: string
        sectionId:
          type: string
        screen:
          type: object
          properties:
            animations:
              type: object
              properties:
                resourceId:
                  type: string
                playback:
                  type: object
                  properties:
                    continuity:
                      type: string
                      enum:
                        - render
                        - persistent
                    speed:
                      type: number
                      exclusiveMinimum: 0
    currentSceneId:
      type: string
