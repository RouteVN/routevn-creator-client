componentName: rvn-system-actions
propsSchema:
  type: object
  properties:
    actions:
      type: object
    selectedLineId:
      type: string
    selectedLine:
      type: object
    currentSceneId:
      type: string
    presentationState:
      type: object
    previousPresentationState:
      type: object
    hasPreviousPresentationStateContext:
      type: boolean
    backgroundTransformEditor:
      type: object
    actionType:
      type: string
      enum:
        - presentation
        - system
    dialogVariant:
      type: string
      enum:
        - default
        - scene-editor-left
        - scene-editor-mobile
    dialogPanelWidth:
      type: string
    dialogPanelTop:
      type: string
    dialogPanelBottom:
      type: string
    hiddenModes:
      type: array
      items:
        type: string
    allowedModes:
      type: array
      items:
        type: string
    showSelected:
      type: boolean
    showEmbeddedClose:
      type: boolean
    suppressDialogClose:
      type: boolean
events:
  actions-dialog-open:
    type: object
