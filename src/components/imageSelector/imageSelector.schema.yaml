componentName: rvn-image-selector
propsSchema:
  type: object
  properties:
    resourceTarget:
      type: string
      enum: [images, characters, characterSprites]
      default: images
      description: Browse project images, characters, or character sprites.
    characterId:
      type: string
      description: Restrict character sprites to this character.
    selectedImageId:
      type: string
    searchQuery:
      type: string
    columns:
      type: integer
      minimum: 1
    # With columns, makes columns the most per row: narrower grids show
    # fewer columns, each at least this many pixels wide.
    minColumnWidth:
      type: integer
      minimum: 1
