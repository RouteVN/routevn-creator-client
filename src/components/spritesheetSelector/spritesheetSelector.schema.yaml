componentName: rvn-spritesheet-selector
propsSchema:
  type: object
  properties:
    selectedSpritesheetValue:
      type: string
    searchQuery:
      type: string
    columns:
      type: integer
      minimum: 1
    # Without columns, cards fill each row, at least this many pixels wide
    # where the grid has room for two of them.
    minCardWidth:
      type: integer
      minimum: 1
