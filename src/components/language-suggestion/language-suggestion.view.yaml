refs:
  switchButton:
    eventListeners:
      click:
        handler: handleSwitchClick
  closeButton:
    eventListeners:
      click:
        handler: handleCloseClick
template:
  - $if visible:
      - 'rtgl-view w=f pt=md lang=${locale}':
          - 'rtgl-view w=f bw=xs bc=bo br=md p=lg g=md style="box-sizing: border-box;"':
              - rtgl-view d=h av=s g=sm w=f:
                  - 'rtgl-svg svg=translate wh=20 aria-hidden=true style="flex-shrink: 0;"': null
                  - 'rtgl-text s=sm w=1fg style="min-width: 0;"': ${message}
                  - 'rtgl-button#closeButton sq s=sm v=gh pre=x aria-label="${closeLabel}" title="${closeLabel}"': null
              - rtgl-button#switchButton v=ol ?disabled=${busy}: ${switchLabel}
