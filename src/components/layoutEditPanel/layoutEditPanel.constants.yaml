numberPopoverForm: &numberPopoverForm
  fields:
    - name: value
      type: input-number
  actions:
    buttons:
      - id: submit
        variant: pr
        label: Submit

opacityPopoverForm: &opacityPopoverForm
  fields:
    - name: value
      type: input-number
      min: 0
      max: 1
      step: 0.05
  actions:
    buttons:
      - id: submit
        variant: pr
        label: Submit

scalePopoverForm: &scalePopoverForm
  fields:
    - name: value
      type: input-number
      step: 0.01
  actions:
    buttons:
      - id: submit
        variant: pr
        label: Submit

textPopoverForm: &textPopoverForm
  fields:
    - name: value
      type: input-text
  actions:
    buttons:
      - id: submit
        variant: pr
        label: Submit

transformSections:
  - label: Transform
    items:
      - type: group
        fields:
          - type: clickable-value
            svg: x
            name: x
            value: "${values.x}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            svg: y
            name: y
            value: "${values.y}"
            popoverForm: *numberPopoverForm
      - type: group
        stacked: true
        fields:
          - type: clickable-value
            label: Scale X
            name: scaleX
            value: "${values.scaleX}"
            popoverForm: *scalePopoverForm
          - type: clickable-value
            label: Scale Y
            name: scaleY
            value: "${values.scaleY}"
            popoverForm: *scalePopoverForm
      - type: group
        stacked: true
        fields:
          - type: anchor-grid
            label: Anchor
            name: anchor
            value: "${values.anchor}"
            options:
              - label: Top Left
                value:
                  x: 0
                  y: 0
              - label: Top Center
                value:
                  x: 0.5
                  y: 0
              - label: Top Right
                value:
                  x: 1
                  y: 0
              - label: Center Left
                value:
                  x: 0
                  y: 0.5
              - label: Center
                value:
                  x: 0.5
                  y: 0.5
              - label: Center Right
                value:
                  x: 1
                  y: 0.5
              - label: Bottom Left
                value:
                  x: 0
                  y: 1
              - label: Bottom Center
                value:
                  x: 0.5
                  y: 1
              - label: Bottom Right
                value:
                  x: 1
                  y: 1
          - type: clickable-value
            label: Rotation
            name: rotation
            value: "${values.rotation}"
            metaValue: °
            popoverForm: *numberPopoverForm

layoutSections:
  - label: Transform
    items:
      - "$when": "!isInsideDirectedContainer"
        type: group
        fields:
          - type: clickable-value
            svg: x
            name: x
            value: "${values.x}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            svg: y
            name: y
            value: "${values.y}"
            popoverForm: *numberPopoverForm
      - "$when": "groupSizeModes"
        type: segmented-control-group
        fields:
          - type: segmented-control
            label: Width
            name: widthMode
            value: "${widthMode}"
            options:
              - label: Auto
                value: auto
              - label: Fixed
                value: fixed
          - type: segmented-control
            label: Height
            name: heightMode
            value: "${heightMode}"
            options:
              - label: Auto
                value: auto
              - label: Fixed
                value: fixed
      - "$when": "showLayoutSizeSection && supportsWidthMode && !groupSizeModes"
        type: segmented-control
        stacked: "${stackWidthMode}"
        label: Width
        name: widthMode
        value: "${widthMode}"
        options:
          - label: Auto
            value: auto
          - label: Fixed
            value: fixed
      - "$when": "showLayoutSizeSection && supportsHeightMode && !groupSizeModes"
        type: segmented-control
        label: Height
        name: heightMode
        value: "${heightMode}"
        options:
          - label: Auto
            value: auto
          - label: Fixed
            value: fixed
      - "$when": "showLayoutSizeSection && (showWidthField || showHeightField)"
        type: group
        fields:
          - "$when": "showWidthField"
            type: clickable-value
            svg: w
            name: width
            value: "${values.width}"
            popoverForm: *numberPopoverForm
          - "$when": "showHeightField"
            type: clickable-value
            svg: h
            name: height
            value: "${values.height}"
            popoverForm: *numberPopoverForm
      - "$when": "showLayoutSizeSection && showAspectRatioMode"
        type: segmented-control
        stacked: true
        label: Ratio
        name: aspectRatioMode
        value: "${values.aspectRatioMode}"
        options:
          - label: Free
            value: free
          - label: Fixed
            value: fixed
      - type: group
        stacked: true
        fields:
          - "$when": "supportsAnchor"
            type: anchor-grid
            label: Anchor
            name: anchor
            value: "${values.anchor}"
            options:
              - label: Top Left
                value:
                  x: 0
                  y: 0
              - label: Top Center
                value:
                  x: 0.5
                  y: 0
              - label: Top Right
                value:
                  x: 1
                  y: 0
              - label: Center Left
                value:
                  x: 0
                  y: 0.5
              - label: Center
                value:
                  x: 0.5
                  y: 0.5
              - label: Center Right
                value:
                  x: 1
                  y: 0.5
              - label: Bottom Left
                value:
                  x: 0
                  y: 1
              - label: Bottom Center
                value:
                  x: 0.5
                  y: 1
              - label: Bottom Right
                value:
                  x: 1
                  y: 1
          - type: clickable-value
            label: Rotation
            name: rotation
            value: "${values.rotation}"
            metaValue: °
            popoverForm: *numberPopoverForm
  - "$when": "supportsDirection || supportsScroll"
    label: Layout
    items:
      - "$when": "supportsDirection"
        type: segmented-control
        stacked: true
        label: Direction
        name: direction
        value: "${values.direction}"
        options:
          - label: Absolute
            svg: layout-direction-absolute
            ariaLabel: Absolute
            tooltip: Absolute
            value: absolute
          - label: Horizontal
            svg: layout-direction-horizontal
            ariaLabel: Horizontal
            tooltip: Horizontal
            value: horizontal
          - label: Vertical
            svg: layout-direction-vertical
            ariaLabel: Vertical
            tooltip: Vertical
            value: vertical
      - "$when": "showsGapField"
        type: group
        stacked: true
        fields:
          - type: clickable-value
            label: Gap X
            name: gapX
            value: "${values.gapX}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            label: Gap Y
            name: gapY
            value: "${values.gapY}"
            popoverForm: *numberPopoverForm
      - "$when": "supportsScroll"
        type: segmented-control
        stacked: true
        label: Scroll
        name: scroll
        value: "${values.scroll}"
        options:
          - label: Disabled
            value: false
          - label: Enabled
            value: true
  - label: Appearance
    items:
      - type: group
        stacked: true
        halfWidth: true
        fields:
          - type: clickable-value
            label: Opacity
            name: opacity
            value: "${values.opacity}"
            popoverForm: *opacityPopoverForm
  - "$when": 'itemType == "container-ref-choice-single-item"'
    label: Choice
    items:
      - type: select
        label: Choice
        name: choiceItemIndex
        value: "${values.choiceItemIndex}"
        options: "${choiceItemOptions}"
  - "$when": "supportsChildInteractionInheritance"
    id: childInteraction
    label: Child Interaction
    tooltip: Inherit child event from parent
    "$if canAddChildInteractionInheritance":
      labelAction: plus
    items:
      - "$when": "hasChildInteractionInheritance"
        type: child-interaction-list
        name: childInteraction
        items: "${childInteractionItems}"
  - "$when": "supportsSpritesheetAnimation"
    id: spritesheet
    label: Spritesheet
    items:
      - type: spritesheet-preview
        key: "${selectedSpritesheetPreviewKey}"
        fileId: "${selectedSpritesheetFileId}"
        atlas: "${selectedSpritesheetAtlas}"
        animation: "${selectedSpritesheetAnimation}"
      - type: select
        label: Animation
        name: spritesheetSelection
        value: "${spritesheetSelectionValue}"
        options: "${spritesheetSelectionItems}"
  - "$when": "supportsParticleSelection"
    id: particle
    label: Particle
    items:
      - type: select
        label: Effect
        name: particleId
        value: "${values.particleId}"
        options: "${particleSelectionItems}"
  - "$when": "supportsSpriteImages"
    id: images
    label: Image
    "$if canAddSpriteImageVariant":
      labelAction: plus
    items:
      - type: list-bar
        items:
          - "$when": "values.imageId"
            name: imageId
            label: Default
            imageId: "${values.imageId}"
          - "$when": "values.hoverImageId"
            name: hoverImageId
            label: Hover
            imageId: "${values.hoverImageId}"
          - "$when": "values.clickImageId"
            name: clickImageId
            label: Click
            imageId: "${values.clickImageId}"
  - "$when": "supportsSpriteBlur"
    id: blur
    label: Blur
    "$if canAddSpriteBlur":
      labelAction: plus
    items:
      - "$when": "values.blur"
        type: blur-summary
        name: blur
        value: "${blurSummary}"
  - "$when": "supportsSliderImages"
    id: slider-images
    label: Slider Bar
    items:
      - type: list-bar
        items:
          - name: barImageId
            label: Default
            imageId: "${values.barImageId}"
          - name: hoverBarImageId
            label: Hover
            imageId: "${values.hoverBarImageId}"
  - "$when": "supportsSliderImages"
    id: slider-thumb
    label: Slider Thumb
    items:
      - type: list-bar
        items:
          - name: thumbImageId
            label: Default
            imageId: "${values.thumbImageId}"
          - name: hoverThumbImageId
            label: Hover
            imageId: "${values.hoverThumbImageId}"
  - "$when": "supportsSliderValues"
    label: Slider Values
    items:
      - type: select
        label: Value
        name: sliderRuntimeValueId
        value: "${values.sliderRuntimeValueId}"
        options: "${sliderValueOptions}"
      - "$when": "!values.sliderRuntimeValueId"
        type: group
        fields:
          - type: clickable-value
            label: Initial
            name: sliderManualInitialValue
            value: "${values.sliderManualInitialValue}"
            popoverForm: *numberPopoverForm
      - type: group
        fields:
          - type: clickable-value
            label: Min
            name: min
            value: "${values.min}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            label: Max
            name: max
            value: "${values.max}"
            popoverForm: *numberPopoverForm
      - type: group
        fields:
          - type: clickable-value
            label: Step
            name: step
            value: "${values.step}"
            popoverForm: *numberPopoverForm
  - "$when": "supportsInputField"
    label: Input
    items:
      - type: group
        fields:
          - type: clickable-value
            label: Field
            name: field
            value: "${values.field}"
            popoverForm: *textPopoverForm
  - "$when": "supportsTextEditing"
    label: Text
    items:
      - type: text-content-summary
        name: content
        value: "${values.textContentSummary}"
  - "$when": "supportsDateFormat"
    label: Date
    items:
      - type: select
        label: Format
        name: dateFormat
        value: "${values.dateFormat}"
        options: "${dateFormatOptions}"
  - "$when": "supportsTextRevealEffect"
    id: textRevealing
    label: Revealing
    "$if canAddTextRevealSound":
      labelAction: plus
    items:
      - type: select
        label: Effect
        name: revealEffect
        value: "${values.revealEffect}"
        options: "${revealEffectOptions}"
      - type: list-bar
        items: "${values.textRevealSoundItems}"
      - "$when": "values.revealSoundId"
        type: segmented-control
        label: Stop
        name: revealSoundStopTiming
        value: "${values.revealSoundStopTiming}"
        options: "${revealSoundStopTimingOptions}"
  - "$when": "supportsTextRevealIndicator"
    id: textRevealIndicator
    label: Indicator
    "$if canAddTextRevealIndicator":
      labelAction: plus
    items:
      - type: list-bar
        items: "${values.textRevealIndicatorItems}"
  - "$when": "supportsTextStyles"
    id: textStyles
    label: Text Styles
    "$if canAddTextStyleVariant":
      labelAction: plus
    items:
      - type: select
        label: Default
        name: textStyleId
        value: "${values.textStyleId}"
        options: "${textStyleItems}"
      - "$when": "values.hoverTextStyleId"
        type: select
        label: Hover
        name: hoverTextStyleId
        value: "${values.hoverTextStyleId}"
        options: "${textStyleItemsWithNone}"
      - "$when": "values.clickTextStyleId"
        type: select
        label: Clicked
        name: clickTextStyleId
        value: "${values.clickTextStyleId}"
        options: "${textStyleItemsWithNone}"
  - "$when": "supportsSoundSelection"
    id: sounds
    label: Sound
    "$if canAddSoundVariant":
      labelAction: plus
    items:
      - type: list-bar
        items:
          - "$when": "values.hoverSoundId"
            name: hoverSoundId
            label: Hover
            soundId: "${values.hoverSoundId}"
          - "$when": "values.clickSoundId"
            name: clickSoundId
            label: Click
            soundId: "${values.clickSoundId}"
  - "$when": "supportsTextAlignment"
    label: Text Alignment
    items:
      - type: segmented-control
        stacked: true
        label: Alignment
        name: textStyle.align
        value: "${values.textStyle.align}"
        options:
          - label: Left
            svg: text-align-left
            ariaLabel: Left
            value: left
          - label: Center
            svg: text-align-center
            ariaLabel: Center
            value: center
          - label: Right
            svg: text-align-right
            ariaLabel: Right
            value: right
  - id: visibilityCondition
    label: Visibility
    labelAction: plus
    items:
      - "$when": "hasVisibilityCondition"
        type: condition-summary
        name: visibilityCondition
        value: "${visibilityConditionSummary}"
  - "$when": 'itemType == "fragment-ref"'
    label: Fragment
    items:
      - type: select
        label: Fragment
        name: fragmentLayoutId
        value: "${values.fragmentLayoutId}"
        options: "${fragmentLayoutOptions}"
  - "$when": 'itemType == "container-ref-save-load-slot"'
    label: Pagination
    items:
      - type: pagination-summary
        name: pagination
        value: "${paginationSummary}"
  - "$when": "supportsActions"
    id: actions
    label: Actions
    labelAction: plus
    items:
      - type: list-item
        items: "${values.actions}"
  - "$when": "supportsTextStyles || supportsSpriteImages"
    id: conditionalOverrides
    label: Conditional
    labelAction: plus
    items:
      - type: conditional-override-list
        items: "${conditionalOverrideItems}"

controlSections:
  - label: Transform
    items:
      - "$when": "!isInsideDirectedContainer"
        type: group
        fields:
          - type: clickable-value
            svg: x
            name: x
            value: "${values.x}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            svg: y
            name: y
            value: "${values.y}"
            popoverForm: *numberPopoverForm
      - "$when": 'itemType != "fragment-ref" && supportsWidthMode'
        type: segmented-control
        stacked: "${stackWidthMode}"
        label: Width
        name: widthMode
        value: "${widthMode}"
        options:
          - label: Auto
            value: auto
          - label: Fixed
            value: fixed
      - "$when": 'itemType != "fragment-ref"'
        type: group
        fields:
          - "$when": '!supportsWidthMode || widthMode == "fixed"'
            type: clickable-value
            svg: w
            name: width
            value: "${values.width}"
            popoverForm: *numberPopoverForm
          - type: clickable-value
            svg: h
            name: height
            value: "${values.height}"
            popoverForm: *numberPopoverForm
      - type: group
        stacked: true
        fields:
          - type: clickable-value
            label: Rotation
            name: rotation
            value: "${values.rotation}"
            metaValue: °
            popoverForm: *numberPopoverForm
  - label: Appearance
    items:
      - type: group
        stacked: true
        halfWidth: true
        fields:
          - type: clickable-value
            label: Opacity
            name: opacity
            value: "${values.opacity}"
            popoverForm: *opacityPopoverForm
  - id: visibilityCondition
    label: Visibility
    labelAction: plus
    items:
      - "$when": "hasVisibilityCondition"
        type: condition-summary
        name: visibilityCondition
        value: "${visibilityConditionSummary}"
  - "$when": "supportsActions"
    id: actions
    label: Actions
    labelAction: plus
    items:
      - type: list-item
        items: "${values.actions}"
