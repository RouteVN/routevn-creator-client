componentName: rvn-layout-edit-panel
propsSchema:
  type: object
  properties:
    values:
      type: object
    mode:
      type: string
      enum:
        - layout
        - transform
    imagesData:
      type: object
    soundsData:
      type: object
    spritesheetsData:
      type: object
    particlesData:
      type: object
    videosData:
      type: object
    charactersData:
      type: object
    textStylesData:
      type: object
    variablesData:
      type: object
    layoutsData:
      type: object
    itemType:
      type: string
    layoutType:
      type: string
    resourceType:
      type: string
    projectResolution:
      type: object
    selectedElementMetrics:
      type: object
    isInsideSaveLoadSlot:
      type: boolean
    allowAutoSlot:
      type: boolean
    isInsideDirectedContainer:
      type: boolean
methods:
  type: object
  properties:
    setSelectedElementMetrics:
      description: Stores the measured size of the selected element.
      params: []
      returns: void
    getSelectedElementMetrics:
      description: Returns the stored measured size of the selected element.
      params: []
      returns: object
    setTransientValues:
      description: Updates the panel fields with values changed on the canvas.
      params: []
      returns: void
