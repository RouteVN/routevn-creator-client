  lowSpace: หยุดสำรองข้อมูลชั่วคราวแล้ว เพิ่มพื้นที่ว่างในอุปกรณ์หรือพื้นที่จัดเก็บข้อมูลสำรอง ต้องมีพื้นที่ว่างเหลืออย่างน้อย 1 GB หลังการสำรองข้อมูล
  unknownSpace: ไม่สามารถตรวจสอบพื้นที่ว่างได้ เลือกโฟลเดอร์สำรองข้อมูลอื่นในเครื่อง
  reconnect: ไม่สามารถเข้าถึงโฟลเดอร์สำรองข้อมูลได้ เชื่อมต่อพื้นที่จัดเก็บใหม่หรือเลือกโฟลเดอร์อีกครั้ง
  localFolder: เลือกโฟลเดอร์ในอุปกรณ์นี้หรือในไดรฟ์แบบถอดได้ ไม่รองรับโฟลเดอร์บนคลาวด์
  nameConflict: มีโฟลเดอร์หรือไฟล์สำรองข้อมูลชื่อนี้อยู่แล้ว เลือกโฟลเดอร์สำรองข้อมูลอื่นเพื่อให้ข้อมูลสำรองที่มีอยู่ปลอดภัย
  invalidBackup: ไม่สามารถตรวจสอบฐานข้อมูลสำรองที่มีอยู่ได้ ระบบยังคงเก็บฐานข้อมูลนี้ไว้ เลือกโฟลเดอร์สำรองข้อมูลอื่น
  verification: ไม่สามารถตรวจสอบสำเนาข้อมูลสำรองได้ ลองอีกครั้งหรือเลือกโฟลเดอร์อื่นในเครื่อง
  busy: กำลังบันทึกหรือส่งออกโปรเจกต์ ระบบจะลองสำรองข้อมูลอีกครั้งในการตรวจสอบตามกำหนดครั้งถัดไป
  interrupted: การสำรองข้อมูลถูกขัดจังหวะ ระบบจะลองอีกครั้งในการตรวจสอบตามกำหนดครั้งถัดไป
  assetConflict: ID ไฟล์นี้ถูกใช้งานอยู่แล้ว ระบบเก็บไฟล์ที่มีอยู่ไว้
