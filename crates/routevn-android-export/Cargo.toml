[package]
name = "routevn-android-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Builds and signs Android APKs from the prebuilt RouteVN player template"

[lib]
name = "routevn_android_export"
path = "src/lib.rs"

[[bin]]
name = "routevn-android-template"
path = "src/bin/routevn-android-template.rs"

[dependencies]
base64 = "0.22"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
miniz_oxide = "0.8"
p12-keystore = "0.2.1"
rand = "0.8"
routevn-exporter = { path = "../routevn-exporter" }
routevn-packager = { path = "../routevn-packager" }
rsa = { version = "0.9.8", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
tempfile = "3.23.0"
x509-cert = { version = "0.2.5", features = ["builder"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
