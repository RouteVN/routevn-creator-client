[package]
name = "routevn-creator"
version = "1.17.2"
description = "RouteVN Creator. Follow us on social media to stay updated."
authors = ["Yuusoft"]
license = "MIT"
repository = "https://github.com/RouteVN/routevn-creator-client"
homepage = "https://routevn.com"
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }
cc = "1.2"
dotenvy = "=0.15.7"
sentry-types = "=0.49.3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "=2.7.1"
tauri-plugin-sql = { git = "https://github.com/han4wluc/plugins-workspace.git", rev = "2980f9b8694fd5ff15ef46cb3e79670178ba6cc1", features = ["sqlite", "fs-scope-validation"] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-dialog = "=2.4.2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-persisted-scope = { version = "=2.3.4", features = ["protocol-asset"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"
urlencoding = "2.1"
routevn-exporter = { path = "../crates/routevn-exporter" }
routevn-packager = { path = "../crates/routevn-packager" }
tempfile = "3"
plist = "=1.8.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
discord-rich-presence = "=1.1.0"
# Use rustls with ring, matching tauri-plugin-updater, so the shared reqwest
# build does not switch the updater to native TLS or link OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sentry = { version = "=0.49.3", default-features = false, features = ["panic", "backtrace", "debug-images", "reqwest", "rustls-no-provider"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# When the release pipeline turns on line tables (CARGO_PROFILE_RELEASE_DEBUG),
# only RouteVN's crates keep them. Third-party dependencies keep function names
# from the symbol table, which keeps each symbol cache within the collector's
# limit. See docs/desktop-error-reporting.md.
[profile.release]
# Debug info in any package stops Cargo's implicit stripping, which removes the
# debug map naming the build machine's object files, so strip explicitly.
# rustc ignores this on Windows, where the PDB is always written.
strip = "debuginfo"

[profile.release.package."*"]
debug = false

[profile.release.package.routevn-exporter]
debug = "line-tables-only"

[profile.release.package.routevn-packager]
debug = "line-tables-only"
