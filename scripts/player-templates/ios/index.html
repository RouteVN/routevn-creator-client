<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>RouteVN Player</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      /* The game stays inside the safe area, clear of the camera housing and
         the home indicator; the black margins fill the rest. */
      body {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #canvas {
        --project-screen-width: 16;
        --project-screen-height: 9;
        width: min(
          100%,
          calc(
            (
                var(--rvn-app-viewport-height, 100vh) -
                  env(safe-area-inset-top) - env(safe-area-inset-bottom)
              ) *
              var(--project-screen-width) / var(--project-screen-height)
          )
        );
        aspect-ratio: var(--project-screen-width) / var(--project-screen-height);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #canvas canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: #f2f2f2;
        background: #101010;
        font:
          400 20px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        z-index: 10;
        user-select: none;
        transition:
          opacity 200ms ease,
          visibility 0s 200ms;
      }

      .loading-progress {
        width: min(220px, 66vw);
        animation: loading-appear 160ms ease-out;
      }

      @keyframes loading-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .loading-labels {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
      }

      #loading-percentage {
        color: #d0d0d0;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      #loading-progress {
        appearance: none;
        display: block;
        width: 100%;
        height: 2px;
        border: 0;
        background: #333;
        color: #eee;
      }

      #loading-progress::-webkit-progress-bar {
        background: #333;
      }

      #loading-progress::-webkit-progress-value {
        background: #eee;
        transition: width 150ms ease-out;
      }

      #loading-progress::-moz-progress-bar {
        background: #eee;
        transition: width 150ms ease-out;
      }

      #loading.error {
        cursor: default;
        text-align: left;
        user-select: text;
      }

      #loading.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #loading,
        .loading-progress {
          animation: none;
          transition: none;
        }

        #loading-progress::-webkit-progress-value {
          transition: none;
        }

        #loading-progress::-moz-progress-bar {
          transition: none;
        }
      }

      #loading .loading-error {
        width: min(760px, calc(100vw - 32px));
      }

      #loading .loading-error-title {
        margin: 0 0 8px;
        font: 700 24px/1.2 sans-serif;
      }

      #loading .loading-error-summary {
        margin: 0 0 16px;
        color: #f1f5f9;
        font: 500 15px/1.45 sans-serif;
      }

      #loading .loading-error-details {
        box-sizing: border-box;
        width: 100%;
        max-height: min(58vh, 520px);
        margin: 0;
        overflow: auto;
        padding: 12px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f172a;
        color: #e2e8f0;
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-player-start="automatic">
    <div id="loading">
      <div class="loading-progress">
        <div class="loading-labels">
          <span id="loading-label">Loading…</span>
          <span id="loading-percentage" aria-hidden="true">0%</span>
        </div>
        <progress
          id="loading-progress"
          max="100"
          value="0"
          aria-labelledby="loading-label"
        ></progress>
      </div>
    </div>
    <div id="canvas"></div>
    <script src="./player-runtime-persistence-host.js"></script>
    <script src="./main.js" type="module"></script>
  </body>
</html>
