---
title: Project Templates
description: Opens the Create Project form with the bundled template chosen.
url: /projects
viewport:
  - id: laptop
    width: 1024
    height: 768
  - id: mobile
    width: 390
    height: 844
steps:
  - action: waitFor
    selector: "[data-testid='create-project-button']"
    state: visible
    timeoutMs: 5000
  - action: select
    testId: create-project-button
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-form#createProjectForm rtgl-button#changeTemplateButton"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 300
  # The form with the bundled template; at 1024 x 768 its fields scroll above
  # Submit.
  - action: screenshot
