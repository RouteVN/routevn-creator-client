---
title: Mobile Camera Keyframe Settings
description: Touch animation controls use a compact Loop/Zoom menu; Camera editing retains timing, easing, nested pose adjustment, cancellation, and persisted values.
url: /projects?vt-input-mode=touch
skipInitialScreenshot: true
viewport:
  id: mobile
  width: 390
  height: 844
steps:
  - action: waitFor
    selector: "#mobileCreateMenuButton"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#mobileCreateMenuButton"
    steps:
      - action: click
  - action: select
    selector: "#mobileActionMenu [role='menuitem']:has-text('Create Project')"
    steps:
      - action: click
  - action: select
    selector: "#createProjectForm #field0 input"
    steps:
      - action: clear
      - action: write
        value: Project One
  - action: select
    selector: "#createProjectForm [data-action-id=submit]"
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: select
    selector: "#mobileTabItem0"
    steps:
      - action: click
  - action: select
    selector: "rvn-mobile-sidebar [data-item-id=animations]"
    steps:
      - action: click
  - action: waitFor
    selector: "#groupview #itemRef0x0"
    state: visible
    timeoutMs: 20000
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: click
  - action: select
    selector: "#mobileDetailOpenButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#mobileEditorMenuButton"
    state: visible
    timeoutMs: 5000
  - action: assert
    type: hidden
    selector: "#animationEditorToolbar #timelineZoomSlider"
  - action: assert
    type: hidden
    selector: "#previewLoopButton"
  - action: select
    selector: "#mobileEditorMenuButton"
    steps:
      - action: click
  - action: assert
    type: text
    selector: "#mobileEditorMenu #optionD0I0"
    value: Loop
  - action: select
    selector: "#mobileEditorMenu #optionD0I0"
    steps:
      - action: click
  - action: select
    selector: "#mobileEditorMenuButton"
    steps:
      - action: click
  - action: assert
    type: text
    selector: "#mobileEditorMenu #optionD0I0"
    value: "Don't Loop"
  - action: select
    selector: "#mobileEditorMenu #optionD0I0"
    steps:
      - action: click
  - action: select
    selector: "#mobileEditorMenuButton"
    steps:
      - action: click
  - action: select
    selector: "#mobileEditorMenu #optionD0I1"
    steps:
      - action: click
  - action: waitFor
    selector: "#timelineZoomPopover[open]"
    state: visible
    timeoutMs: 5000
  - action: assert
    type: hidden
    selector: "#mobileEditorMenu[open]"
  - action: select
    selector: "#timelineZoomPopover #timelineZoomIn"
    steps:
      - action: click
  - action: select
    selector: "#timelineZoomPopover #timelineZoomOut"
    steps:
      - action: click
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "#timelineZoomPopover"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#addPropertiesButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#addPropertySideMenu #optionD0I0"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#addPropertySideMenu #optionD0I0"
    steps:
      - action: click
  - action: assert
    type: text
    selector: "#addPropertySideMenu #optionD1I0"
    value: Camera
  - action: select
    selector: "#addPropertySideMenu #optionD1I0"
    steps:
      - action: click
  - action: select
    selector: "#previousTimeline [data-keyframe=true][data-property=camera][data-index='0']"
    steps:
      - action: click
  - action: waitFor
    selector: "#editKeyframeForm #field0 input"
    state: visible
    timeoutMs: 5000
  - action: assert
    type: hidden
    selector: "#selectedKeyframeDetails"
  - action: select
    selector: "#editKeyframeForm #field0 input"
    steps:
      - action: clear
      - action: write
        value: "250"
  - action: select
    selector: "#editKeyframeForm #field1 input"
    steps:
      - action: clear
      - action: write
        value: "1750"
  - action: select
    selector: "#editKeyframeForm #field3 [data-testid=select-button]"
    steps:
      - action: click
  - action: select
    selector: "#editKeyframeForm #field3 #option2"
    steps:
      - action: click
  - action: screenshot
  - action: select
    selector: "#adjustCameraKeyframeDialog"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-camera-viewport
    state: visible
    timeoutMs: 5000
  # Cancelling the pose editor must leave the timing form open and unchanged.
  - action: keypress
    key: Escape
  - action: waitFor
    selector: rvn-camera-viewport
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#adjustCameraKeyframeDialog"
    steps:
      - action: click
  - action: select
    selector: "rvn-animation-camera-editor #zoomIn"
    steps:
      - action: click
  - action: select
    selector: "rvn-animation-camera-editor #done"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-camera-viewport
    state: hidden
    timeoutMs: 5000
  - action: assert
    type: js
    fn: eval
    args:
      - |
        (() => {
          const find = (root) => {
            const form = root.querySelector('#editKeyframeForm');
            if (form) return form;
            for (const node of root.querySelectorAll('*')) {
              const found = node.shadowRoot && find(node.shadowRoot);
              if (found) return found;
            }
          };
          const form = find(document).shadowRoot;
          const read = index => form.querySelector('#field' + index).shadowRoot.querySelector('input').value;
          return read(0) === '250' && read(1) === '1750';
        })()
    value: true
  - action: assert
    type: text
    selector: "#editKeyframeForm #field3 [data-testid=select-button]"
    value: Ease Out Quad
  - action: screenshot
  - action: select
    selector: "#editKeyframeForm [data-action-id=submit]"
    steps:
      - action: click
  - action: waitFor
    selector: "#editKeyframeForm"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#backButton"
    steps:
      - action: click
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: click
  - action: select
    selector: "#mobileDetailOpenButton"
    steps:
      - action: click
  - action: select
    selector: "#previousTimeline [data-keyframe=true][data-property=camera][data-index='0']"
    steps:
      - action: click
  - action: waitFor
    selector: "#editKeyframeForm #field0 input"
    state: visible
    timeoutMs: 5000
  - action: assert
    type: js
    fn: eval
    args:
      - |
        (() => {
          const find = (root) => {
            const editor = root.querySelector('rvn-animation-editor');
            if (editor) return editor;
            for (const node of root.querySelectorAll('*')) {
              const found = node.shadowRoot && find(node.shadowRoot);
              if (found) return found;
            }
          };
          const editor = find(document);
          const values = editor.deps.store.selectSelectedKeyframeFormValues();
          const tracks = editor.deps.store.selectProperties({ side: 'prev' });
          return values.delay === 250 && values.duration === 1750 && values.easing === 'easeOutQuad'
            && tracks.scaleX.keyframes[0].value === 1.01 && tracks.scaleY.keyframes[0].value === 1.01;
        })()
    value: true
  - action: screenshot
  - action: keypress
    key: Escape
