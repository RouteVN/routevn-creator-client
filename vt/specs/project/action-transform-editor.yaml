    state: attached
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-background#commandLineBackground rtgl-segmented-control[data-field-name='customTransform'] #option1"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-background#commandLineBackground #customTransformButton"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-background#commandLineBackground #customTransformButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-action-transform-editor#actionTransformEditor"
    state: attached
    timeoutMs: 10000
  - action: waitFor
    selector: "rvn-action-transform-editor#actionTransformEditor #actionTransformCanvasHost canvas"
    state: visible
    timeoutMs: 10000
  - action: assert
    type: visible
    selector: "rvn-action-transform-editor#actionTransformEditor rvn-layout-edit-panel#transformInspector #groupItem0x0x0"
  - action: assert
    type: js
    fn: eval
    args:
      - |
        (() => {
          const deepQuery = (root, selector) => {
            const direct = root?.querySelector?.(selector);
            if (direct) return direct;
            for (const node of root?.querySelectorAll?.('*') ?? []) {
              const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined;
              if (found) return found;
            }
          };
          const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor');
          const background = getComputedStyle(deepQuery(editor.shadowRoot, '#actionTransformCanvasBackground'));
          const frame = getComputedStyle(deepQuery(editor.shadowRoot, '#actionTransformCanvasFrame'));
          return String(background.backgroundImage.includes('radial-gradient') &&
            background.backgroundSize === '24px 24px' &&
            frame.borderLeftWidth === '1px' && frame.borderRightWidth === '1px');
        })()
    value: "true"
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const sceneEditor = deepQuery(document, 'rvn-scene-editor-lexical'); const metrics = sceneEditor?.store?.selectBackgroundTransformEditor?.()?.selectedElementMetrics; return `${metrics?.width}x${metrics?.height}`; })()"
    value: "1920x1080"
  - action: select
    selector: "rvn-action-transform-editor#actionTransformEditor rvn-layout-anchor-grid[data-name='anchor'] #anchorCell2"
    steps:
      - action: click
  - action: wait
    ms: 100
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const sceneEditor = deepQuery(document, 'rvn-scene-editor-lexical'); const transform = sceneEditor?.store?.selectBackgroundTransformEditor?.()?.transform; return `${transform?.anchorX},${transform?.anchorY}:${transform?.originX},${transform?.originY}`; })()"
    value: "1,0:1920,0"
  - action: select
    selector: "rvn-action-transform-editor#actionTransformEditor rvn-layout-anchor-grid[data-name='anchor'] #anchorCell4"
    steps:
      - action: click
  - action: wait
    ms: 100
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const sceneEditor = deepQuery(document, 'rvn-scene-editor-lexical'); const transform = sceneEditor?.store?.selectBackgroundTransformEditor?.()?.transform; return `${transform?.anchorX},${transform?.anchorY}:${transform?.originX},${transform?.originY}`; })()"
    value: "0.5,0.5:960,540"
  - action: waitFor
    selector: "rvn-action-transform-editor#actionTransformEditor #actionTransformCanvasHost canvas"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-action-transform-editor#actionTransformEditor #actionTransformCanvasHost canvas"
    steps:
      - action: hover
  - action: wait
    ms: 100
  - action: screenshot
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor'); const sceneEditor = deepQuery(document, 'rvn-scene-editor-lexical'); const xField = deepQuery(editor?.shadowRoot, '#groupItem0x0x0'); const yField = deepQuery(editor?.shadowRoot, '#groupItem0x0x1'); const hits = sceneEditor?.deps?.graphicsService?.hitTestElementBounds?.({ x: 960, y: 540 }) ?? []; const background = hits.flatMap((hit) => hit.path ?? []).find((entry) => entry.id === 'bg-cg-background-container'); window.__vtActionTransformX = Number(xField?.textContent?.trim()); window.__vtActionTransformY = Number(yField?.textContent?.trim()); window.__vtActionTransformBoundsX = Number(background?.bounds?.x); return Number.isFinite(window.__vtActionTransformX) && Number.isFinite(window.__vtActionTransformY) && Number.isFinite(window.__vtActionTransformBoundsX) ? 'ready' : 'missing'; })()"
    value: "ready"
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor'); const canvas = editor?.getCanvasRoot?.()?.querySelector?.('canvas'); const bounds = canvas?.getBoundingClientRect?.(); if (!bounds?.width) return 'missing'; const pointerId = 17; const startX = bounds.left + bounds.width * 0.35; const startY = bounds.top + bounds.height * 0.35; const endX = startX + bounds.width / 10; window.__vtActionTransformPointer = { pointerId, x: endX, y: startY }; const pointer = { bubbles: true, composed: true, pointerId, pointerType: 'mouse', isPrimary: true, button: 0 }; canvas.dispatchEvent(new PointerEvent('pointerdown', { ...pointer, buttons: 1, clientX: startX, clientY: startY })); canvas.dispatchEvent(new PointerEvent('pointermove', { ...pointer, buttons: 1, clientX: startX, clientY: startY })); canvas.dispatchEvent(new PointerEvent('pointermove', { ...pointer, buttons: 1, clientX: endX, clientY: startY })); return 'dispatched'; })()"
    value: "dispatched"
  - action: wait
    ms: 250
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const sceneEditor = deepQuery(document, 'rvn-scene-editor-lexical'); const hits = sceneEditor?.deps?.graphicsService?.hitTestElementBounds?.({ x: 960, y: 540 }) ?? []; const background = hits.flatMap((hit) => hit.path ?? []).find((entry) => entry.id === 'bg-cg-background-container'); const boundsX = Number(background?.bounds?.x); return String(Math.abs(boundsX - window.__vtActionTransformBoundsX - 192) < 0.01); })()"
    value: "true"
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor'); const canvas = editor?.getCanvasRoot?.()?.querySelector?.('canvas'); const pointer = window.__vtActionTransformPointer; if (!canvas || !pointer) return 'missing'; canvas.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, composed: true, pointerId: pointer.pointerId, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 0, clientX: pointer.x, clientY: pointer.y })); return 'released'; })()"
    value: "released"
  - action: wait
    ms: 250
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor'); const xField = deepQuery(editor?.shadowRoot, '#groupItem0x0x0'); const nextX = Number(xField?.textContent?.trim()); const moved = Math.abs(nextX - window.__vtActionTransformX - 192) < 0.01; window.__vtActionTransformX = nextX; return String(moved); })()"
    value: "true"
  - action: screenshot
  - action: select
    selector: "rvn-action-transform-editor#actionTransformEditor rvn-layout-anchor-grid[data-name='anchor'] #anchorCell4"
    steps:
      - action: blur
  - action: keypress
    key: ArrowDown
  - action: wait
    ms: 250
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor'); const yField = deepQuery(editor?.shadowRoot, '#groupItem0x0x1'); return String(Number(yField?.textContent?.trim()) === window.__vtActionTransformY + 1); })()"
    value: "true"
  - action: assert
    type: js
    fn: eval
    args:
      - |
        (async () => {
          const deepQuery = (root, selector) => {
            const direct = root?.querySelector?.(selector);
            if (direct) return direct;
            for (const node of root?.querySelectorAll?.('*') ?? []) {
              const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined;
              if (found) return found;
            }
          };
          const waitUntil = async (condition) => {
            const deadline = Date.now() + 5000;
            while (!condition()) {
              if (Date.now() >= deadline) throw new Error('Scale display did not update');
              await new Promise((resolve) => setTimeout(resolve, 50));
            }
          };
          const editor = deepQuery(document, 'rvn-action-transform-editor#actionTransformEditor');
          const inspector = () => deepQuery(editor.shadowRoot, '#transformInspector');
          const original = editor.props.transform;
          const update = (formValues) => editor.transformedHandlers.handleInspectorUpdate({
            _event: { detail: { formValues } },
          });
          try {
            update({ ...original, scaleX: 1.23456789, scaleY: 0.98765432 });
            for (const [name, expected] of [['scaleX', '1.23'], ['scaleY', '0.99']]) {
              const field = () => deepQuery(inspector().shadowRoot, `[data-name='${name}']`);
              await waitUntil(() => field()?.textContent.trim() === expected);
              field().click();
              await waitUntil(() => {
                const form = deepQuery(inspector().shadowRoot, '#popoverForm');
                return deepQuery(form, 'input')?.value === expected;
              });
              inspector().transformedHandlers.handlePopverFormClose({});
            }
            return String(editor.props.transform.scaleX === 1.23456789 && editor.props.transform.scaleY === 0.98765432);
          } finally {
            inspector().transformedHandlers.handlePopverFormClose({});
            update(original);
          }
        })()
    value: "true"
  - action: select
    selector: "rvn-action-transform-editor#actionTransformEditor #doneButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-background#commandLineBackground #customTransformButton"
    state: visible
    timeoutMs: 10000
  - action: keypress
    key: Escape
  - action: wait
    ms: 300
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "rvn-system-actions-dialog-surface rtgl-dialog[open]"
    state: hidden
    timeoutMs: 10000
