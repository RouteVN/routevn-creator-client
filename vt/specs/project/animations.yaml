        (() => {
          const find = (root) => {
            const editor = root.querySelector('rvn-animation-editor');
            if (editor) return editor;
            for (const node of root.querySelectorAll('*')) {
              const found = node.shadowRoot && find(node.shadowRoot);
              if (found) return found;
            }
          };
          const editor = find(document);
          const tween = editor.store.selectProperties({ side: 'prev' });
          return Math.abs(tween.scaleX.keyframes[0].startValue - 1) < 0.0001
            && Math.abs(tween.scaleY.keyframes[0].startValue - 1) < 0.0001
            && Math.abs(tween.scaleX.initialValue - 1 / 1.1) < 0.0001
            && Math.abs(tween.scaleX.keyframes[0].value - 1.1) < 0.0001
            && editor.store.selectPreviewPlayheadTimeMs() === 0;
        })()
    value: true
