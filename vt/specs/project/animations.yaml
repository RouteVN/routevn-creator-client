          const canvas = find(document);
          canvas.dataset.cameraPreview = 'mounted';
          const background = canvas.closest('#animationEditorCanvasBackground');
          const cameraValue = canvas.getRootNode().querySelector('#adjustCameraKeyframe');
          return getComputedStyle(background).backgroundImage.includes('radial-gradient')
            && getComputedStyle(background).backgroundSize === '24px 24px'
            && background.getAttribute('bgc') === 'bg'
            && cameraValue.matches('button[data-camera-value][aria-haspopup="dialog"]')
            && getComputedStyle(cameraValue).textAlign === 'start';
        })()
