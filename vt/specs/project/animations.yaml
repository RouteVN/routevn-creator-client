---
title: Animations Workflow
description: Covers the animations page detail, edit dialog, empty search state, and animation editor route.
url: /projects
skipInitialScreenshot: true
viewport:
  id: wide
  width: 1440
  height: 900
steps:
  - action: waitFor
    selector: "[data-testid='create-project-button']"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: select
    testId: create-project-button
    steps:
      - action: click
  - action: waitFor
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    state: attached
    timeoutMs: 5000
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    steps:
      - action: clear
      - action: write
        value: VT Animations Workflow
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field1 input
    steps:
      - action: clear
      - action: write
        value: Covers the animations page.
  - action: wait
    ms: 250
  - action: select
    selector: "#createProjectSubmitButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: wait
    ms: 500
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: wait
    ms: 500
  - action: select
    selector: "#sidebar [data-item-id='animatedAssets']"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-animations
    state: attached
    timeoutMs: 10000
  - action: assert
    type: url
    value: /project/animations
  - action: wait
    ms: 450
  - action: screenshot
  - action: waitFor
    selector: "#groupview #itemRef0x0"
    state: visible
    timeoutMs: 20000
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: click
  - action: waitFor
    selector: "#detailHeader"
    state: attached
    timeoutMs: 5000
  - action: waitFor
    selector: '#detailCanvas[style*="opacity: 1"] canvas'
    state: attached
    timeoutMs: 20000
  # The preview loops continuously; hide only its canvas so surrounding UI remains testable.
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { if (!root) return undefined; const direct = root.querySelector?.(selector); if (direct) return direct; for (const node of root.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const canvas = deepQuery(document, '#detailCanvas canvas'); canvas.style.visibility = 'hidden'; return getComputedStyle(canvas).visibility; })()"
    value: hidden
  - action: wait
    ms: 300
  - action: screenshot
  - action: select
    selector: "#detailHeader"
    steps:
      - action: click
  - action: waitFor
    selector: "#editDialog[open]"
    state: attached
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: screenshot
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "#editDialog"
    state: hidden
    timeoutMs: 10000
  - action: select
    selector: "#tagFilterButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#tagFilterPopover[open]"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "#tagFilterPopover rtgl-input#searchInput"
    steps:
      - action: clear
      - action: write
        value: zzzz vt animation
  - action: wait
    ms: 350
  - action: screenshot
  - action: select
    selector: "#tagFilterPopover rtgl-input#searchInput"
    steps:
      - action: clear
  - action: wait
    ms: 250
  - action: select
    selector: "#tagFilterApply"
    steps:
      - action: click
  - action: waitFor
    selector: "#tagFilterPopover"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: dblclick
  - action: waitFor
    selector: rvn-animation-editor
    state: attached
    timeoutMs: 20000
  - action: assert
    type: url
    value: /project/animation-editor
  - action: wait
    ms: 1200
  - action: screenshot
  - action: waitFor
    selector: "#animationEditorTab0"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#addPropertiesButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-dropdown-menu#addPropertySideMenu #option2"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "rtgl-dropdown-menu#addPropertySideMenu #option2"
    steps:
      - action: click
  - action: waitFor
    selector: "#maskDialog[open]"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#singleMaskImageButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#imageSelectorDialog[open]"
    state: visible
    timeoutMs: 5000
  - action: waitFor
    selector: "#imageItemRef0x0"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "#imageItemRef0x0"
    steps:
      - action: click
  - action: select
    selector: "#confirmMaskImageSelection"
    steps:
      - action: click
  - action: waitFor
    selector: "#imageSelectorDialog"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#addMaskButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#maskTimelineRow"
    state: visible
    timeoutMs: 5000
  - action: waitFor
    selector: "#maskTimelineCategory"
    state: visible
    timeoutMs: 5000
  - action: waitFor
    selector: "#maskTimelineRow rvn-file-image"
    state: visible
    timeoutMs: 5000
  - action: waitFor
    selector: "#selectedMaskDetails"
    state: attached
    timeoutMs: 5000
  - action: screenshot
  - action: select
    selector: "#selectedMaskSoftness"
    steps:
      - action: click
  - action: waitFor
    selector: "#selectedMaskNumberPopover[open]"
    state: attached
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: screenshot
  - action: select
    selector: "#selectedMaskNumberConfirm"
    steps:
      - action: click
  - action: waitFor
    selector: "#selectedMaskNumberPopover"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#animationEditorTab0"
    steps:
      - action: focus
  - action: keypress
    key: ArrowRight
  - action: waitFor
    selector: "#animationPreviewPanel"
    state: visible
    timeoutMs: 5000
  - action: screenshot
  - action: select
    selector: "#animationEditorTab1"
    steps:
      - action: focus
  - action: keypress
    key: ArrowLeft
  - action: waitFor
    selector: "#animationTweenPanel"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "[data-keyframe='true']"
    steps:
      - action: click
  - action: waitFor
    selector: "#selectedKeyframeDetails"
    state: attached
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; return deepQuery(document, \"[data-keyframe='true']\")?.getAttribute('data-selected'); })()"
    value: "true"
  - action: screenshot
  - action: select
    selector: "#editSelectedKeyframeButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#editKeyframeDialog[open]"
    state: attached
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: screenshot
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "#editKeyframeDialog"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#maskTimelineRow #propertyName0[role='button']"
    steps:
      - action: focus
  - action: keypress
    key: Enter
  - action: waitFor
    selector: "#selectedMaskDetails"
    state: attached
    timeoutMs: 5000
---
