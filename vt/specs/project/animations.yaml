  - action: waitFor
    selector: "#canvas canvas[data-camera-preview=mounted]"
    state: visible
    timeoutMs: 5000
  - action: assert
    type: js
    fn: eval
    args:
      - |
        (async () => {
          const find = (root) => {
            const editor = root.querySelector('rvn-animation-editor');
            if (editor) return editor;
            for (const node of root.querySelectorAll('*')) {
              const found = node.shadowRoot && find(node.shadowRoot);
              if (found) return found;
            }
          };
          const editor = find(document);
          const tween = editor.store.selectProperties({ side: 'prev' });
          if (Math.abs(tween.scaleX.initialValue - 1 / 1.1) > 0.0001) return false;
          if (Math.abs(tween.scaleX.keyframes[0].value - 1.1) > 0.0001) return false;
          const frames = [];
          for (const timeMs of [0, 500, 999, 0]) {
            await editor.transformedHandlers.handleRulerTimeScrub({ _event: { detail: { timeMs } } });
            frames.push(editor.shadowRoot.querySelector('canvas').toDataURL());
          }
          return frames[0] !== frames[1] && frames[1] !== frames[2] && frames[0] === frames[3];
        })()
    value: true
