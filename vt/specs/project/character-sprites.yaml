  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: wait
    ms: 500
  - action: customEvent
    name: routevn:vt:navigate
    detail:
      path: /project/characters
  - action: waitFor
    selector: rvn-characters
    state: attached
    timeoutMs: 10000
  - action: waitFor
    selector: "#addBtnHeaderRef0"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "#addBtnHeaderRef0"
    steps:
      - action: click
  - action: waitFor
    selector: "#addCharacterDialog[open]"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "#addCharacterDialog rtgl-input#field0 input"
    steps:
      - action: clear
      - action: write
        value: Sprite Mina
  - action: select
    selector: "#addCharacterDialog rtgl-input#field1 input"
    steps:
      - action: clear
      - action: write
        value: Character used for sprite coverage.
  - action: select
    selector: "#addCharacterDialog rtgl-button[data-action-id='submit']"
    steps:
      - action: click
  - action: waitFor
    selector: "#charactersView #itemRef0x0"
    state: visible
    timeoutMs: 10000
  - action: wait
    ms: 500
  - action: select
    selector: "#spritesButtonRef0x0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-character-sprites
    state: attached
    timeoutMs: 10000
  - action: assert
    type: url
    value: /project/character-sprites
  - action: wait
    ms: 500
  - action: screenshot
  - action: waitFor
    selector: "#uploadBtnHeaderRef0"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "#uploadBtnHeaderRef0"
    steps:
      - action: click
  - action: waitFor
    selector: 'rtgl-global-ui rtgl-dropdown-menu#dropdownMenu [role="menuitem"]:has-text("Image")'
    state: visible
    timeoutMs: 5000
  - action: select
    selector: 'rtgl-global-ui rtgl-dropdown-menu#dropdownMenu [role="menuitem"]:has-text("Image")'
    steps:
      - action: click
  - action: waitFor
    selector: "#rtglVtFilePickerInput"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "#rtglVtFilePickerInput"
    steps:
      - action: upload
        files:
          - vt/fixtures/spritesheet.png
  - action: wait
    ms: 500
  - action: waitFor
    selector: "#groupview #itemRef0x0"
    state: visible
    timeoutMs: 20000
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: click
  - action: waitFor
    selector: "#detailView"
    state: attached
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: screenshot
  - action: select
    selector: "#groupview #itemRef0x0"
    steps:
      - action: dblclick
  - action: waitFor
    selector: "#previewOverlay"
    state: visible
    timeoutMs: 10000
  - action: wait
    ms: 400
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { if (!root) return undefined; const direct = root.querySelector?.(selector); if (direct) return direct; for (const node of root.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; return deepQuery(document, '#previewBreadcrumb')?.textContent?.trim(); })()"
    value: Default Sprites > spritesheet
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { if (!root) return undefined; const direct = root.querySelector?.(selector); if (direct) return direct; for (const node of root.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const breadcrumb = deepQuery(document, '#previewBreadcrumb').getBoundingClientRect(); const controls = deepQuery(document, '#previewModeControls').getBoundingClientRect(); return Math.abs((breadcrumb.top + breadcrumb.height / 2) - (controls.top + controls.height / 2)) < 1 && Math.abs(controls.top - 8) < 1; })()"
    value: true
  - action: screenshot
  - action: keypress
    key: l
  - action: wait
    ms: 200
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { if (!root) return undefined; const direct = root.querySelector?.(selector); if (direct) return direct; for (const node of root.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; return deepQuery(document, '#previewFitModeButton')?.getAttribute('aria-pressed'); })()"
    value: "true"
  - action: keypress
    key: h
  - action: wait
    ms: 200
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { if (!root) return undefined; const direct = root.querySelector?.(selector); if (direct) return direct; for (const node of root.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; return deepQuery(document, '#previewCanvasModeButton')?.getAttribute('aria-pressed'); })()"
    value: "true"
  - action: select
    selector: "#previewOverlay"
    steps:
      - action: focus
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "#previewOverlay"
    state: hidden
    timeoutMs: 10000
  - action: wait
    ms: 250
  - action: select
    selector: "#detailHeader"
    steps:
      - action: click
  - action: waitFor
    selector: "#editDialog[open]"
    state: attached
    timeoutMs: 5000
  - action: wait
