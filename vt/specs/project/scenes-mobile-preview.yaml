---
title: Project Scenes Mobile Preview
description: Covers the touch scene-map preview, rotated mobile layout, and running-canvas hit testing.
url: /projects?vt-input-mode=touch
skipInitialScreenshot: true
viewport:
  id: mobile
  width: 390
  height: 844
steps:
