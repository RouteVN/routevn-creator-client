---
title: Project Language Settings Page
description: Covers the language settings route, selector, and locale switching.
url: /projects
skipInitialScreenshot: true
viewport:
  id: wide
  width: 1440
  height: 900
steps:
  - action: waitFor
    selector: "[data-testid='create-project-button']"
    state: visible
    timeoutMs: 5000
  - action: select
    testId: create-project-button
    steps:
      - action: click
  - action: waitFor
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    state: attached
    timeoutMs: 5000
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    steps:
      - action: clear
      - action: write
        value: Project One
  - action: select
    selector: "#createProjectSubmitButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: customEvent
    name: routevn:vt:navigate
    detail:
      path: /project/language
  - action: waitFor
    selector: rvn-language
    state: attached
    timeoutMs: 10000
  - action: assert
    type: url
    value: /project/language
  - action: waitFor
    selector: "rtgl-select#languageSelect [data-testid='select-button']"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 300
  - action: screenshot
  - action: select
    selector: "rtgl-select#languageSelect [data-testid='select-button']"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-select#languageSelect #option1"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "rtgl-select#languageSelect #option1"
    steps:
      - action: click
  - action: wait
    ms: 500
  - action: screenshot
---
