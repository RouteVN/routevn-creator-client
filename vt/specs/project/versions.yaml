---
title: Project Versions Workflow
description: Covers the versions page empty state, version creation, and version edit submit flow.
url: /projects
skipInitialScreenshot: true
viewport:
  id: wide
  width: 1440
  height: 900
steps:
  - action: waitFor
    selector: "[data-testid='create-project-button']"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: select
    testId: create-project-button
    steps:
      - action: click
  - action: waitFor
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    state: attached
    timeoutMs: 5000
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    steps:
      - action: clear
      - action: write
        value: VT Project Versions Workflow
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field1 input
    steps:
      - action: clear
      - action: write
        value: Covers project versions create and edit flows.
  - action: select
    selector: "#iconPlaceholder"
    steps:
      - action: click
  - action: waitFor
    selector: "#rtglVtFilePickerInput"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "#rtglVtFilePickerInput"
    steps:
      - action: upload
        files:
          - crates/routevn-packager/fixtures/sample-icon.png
  - action: waitFor
    selector: "#iconCropDialog #confirmButton:not([disabled])"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "#iconCropDialog #confirmButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#iconCropDialog #dialog"
    state: hidden
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: select
    selector: "rtgl-form#createProjectForm rtgl-button[data-action-id=submit]"
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: wait
    ms: 500
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: wait
    ms: 500
  - action: customEvent
    name: routevn:vt:navigate
    detail:
      path: /project/releases/platform-details
  - action: waitFor
    selector: rvn-platform-details
    state: attached
    timeoutMs: 10000
  - action: select
    selector: "#addPlatformButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-dropdown-menu#addPlatformMenu [role='menuitem']:has-text('macOS')"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "rtgl-dropdown-menu#addPlatformMenu [role='menuitem']:has-text('macOS')"
    steps:
      - action: click
  - action: waitFor
    selector: "#platformEditDialog"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#platformEditDialog rtgl-input#field2 input"
    steps:
      - action: clear
      - action: write
        value: com.example.vt-versions
  - action: select
    selector: "#platformEditDialog rtgl-button[data-action-id='submit']"
    steps:
      - action: click
  - action: waitFor
    selector: "#platformEditDialog"
    state: hidden
    timeoutMs: 10000
  - action: customEvent
    name: routevn:vt:navigate
    detail:
      path: /project/releases/versions
  - action: waitFor
    selector: rvn-versions
    state: attached
    timeoutMs: 10000
  - action: assert
    type: url
    value: /project/releases/versions
  - action: wait
    ms: 4500
  - action: screenshot
  - action: select
    selector: "#saveVersionBtn"
    steps:
      - action: click
  - action: waitFor
    selector: "#versionDialog"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "#versionDialog rtgl-input#field0 input"
    steps:
      - action: clear
      - action: write
        value: Version One
  - action: select
    selector: "#versionDialog rtgl-textarea#field1 textarea"
    steps:
      - action: clear
      - action: write
        value: First generated checkpoint.
  - action: select
    selector: "#versionDialog rtgl-button[data-action-id='submit']"
    steps:
      - action: click
  - action: waitFor
    selector: "#versionDialog"
    state: hidden
    timeoutMs: 10000
  - action: waitFor
    selector: "#versionItemRef0"
    state: visible
    timeoutMs: 10000
  - action: waitFor
    selector: "#detailMacosApplicationBtn"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 500
  - action: screenshot
  - action: select
    selector: "#detailMacosApplicationBtn"
    steps:
      - action: click
  - action: waitFor
    selector: "#exportConfirmationDialog"
    state: visible
    timeoutMs: 5000
  - action: waitFor
    selector: "#macosExportForm rtgl-input#field0 input"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: screenshot
  - action: keypress
    key: Escape
  - action: waitFor
    selector: "#exportConfirmationDialog"
    state: hidden
    timeoutMs: 5000
  - action: select
    selector: "#detailHeader"
    steps:
      - action: click
  - action: waitFor
    selector: "#versionDialog"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "#versionDialog rtgl-input#field0 input"
    steps:
      - action: clear
      - action: write
        value: Version One Edited
  - action: select
    selector: "#versionDialog rtgl-textarea#field1 textarea"
    steps:
      - action: clear
      - action: write
        value: Edited checkpoint for the page-based VT suite.
  - action: screenshot
  - action: select
    selector: "#versionDialog rtgl-button[data-action-id='submit']"
    steps:
      - action: click
  - action: waitFor
    selector: "#versionDialog"
    state: hidden
    timeoutMs: 10000
  - action: wait
    ms: 500
  - action: screenshot
  - action: customEvent
    name: routevn:vt:navigate
    detail:
      path: /project/releases/platform-details
  - action: waitFor
    selector: rvn-platform-details
    state: attached
    timeoutMs: 10000
  - action: waitFor
    selector: "#platformEditButton"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 450
  - action: screenshot
  - action: select
    selector: "#platformEditButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#platformEditDialog"
    state: visible
    timeoutMs: 5000
  - action: wait
    ms: 250
  - action: screenshot
---
