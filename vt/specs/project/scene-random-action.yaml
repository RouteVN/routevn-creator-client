---
title: Scene Random Action Workflow
description: Covers adding a Random action from the scene editor actions dialog, picking outcome weights and their chances, and the saved Random row and line marker.
url: /projects
skipInitialScreenshot: true
viewport:
  id: wide
  width: 1440
  height: 900
steps:
  - action: waitFor
    selector: "[data-testid='create-project-button']"
    state: visible
    timeoutMs: 5000
  - action: select
    testId: create-project-button
    steps:
      - action: click
  - action: waitFor
    selector: rtgl-form#createProjectForm rtgl-input[data-field-name='name'] input
    state: attached
    timeoutMs: 5000
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input[data-field-name='name'] input
    steps:
      - action: clear
      - action: write
        value: Project One
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input[data-field-name='description'] input
    steps:
      - action: clear
      - action: write
        value: Random action coverage.
  - action: select
    selector: "rtgl-form#createProjectForm rtgl-select[data-field-name='language'] [data-testid='select-button']"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-form#createProjectForm rtgl-select[data-field-name='language'] #option1"
    state: attached
    timeoutMs: 5000
  - action: select
    selector: "rtgl-form#createProjectForm rtgl-select[data-field-name='language'] #option1"
    steps:
      - action: click
  - action: select
    selector: "rtgl-form#createProjectForm rtgl-button[data-action-id=submit]"
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: select
    selector: "#sidebar [data-item-id='scenes']"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-scenes
    state: attached
    timeoutMs: 10000
  - action: waitFor
    selector: "#whiteboard #itemRef0"
    state: visible
    timeoutMs: 10000
  - action: waitFor
    selector: "#mapAddHintClose"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#mapAddHintClose"
    steps:
      - action: click
  - action: select
    selector: "#whiteboard #itemRef0"
    steps:
      - action: dblclick
  - action: waitFor
    selector: rvn-scene-editor-lexical
    state: attached
    timeoutMs: 20000
  - action: waitFor
    selector: 'rvn-lexical-scene-document-editor .editor-paragraph[data-selected="true"][data-mode="block"]'
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "#systemActions #addActionButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-system-actions-dialog-surface rtgl-dialog[open][bare]"
    state: attached
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-actions#commandLineActions [data-action-id='31']"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom #addOutcomeButton"
    state: visible
    timeoutMs: 10000
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #submitButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-global-ui rtgl-dialog#dialog[open]"
    state: attached
    timeoutMs: 10000
  - action: assert
    type: text
    selector: "rtgl-global-ui .dialog-message"
    value: "Please add at least one outcome."
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "rtgl-global-ui #confirmButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rtgl-global-ui rtgl-dialog#dialog[open]"
    state: detached
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #addOutcomeButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom rtgl-select#weightSelect [data-testid='select-button']"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-random#commandLineRandom rtgl-select#weightSelect [data-testid='select-button']"
    steps:
      - action: click
  # The weight options are 1 to 100, so option 2 is weight 3.
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom rtgl-select#weightSelect #option2"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-random#commandLineRandom rtgl-select#weightSelect #option2"
    steps:
      - action: click
  - action: wait
    ms: 250
  - action: assert
    type: text
    selector: "rvn-command-line-random#commandLineRandom #outcomeChance"
    value: "100%"
  - action: screenshot
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #saveOutcomeButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom #addOutcomeButton"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #addOutcomeButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom rtgl-select#weightSelect [data-testid='select-button']"
    state: visible
    timeoutMs: 10000
  - action: assert
    type: text
    selector: "rvn-command-line-random#commandLineRandom #outcomeChance"
    value: "25%"
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #saveOutcomeButton"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom #submitButton"
    state: visible
    timeoutMs: 10000
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "rvn-command-line-random#commandLineRandom #submitButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#actionItemRandom"
    state: visible
    timeoutMs: 10000
  - action: wait
    ms: 250
  - action: screenshot
  - action: select
    selector: "#actionItemRandom"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-command-line-random#commandLineRandom [data-outcome-id]"
    state: attached
    timeoutMs: 10000
  - action: assert
    type: js
    fn: eval
    args:
      - "(() => { const deepQuery = (root, selector) => { const direct = root?.querySelector?.(selector); if (direct) return direct; for (const node of root?.querySelectorAll?.('*') ?? []) { const found = node.shadowRoot ? deepQuery(node.shadowRoot, selector) : undefined; if (found) return found; } return undefined; }; const random = deepQuery(document, 'rvn-command-line-random#commandLineRandom'); return [...random.shadowRoot.querySelectorAll('[data-outcome-id] rtgl-text[s=sm]')].map((node) => node.textContent.trim()).join(' | '); })()"
    value: "Weight 3 (75%) | Weight 1 (25%)"
  - action: wait
    ms: 250
  - action: screenshot
---
