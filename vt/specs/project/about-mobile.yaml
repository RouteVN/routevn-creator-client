---
title: Project About Page Mobile
description: Covers the two-column Community grid and All social media action on mobile.
url: /projects?vt-input-mode=touch
skipInitialScreenshot: true
viewport:
  id: mobile
  width: 360
  height: 800
steps:
  - action: waitFor
    selector: "#mobileCreateMenuButton"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#mobileCreateMenuButton"
    steps:
      - action: click
  - action: waitFor
    selector: "#mobileActionMenu [role='menuitem']:has-text('Create Project')"
    state: visible
    timeoutMs: 5000
  - action: select
    selector: "#mobileActionMenu [role='menuitem']:has-text('Create Project')"
    steps:
      - action: click
  - action: waitFor
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    state: attached
    timeoutMs: 5000
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field0 input
    steps:
      - action: clear
      - action: write
        value: Project One
  - action: select
    selector: rtgl-form#createProjectForm rtgl-input#field1 input
    steps:
      - action: clear
      - action: write
        value: Covers the mobile About page.
  - action: select
    selector: rtgl-form#createProjectForm rtgl-button[data-action-id=submit]
    steps:
      - action: click
  - action: waitFor
    selector: "#projectItem0"
    state: visible
    timeoutMs: 30000
  - action: select
    selector: "#projectItem0"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-project
    state: attached
    timeoutMs: 10000
  - action: select
    selector: "#mobileTabItem3"
    steps:
      - action: click
  - action: waitFor
    selector: "rvn-mobile-sidebar [data-item-id='about']"
    state: visible
    timeoutMs: 10000
  - action: select
    selector: "rvn-mobile-sidebar [data-item-id='about']"
    steps:
      - action: click
  - action: waitFor
    selector: rvn-about
    state: attached
    timeoutMs: 10000
  - action: waitFor
    selector: "rvn-about rtgl-grid[cols='2'] rtgl-button[data-id='all-social']"
    state: visible
    timeoutMs: 10000
  - action: screenshot
---
